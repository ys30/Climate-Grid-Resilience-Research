name: SRP EPA EIA930 day-block bootstrap temporal robustness
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/srp-epa-eia930-day-bootstrap.yml'
      - 'src/grid_resilience/srp_epa_eia930_day_block_bootstrap.py'
      - 'tests/test_srp_epa_eia930_day_block_bootstrap.py'
jobs:
  day-block-source-robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test exact baseline matching and block bootstrap semantics
        run: |
          python -m pip install -e '.[dev]'
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python -m pytest -q tests/test_srp_epa_eia930_day_block_bootstrap.py
      - name: Retrieve verified original EPA ERA5 and official EIA930 archived source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/srp_day_bootstrap/epa outputs/srp_day_bootstrap/eia outputs/srp_day_bootstrap/results
          gh run download 41961038085 --repo ys30/Climate-Grid-Resilience-Research \
            --name srp-epa-local-july744-real-august-era5 \
            --dir outputs/srp_day_bootstrap/epa
          gh run download 41325415594 --repo ys30/Climate-Grid-Resilience-Research \
            --name JULY2024-EIA930-OFFICIAL-RAW-ADJUSTED-BALANCE \
            --dir outputs/srp_day_bootstrap/eia
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          a=Path("outputs/srp_day_bootstrap")
          s=pd.read_csv(a/"epa/completed/epa_local_july_744h_observed_summary.csv")
          assert len(s)==10 and s.complete_matched_hours.eq(744).all()
          assert (a/"eia/official_2024_july_combined.csv").exists()
          PY
      - name: Compute original-source 31-day clustered resampling diagnostics
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m grid_resilience.srp_epa_eia930_day_block_bootstrap \
            --epa-era5-panel outputs/srp_day_bootstrap/epa/completed/epa_local_july_744h_observed_era5.csv \
            --eia930-july outputs/srp_day_bootstrap/eia/official_2024_july_combined.csv \
            --replicates 120 --seed 20261105 \
            --output outputs/srp_day_bootstrap/results
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          p=Path("outputs/srp_day_bootstrap/results")
          a=pd.read_csv(p/"epa_eia930_local_day_block_bootstrap.csv")
          m=json.loads((p/"epa_eia930_local_day_block_bootstrap_manifest.json").read_text())
          assert len(a)==20 and set(a.outcome)=={"reported_operation_lpm","gross_load_given_positive_operation_mw"}
          assert a.days_in_source.eq(31).all()
          assert a.replicates_requested.eq(120).all()
          assert a.loc[a.outcome.eq("reported_operation_lpm")].interval_reportable.all()
          assert not m["causal_temperature_derating_identified"]
          assert not m["pypsa_reliability_calibration_authorized"]
          assert not m["august_eia_demand_imputed"]
          print("Source and scope assertions passed.")
          print(a[["facility_id","epa_unit_id","outcome","point_estimate_per_c",
            "replicates_admitted","percentile_2_5","percentile_97_5",
            "interval_reportable","interval_excludes_zero_descriptively"]].to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srp-2024-epa-eia930-local-day-block-bootstrap
          path: outputs/srp_day_bootstrap/results/
          if-no-files-found: warn
