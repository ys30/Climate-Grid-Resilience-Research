name: EIA-860 2024 official generator inventory intake
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia860-official-intake.yml'
      - 'src/grid_resilience/eia860_generator_extract.py'
      - 'src/grid_resilience/eia860_partial_fleet_capacity.py'
      - 'src/grid_resilience/eia930_eia860_capacity_key_audit.py'
      - 'src/grid_resilience/eia860_ba_capacity_gap.py'
      - 'src/grid_resilience/eia860_plant_ba_capacity.py'
      - 'src/grid_resilience/hybrid_capacity_diagnostics.py'
      - 'src/grid_resilience/bpat_hydro_counterfactual.py'
      - 'src/grid_resilience/bpat_reported_hydro_capacity.py'
      - 'src/grid_resilience/bpat_hydro_availability_sensitivity.py'
      - 'src/grid_resilience/bpat_eia930_hydro_observation.py'
      - 'src/grid_resilience/bpat_hydro_energy_context.py'
      - 'src/grid_resilience/bpat_hydro_monthly_budget_sensitivity.py'
      - 'src/grid_resilience/bpat_hydro_joint_constraints.py'
      - 'src/grid_resilience/multi_technology_dispatch.py'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Excel reader
        run: python -m pip install openpyxl
      - name: Download and audit official 2024 EIA-860
        run: |
          mkdir -p outputs/eia860_intake
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          from zipfile import ZipFile
          from openpyxl import load_workbook
          import hashlib,io,json
          url="https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602024.zip"
          req=Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urlopen(req,timeout=150) as r: data=r.read()
          manifest={"source_url":url,"sha256":hashlib.sha256(data).hexdigest(),
                    "bytes":len(data),"workbooks":[],"observed_generator_join_completed":False}
          Path("outputs/eia860_intake/eia8602024.zip").write_bytes(data)
          with ZipFile(io.BytesIO(data)) as z:
              manifest["entries"]=z.namelist()
              names=[n for n in z.namelist() if "3_1_Generator" in n and n.endswith(".xlsx")]
              if len(names)!=1: raise ValueError(f"Expected one generator workbook: {names}")
              wb=load_workbook(io.BytesIO(z.read(names[0])),read_only=True,data_only=True)
              for ws in wb:
                  head=[]
                  for row in ws.iter_rows(min_row=1,max_row=6,values_only=True):
                      head.append([str(v)[:110] if v is not None else None for v in row[:85]])
                  manifest["workbooks"].append({"name":names[0],"sheet":ws.title,"first_six_rows":head})
              wb.close()
          Path("outputs/eia860_intake/official_2024_schema.json").write_text(json.dumps(manifest,indent=2))
          print("Official archive bytes",len(data))
          print("Generator sheets",[x["sheet"] for x in manifest["workbooks"]])
          for x in manifest["workbooks"]:
              if "Operable" in x["sheet"]:
                  for i,row in enumerate(x["first_six_rows"],1):
                      print("Operable header row",i," | ".join(f"{j+1}:{v}" for j,v in enumerate(row) if v is not None)[:7000])
          PY
      - name: Inspect official EIA-860 plant BA attribution field
        run: |
          python - <<'PY'
          import io,json,zipfile
          from openpyxl import load_workbook
          from pathlib import Path
          archive=Path("outputs/eia860_intake/eia8602024.zip")
          manifest={"plant_workbooks":[],"plant_ba_extraction_verified":False}
          with zipfile.ZipFile(archive) as z:
              names=[x for x in z.namelist() if x.lower().endswith(".xlsx") and ("2___Plant" in x or "2_Plant" in x or "2__Plant" in x)]
              for name in names:
                  wb=load_workbook(io.BytesIO(z.read(name)),read_only=True,data_only=True)
                  for ws in wb:
                      headers=[]
                      for row in ws.iter_rows(min_row=1,max_row=4,values_only=True):
                          headers.append([str(x).strip() if x is not None else "" for x in row])
                      terms=[{"row":i+1,"columns":[{"index":k+1,"name":v} for k,v in enumerate(h) if "balancing" in v.lower() or "plant code" in v.lower()]} for i,h in enumerate(headers)]
                      manifest["plant_workbooks"].append({"workbook":name,"sheet":ws.title,"matched_columns":terms})
                  wb.close()
          Path("outputs/eia860_intake/plant_ba_schema_probe.json").write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2)[:12000])
          PY
      - name: Extract 2024 official EIA-860 generator inventory
        run: |
          python -m pip install -e .
          python -m grid_resilience.eia860_generator_extract \
            --archive outputs/eia860_intake/eia8602024.zip \
            --output outputs/eia860_intake
      - name: Attribute EIA-860 2024 generator nameplate capacity using Plant BA
        run: |
          python -m grid_resilience.eia860_plant_ba_capacity \
            --archive outputs/eia860_intake/eia8602024.zip \
            --generators outputs/eia860_intake/eia860_2024_operable_generators.csv \
            --output outputs/eia860_intake
          cat outputs/eia860_intake/eia860_plant_ba_capacity_manifest.json
      - name: Fetch official EIA-923 and measure real generator matching
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          url="https://www.eia.gov/electricity/data/eia923/archive/xls/f923_2024.zip"
          with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=150) as r:
              Path("outputs/eia860_intake/f923_2024.zip").write_bytes(r.read())
          PY
          python -m grid_resilience.eia923_generator_extract \
            --archive outputs/eia860_intake/f923_2024.zip \
            --output outputs/eia860_intake
          python -m grid_resilience.eia_generator_match_audit \
            --eia923 outputs/eia860_intake/eia923_generator_month_net_mwh.csv \
            --eia860 outputs/eia860_intake/eia860_2024_operable_generators.csv \
            --output outputs/eia860_intake
      - name: Derive actual matched EIA-860 partial-fleet nameplate capacity
        run: |
          python -m grid_resilience.eia860_partial_fleet_capacity \
            --eia923 outputs/eia860_intake/eia923_generator_month_net_mwh.csv \
            --eia860 outputs/eia860_intake/eia860_2024_operable_generators.csv \
            --output outputs/eia860_intake
      - name: Audit conservative fuel classification eligibility
        run: |
          python -m grid_resilience.eia_classification_eligibility \
            --eia923 outputs/eia860_intake/eia923_generator_month_net_mwh.csv \
            --eia860 outputs/eia860_intake/eia860_2024_operable_generators.csv \
            --output outputs/eia860_intake
      - name: Build clearly labeled partial-fleet BA technology monthly candidates
        run: |
          python -m grid_resilience.eia_single_fuel_candidates \
            --eia923 outputs/eia860_intake/eia923_generator_month_net_mwh.csv \
            --eia860 outputs/eia860_intake/eia860_2024_operable_generators.csv \
            --output outputs/eia860_intake
      - name: Audit month and technology coverage of candidate observed generation
        run: |
          python -m grid_resilience.eia_monthly_coverage_profile \
            --input outputs/eia860_intake/observed_single_fuel_candidate_ba_technology_month.csv \
            --output outputs/eia860_intake
      - name: Select full-year observed comparison candidates
        run: |
          python -m grid_resilience.eia_complete_year_gate \
            --matrix outputs/eia860_intake/candidate_monthly_coverage_matrix.csv \
            --output outputs/eia860_intake
      - name: Reconcile partial EIA-860 capacity keys to observed EIA-930 direct fuel categories
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          url="https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2024_Jan_Jun.csv"
          with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=150) as r:
              data=r.read()
          if len(data)<1000:raise ValueError("Unexpected EIA-930 response")
          Path("outputs/eia860_intake/eia930_balance_h1_2024.csv").write_bytes(data)
          PY
          python -m grid_resilience.eia930_fuel_reporting_coverage \
            --csv outputs/eia860_intake/eia930_balance_h1_2024.csv \
            --output outputs/eia860_intake
          python -m grid_resilience.eia930_fuel_candidate_gate \
            --coverage outputs/eia860_intake/eia930_fuel_reporting_coverage.csv \
            --output outputs/eia860_intake
          python -m grid_resilience.eia930_technology_crosswalk \
            --eligible outputs/eia860_intake/eligible_fuel_groups.csv \
            --output outputs/eia860_intake
          python -m grid_resilience.eia930_eia860_capacity_key_audit \
            --capacity outputs/eia860_intake/partial_fleet_eia860_nameplate_capacity.csv \
            --candidates outputs/eia860_intake/direct_technology_candidates.csv \
            --output outputs/eia860_intake
          cat outputs/eia860_intake/eia930_eia860_capacity_key_manifest.json
          python -m grid_resilience.eia930_eia860_capacity_key_audit \
            --capacity outputs/eia860_intake/eia860_plant_ba_capacity_candidates.csv \
            --candidates outputs/eia860_intake/direct_technology_candidates.csv \
            --output outputs/eia860_intake/full_plant_ba
          cat outputs/eia860_intake/full_plant_ba/eia930_eia860_capacity_key_manifest.json
      - name: Quantify full EIA-860 capacity inventory versus partial BA attribution
        run: |
          python -m grid_resilience.eia860_ba_capacity_gap \
            --inventory outputs/eia860_intake/eia860_2024_operable_generators.csv \
            --partial outputs/eia860_intake/partial_fleet_eia860_nameplate_capacity.csv \
            --keys outputs/eia860_intake/eia930_eia860_capacity_key_audit.csv \
            --output outputs/eia860_intake
          cat outputs/eia860_intake/eia860_ba_capacity_gap_manifest.json
      - name: Test February dispatch with reported demand and EIA-860 capacity candidates
        run: |
          python -m pip install -e '.[model]'
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from grid_resilience.eia930_six_month_demand import extract
          from grid_resilience.multi_technology_dispatch import solve
          root=Path("outputs/eia860_intake")
          out=root/"real_capacity_assumed_availability_solve"
          extract(root/"eia930_balance_h1_2024.csv",out)
          demand=pd.read_csv(out/"hourly_ba_demand.csv")
          cap=pd.read_csv(root/"eia860_plant_ba_capacity_candidates.csv")
          observed=pd.read_csv(root/"direct_technology_candidates.csv")
          keys=observed[["ba","pypsa_technology"]].rename(columns={"pypsa_technology":"technology"})
          capacity=cap.merge(keys,on=["ba","technology"],how="inner",validate="one_to_one")
          # Include all matching candidate technologies; unmatched fleet is NOT assumed absent.
          if len(capacity)!=19:raise ValueError(f"Expected 19 observed-capacity keys, got {len(capacity)}")
          # For a reproducible test, only synthetic availability is supplied.
          capacity=capacity[["ba","technology","nameplate_capacity_mw"]].rename(columns={"nameplate_capacity_mw":"capacity_mw"})
          # Demand requires capacity inventory for all four BAs.
          if set(capacity.ba)!=set(demand.ba):raise ValueError("Missing model BA capacity")
          prices={"solar":0,"wind":0,"nuclear":10,"coal":35,"gas":55,"oil":110}
          capacity["marginal_cost"]=capacity.technology.map(prices)
          if capacity.marginal_cost.isna().any():raise ValueError("Unknown marginal cost")
          times=demand[["timestamp"]].drop_duplicates().assign(_k=1)
          plants=capacity[["ba","technology"]].assign(_k=1)
          availability=times.merge(plants,on="_k").drop(columns="_k")
          availability["availability_pu"]=1.0
          capacity.to_csv(out/"reported_nameplate_assumed_cost.csv",index=False)
          availability.to_csv(out/"synthetic_availability.csv",index=False)
          result=solve(out/"hourly_ba_demand.csv",out/"reported_nameplate_assumed_cost.csv",
                       out/"synthetic_availability.csv",out/"dispatch")
          meta={"source_capacity":"EIA-860 2024 Plant BA matched nameplate single-fuel candidates",
                "source_demand":"EIA-930 February 2024 reported hourly demand",
                "availability_assumed":True,"marginal_costs_assumed":True,
                "transmission_links_included":False,"technology_groups":len(capacity),
                "historical_calibration_certified":False}
          (out/"hybrid_solve_manifest.json").write_text(json.dumps(meta,indent=2))
          print(json.dumps(meta,indent=2))
          print(result.to_string(index=False))
          PY
      - name: Diagnose modeled BA capacity versus peak demand
        run: |
          python -m grid_resilience.hybrid_capacity_diagnostics \
            --demand outputs/eia860_intake/real_capacity_assumed_availability_solve/hourly_ba_demand.csv \
            --capacity outputs/eia860_intake/real_capacity_assumed_availability_solve/reported_nameplate_assumed_cost.csv \
            --shortfall outputs/eia860_intake/real_capacity_assumed_availability_solve/dispatch/shortfall_by_ba.csv \
            --output outputs/eia860_intake/real_capacity_assumed_availability_solve
          cat outputs/eia860_intake/real_capacity_assumed_availability_solve/hybrid_model_capacity_diagnostics.csv
      - name: BPAT hypothetical firm-hydro capacity sensitivity
        run: |
          python -m grid_resilience.bpat_hydro_counterfactual \
            --demand outputs/eia860_intake/real_capacity_assumed_availability_solve/hourly_ba_demand.csv \
            --capacity outputs/eia860_intake/real_capacity_assumed_availability_solve/reported_nameplate_assumed_cost.csv \
            --availability outputs/eia860_intake/real_capacity_assumed_availability_solve/synthetic_availability.csv \
            --output outputs/eia860_intake/real_capacity_assumed_availability_solve/hydro_counterfactual
          cat outputs/eia860_intake/real_capacity_assumed_availability_solve/hydro_counterfactual/hypothetical_hydro_sensitivity_manifest.json
      - name: Compare reported BPAT non-pumped hydro nameplate with baseline
        run: |
          python -m grid_resilience.bpat_reported_hydro_capacity \
            --demand outputs/eia860_intake/real_capacity_assumed_availability_solve/hourly_ba_demand.csv \
            --capacity outputs/eia860_intake/real_capacity_assumed_availability_solve/reported_nameplate_assumed_cost.csv \
            --availability outputs/eia860_intake/real_capacity_assumed_availability_solve/synthetic_availability.csv \
            --full-capacity outputs/eia860_intake/eia860_plant_ba_capacity_candidates.csv \
            --output outputs/eia860_intake/real_capacity_assumed_availability_solve/reported_hydro
          cat outputs/eia860_intake/real_capacity_assumed_availability_solve/reported_hydro/reported_hydro_capacity_experiment_manifest.json
          cat outputs/eia860_intake/real_capacity_assumed_availability_solve/reported_hydro/reported_hydro_capacity_experiment.csv
      - name: Sweep BPAT EIA-860 hydro capacity hourly availability assumptions
        run: |
          python -m grid_resilience.bpat_hydro_availability_sensitivity \
            --demand outputs/eia860_intake/real_capacity_assumed_availability_solve/hourly_ba_demand.csv \
            --capacity outputs/eia860_intake/real_capacity_assumed_availability_solve/reported_nameplate_assumed_cost.csv \
            --availability outputs/eia860_intake/real_capacity_assumed_availability_solve/synthetic_availability.csv \
            --full-capacity outputs/eia860_intake/eia860_plant_ba_capacity_candidates.csv \
            --output outputs/eia860_intake/real_capacity_assumed_availability_solve/hydro_availability_sweep
          cat outputs/eia860_intake/real_capacity_assumed_availability_solve/hydro_availability_sweep/hydro_availability_sensitivity.csv
      - name: Check EIA-930 observed BPAT hydro plus pumped category against capacity threshold
        run: |
          python -m grid_resilience.bpat_eia930_hydro_observation \
            --balance outputs/eia860_intake/eia930_balance_h1_2024.csv \
            --capacity outputs/eia860_intake/eia860_plant_ba_capacity_candidates.csv \
            --output outputs/eia860_intake/bpat_hydro_observation
          cat outputs/eia860_intake/bpat_hydro_observation/bpat_eia930_hydro_observation_manifest.json
      - name: Quantify observed mixed hydro energy against demand and model shortfall
        run: |
          python -m grid_resilience.bpat_hydro_energy_context \
            --observed-hourly outputs/eia860_intake/bpat_hydro_observation/bpat_eia930_reported_hydro_hourly.csv \
            --demand outputs/eia860_intake/real_capacity_assumed_availability_solve/hourly_ba_demand.csv \
            --shortfall outputs/eia860_intake/real_capacity_assumed_availability_solve/dispatch/shortfall_by_ba.csv \
            --output outputs/eia860_intake/bpat_hydro_observation
          cat outputs/eia860_intake/bpat_hydro_observation/bpat_hydro_energy_context.json
      - name: Solve monthly BPAT hydro energy-budget sensitivity
        run: |
          python -m grid_resilience.bpat_hydro_monthly_budget_sensitivity \
            --demand outputs/eia860_intake/real_capacity_assumed_availability_solve/hourly_ba_demand.csv \
            --capacity outputs/eia860_intake/real_capacity_assumed_availability_solve/reported_nameplate_assumed_cost.csv \
            --availability outputs/eia860_intake/real_capacity_assumed_availability_solve/synthetic_availability.csv \
            --full-capacity outputs/eia860_intake/eia860_plant_ba_capacity_candidates.csv \
            --observed-context outputs/eia860_intake/bpat_hydro_observation/bpat_hydro_energy_context.json \
            --output outputs/eia860_intake/hydro_energy_budget_sweep
          cat outputs/eia860_intake/hydro_energy_budget_sweep/hypothetical_monthly_hydro_budget_sweep.csv
          python - <<'PY'
          import pandas as pd
          p='outputs/eia860_intake/hydro_energy_budget_sweep/hypothetical_monthly_hydro_budget_sweep.csv'
          t=pd.read_csv(p)
          assert len(t)==10
          assert t.assumed_budget_fraction_of_mixed_observed_energy.is_monotonic_increasing
          assert (t.bpat_shortfall_mwh.diff().dropna()<=1e-4).all()
          assert t.iloc[0].bpat_shortfall_mwh>0
          print('Hydro monthly energy budget monotonicity and zero-budget baseline verified')
          PY
      - name: Joint hourly power and monthly energy hydro sensitivity
        run: |
          python -m grid_resilience.bpat_hydro_joint_constraints \
            --demand outputs/eia860_intake/real_capacity_assumed_availability_solve/hourly_ba_demand.csv \
            --capacity outputs/eia860_intake/real_capacity_assumed_availability_solve/reported_nameplate_assumed_cost.csv \
            --availability outputs/eia860_intake/real_capacity_assumed_availability_solve/synthetic_availability.csv \
            --full-capacity outputs/eia860_intake/eia860_plant_ba_capacity_candidates.csv \
            --observed-context outputs/eia860_intake/bpat_hydro_observation/bpat_hydro_energy_context.json \
            --output outputs/eia860_intake/hydro_joint_constraints
          cat outputs/eia860_intake/hydro_joint_constraints/bpat_hydro_joint_constraints.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-eia860-2024-schema
          path: |
            outputs/eia860_intake/official_2024_schema.json
            outputs/eia860_intake/bpat_hydro_observation/bpat_eia930_hydro_observation_manifest.json
            outputs/eia860_intake/bpat_hydro_observation/bpat_hydro_energy_context.json
            outputs/eia860_intake/hydro_joint_constraints/bpat_hydro_joint_constraints.csv
            outputs/eia860_intake/hydro_joint_constraints/bpat_hydro_joint_constraints_manifest.json
            outputs/eia860_intake/hydro_energy_budget_sweep/hypothetical_monthly_hydro_budget_sweep.csv
            outputs/eia860_intake/hydro_energy_budget_sweep/hypothetical_monthly_hydro_budget_manifest.json
            outputs/eia860_intake/bpat_hydro_observation/bpat_eia930_reported_hydro_hourly.csv
            outputs/eia860_intake/plant_ba_schema_probe.json
            outputs/eia860_intake/eia860_extraction_manifest.json
            outputs/eia860_intake/partial_fleet_eia860_nameplate_capacity.csv
            outputs/eia860_intake/partial_fleet_eia860_capacity_manifest.json
            outputs/eia860_intake/eia930_eia860_capacity_key_audit.csv
            outputs/eia860_intake/eia930_eia860_capacity_key_manifest.json
            outputs/eia860_intake/eia860_ba_capacity_gap_manifest.json
            outputs/eia860_intake/eia860_plant_ba_capacity_candidates.csv
            outputs/eia860_intake/eia860_plant_ba_capacity_manifest.json
            outputs/eia860_intake/full_plant_ba/eia930_eia860_capacity_key_audit.csv
            outputs/eia860_intake/full_plant_ba/eia930_eia860_capacity_key_manifest.json
            outputs/eia860_intake/real_capacity_assumed_availability_solve/hybrid_solve_manifest.json
            outputs/eia860_intake/real_capacity_assumed_availability_solve/hydro_availability_sweep/hydro_availability_sensitivity.csv
            outputs/eia860_intake/real_capacity_assumed_availability_solve/hydro_availability_sweep/hydro_availability_sensitivity_manifest.json
            outputs/eia860_intake/real_capacity_assumed_availability_solve/reported_hydro/reported_hydro_capacity_experiment.csv
            outputs/eia860_intake/real_capacity_assumed_availability_solve/reported_hydro/reported_hydro_capacity_experiment_manifest.json
            outputs/eia860_intake/real_capacity_assumed_availability_solve/hydro_counterfactual/hypothetical_hydro_sensitivity.csv
            outputs/eia860_intake/real_capacity_assumed_availability_solve/hydro_counterfactual/hypothetical_hydro_sensitivity_manifest.json
            outputs/eia860_intake/real_capacity_assumed_availability_solve/hybrid_model_capacity_diagnostics.csv
            outputs/eia860_intake/real_capacity_assumed_availability_solve/hybrid_model_capacity_diagnostics_manifest.json
            outputs/eia860_intake/real_capacity_assumed_availability_solve/dispatch/shortfall_by_ba.csv
            outputs/eia860_intake/eia860_2024_operable_generators.csv
            outputs/eia860_intake/generator_join_coverage_by_ba.csv
            outputs/eia860_intake/generator_join_coverage_manifest.json
            outputs/eia860_intake/unmatched_generator_months.csv
            outputs/eia860_intake/classification_eligibility_by_ba.csv
            outputs/eia860_intake/classification_eligibility_manifest.json
            outputs/eia860_intake/single_fuel_candidate_manifest.json
            outputs/eia860_intake/observed_single_fuel_candidate_ba_technology_month.csv
            outputs/eia860_intake/candidate_monthly_coverage_manifest.json
            outputs/eia860_intake/candidate_monthly_coverage_matrix.csv
            outputs/eia860_intake/candidate_monthly_coverage_by_technology.csv
            outputs/eia860_intake/complete_year_candidate_diagnostics.csv
            outputs/eia860_intake/complete_year_gate_manifest.json
          if-no-files-found: warn
