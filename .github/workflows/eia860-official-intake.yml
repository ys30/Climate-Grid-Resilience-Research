name: EIA-860 2024 official generator inventory intake
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia860-official-intake.yml'
      - 'src/grid_resilience/eia860_generator_extract.py'
      - 'src/grid_resilience/eia860_partial_fleet_capacity.py'
      - 'src/grid_resilience/eia930_eia860_capacity_key_audit.py'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Excel reader
        run: python -m pip install openpyxl
      - name: Download and audit official 2024 EIA-860
        run: |
          mkdir -p outputs/eia860_intake
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          from zipfile import ZipFile
          from openpyxl import load_workbook
          import hashlib,io,json
          url="https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602024.zip"
          req=Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urlopen(req,timeout=150) as r: data=r.read()
          manifest={"source_url":url,"sha256":hashlib.sha256(data).hexdigest(),
                    "bytes":len(data),"workbooks":[],"observed_generator_join_completed":False}
          Path("outputs/eia860_intake/eia8602024.zip").write_bytes(data)
          with ZipFile(io.BytesIO(data)) as z:
              manifest["entries"]=z.namelist()
              names=[n for n in z.namelist() if "3_1_Generator" in n and n.endswith(".xlsx")]
              if len(names)!=1: raise ValueError(f"Expected one generator workbook: {names}")
              wb=load_workbook(io.BytesIO(z.read(names[0])),read_only=True,data_only=True)
              for ws in wb:
                  head=[]
                  for row in ws.iter_rows(min_row=1,max_row=6,values_only=True):
                      head.append([str(v)[:110] if v is not None else None for v in row[:85]])
                  manifest["workbooks"].append({"name":names[0],"sheet":ws.title,"first_six_rows":head})
              wb.close()
          Path("outputs/eia860_intake/official_2024_schema.json").write_text(json.dumps(manifest,indent=2))
          print("Official archive bytes",len(data))
          print("Generator sheets",[x["sheet"] for x in manifest["workbooks"]])
          for x in manifest["workbooks"]:
              if "Operable" in x["sheet"]:
                  for i,row in enumerate(x["first_six_rows"],1):
                      print("Operable header row",i," | ".join(f"{j+1}:{v}" for j,v in enumerate(row) if v is not None)[:7000])
          PY
      - name: Extract 2024 official EIA-860 generator inventory
        run: |
          python -m pip install -e .
          python -m grid_resilience.eia860_generator_extract \
            --archive outputs/eia860_intake/eia8602024.zip \
            --output outputs/eia860_intake
      - name: Fetch official EIA-923 and measure real generator matching
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          url="https://www.eia.gov/electricity/data/eia923/archive/xls/f923_2024.zip"
          with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=150) as r:
              Path("outputs/eia860_intake/f923_2024.zip").write_bytes(r.read())
          PY
          python -m grid_resilience.eia923_generator_extract \
            --archive outputs/eia860_intake/f923_2024.zip \
            --output outputs/eia860_intake
          python -m grid_resilience.eia_generator_match_audit \
            --eia923 outputs/eia860_intake/eia923_generator_month_net_mwh.csv \
            --eia860 outputs/eia860_intake/eia860_2024_operable_generators.csv \
            --output outputs/eia860_intake
      - name: Derive actual matched EIA-860 partial-fleet nameplate capacity
        run: |
          python -m grid_resilience.eia860_partial_fleet_capacity \
            --eia923 outputs/eia860_intake/eia923_generator_month_net_mwh.csv \
            --eia860 outputs/eia860_intake/eia860_2024_operable_generators.csv \
            --output outputs/eia860_intake
      - name: Audit conservative fuel classification eligibility
        run: |
          python -m grid_resilience.eia_classification_eligibility \
            --eia923 outputs/eia860_intake/eia923_generator_month_net_mwh.csv \
            --eia860 outputs/eia860_intake/eia860_2024_operable_generators.csv \
            --output outputs/eia860_intake
      - name: Build clearly labeled partial-fleet BA technology monthly candidates
        run: |
          python -m grid_resilience.eia_single_fuel_candidates \
            --eia923 outputs/eia860_intake/eia923_generator_month_net_mwh.csv \
            --eia860 outputs/eia860_intake/eia860_2024_operable_generators.csv \
            --output outputs/eia860_intake
      - name: Audit month and technology coverage of candidate observed generation
        run: |
          python -m grid_resilience.eia_monthly_coverage_profile \
            --input outputs/eia860_intake/observed_single_fuel_candidate_ba_technology_month.csv \
            --output outputs/eia860_intake
      - name: Select full-year observed comparison candidates
        run: |
          python -m grid_resilience.eia_complete_year_gate \
            --matrix outputs/eia860_intake/candidate_monthly_coverage_matrix.csv \
            --output outputs/eia860_intake
      - name: Reconcile partial EIA-860 capacity keys to observed EIA-930 direct fuel categories
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          url="https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2024_Jan_Jun.csv"
          with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=150) as r:
              data=r.read()
          if len(data)<1000:raise ValueError("Unexpected EIA-930 response")
          Path("outputs/eia860_intake/eia930_balance_h1_2024.csv").write_bytes(data)
          PY
          python -m grid_resilience.eia930_fuel_reporting_coverage \
            --csv outputs/eia860_intake/eia930_balance_h1_2024.csv \
            --output outputs/eia860_intake
          python -m grid_resilience.eia930_fuel_candidate_gate \
            --coverage outputs/eia860_intake/eia930_fuel_reporting_coverage.csv \
            --output outputs/eia860_intake
          python -m grid_resilience.eia930_technology_crosswalk \
            --eligible outputs/eia860_intake/eligible_fuel_groups.csv \
            --output outputs/eia860_intake
          python -m grid_resilience.eia930_eia860_capacity_key_audit \
            --capacity outputs/eia860_intake/partial_fleet_eia860_nameplate_capacity.csv \
            --candidates outputs/eia860_intake/direct_technology_candidates.csv \
            --output outputs/eia860_intake
          cat outputs/eia860_intake/eia930_eia860_capacity_key_manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-eia860-2024-schema
          path: |
            outputs/eia860_intake/official_2024_schema.json
            outputs/eia860_intake/eia860_extraction_manifest.json
            outputs/eia860_intake/partial_fleet_eia860_nameplate_capacity.csv
            outputs/eia860_intake/partial_fleet_eia860_capacity_manifest.json
            outputs/eia860_intake/eia930_eia860_capacity_key_audit.csv
            outputs/eia860_intake/eia930_eia860_capacity_key_manifest.json
            outputs/eia860_intake/eia860_2024_operable_generators.csv
            outputs/eia860_intake/generator_join_coverage_by_ba.csv
            outputs/eia860_intake/generator_join_coverage_manifest.json
            outputs/eia860_intake/unmatched_generator_months.csv
            outputs/eia860_intake/classification_eligibility_by_ba.csv
            outputs/eia860_intake/classification_eligibility_manifest.json
            outputs/eia860_intake/single_fuel_candidate_manifest.json
            outputs/eia860_intake/observed_single_fuel_candidate_ba_technology_month.csv
            outputs/eia860_intake/candidate_monthly_coverage_manifest.json
            outputs/eia860_intake/candidate_monthly_coverage_matrix.csv
            outputs/eia860_intake/candidate_monthly_coverage_by_technology.csv
            outputs/eia860_intake/complete_year_candidate_diagnostics.csv
            outputs/eia860_intake/complete_year_gate_manifest.json
          if-no-files-found: warn
