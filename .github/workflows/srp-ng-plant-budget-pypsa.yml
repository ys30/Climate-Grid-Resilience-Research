name: SRP NG monthly plant budget PyPSA sensitivity
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/srp-ng-plant-budget-pypsa.yml'
      - 'src/grid_resilience/srp_ng_plant_budget_pypsa.py'
      - 'src/grid_resilience/srp_ng_nongas_hourly_replay.py'
      - 'tests/test_srp_ng_nongas_hourly_replay.py'
      - 'src/grid_resilience/srp_assumed_multitech_factorial.py'
      - 'tests/test_srp_assumed_multitech_factorial.py'
      - 'src/grid_resilience/srp_assumed_multitech_threshold_grid.py'
      - 'tests/test_srp_assumed_multitech_threshold_grid.py'
      - 'src/grid_resilience/srp_fossil_nuclear_decoupled_grid.py'
      - 'tests/test_srp_fossil_nuclear_decoupled_grid.py'
      - 'src/grid_resilience/srp_gas_coal_nuclear_grid.py'
      - 'tests/test_srp_gas_coal_nuclear_grid.py'
      - 'tests/test_srp_ng_plant_budget_pypsa.py'
      - 'tests/test_srp_ng_plant_budget_pypsa_solver.py'
      - 'src/grid_resilience/srp_ng_plant_nameplate_envelope.py'
      - 'src/grid_resilience/eia923_page1_all_fuels.py'
      - 'src/grid_resilience/eia860_plant_ba_census.py'
jobs:
  source-conditioned-scenario:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full scientific optimizer and test both input and real solver
        run: |
          python -m pip install -e '.[dev,model]'
          python -m pytest -q tests/test_srp_ng_plant_budget_pypsa.py tests/test_srp_ng_plant_budget_pypsa_solver.py tests/test_srp_ng_plant_nameplate_envelope.py tests/test_srp_ng_nongas_hourly_replay.py tests/test_srp_assumed_multitech_factorial.py tests/test_srp_assumed_multitech_threshold_grid.py tests/test_srp_fossil_nuclear_decoupled_grid.py tests/test_srp_gas_coal_nuclear_grid.py
      - name: Download official EIA source tables and track SHA256
        run: |
          mkdir -p outputs/ng_budget
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          root=Path("outputs/ng_budget")
          sources={
            "eia860_2024.zip":"https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602024.zip",
            "eia923_2024.zip":"https://www.eia.gov/electricity/data/eia923/archive/xls/f923_2024.zip",
            "eia930_2023H2.csv":"https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2023_Jul_Dec.csv",
            "eia930_2024H1.csv":"https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2024_Jan_Jun.csv",
          }
          manifest={}
          for name,url in sources.items():
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=120) as response:
                  data=response.read(150_000_001)
              if not data or len(data)>150_000_000:
                  raise ValueError("Invalid official source bytes")
              (root/name).write_bytes(data)
              manifest[name]={"url":url,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}
          (root/"source_provenance.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
      - name: Extract official Page1, Page4 and Plant BA capacity
        run: |
          python -m grid_resilience.eia923_page1_all_fuels --archive outputs/ng_budget/eia923_2024.zip --output outputs/ng_budget --ba SRP --month 1
          python -m grid_resilience.eia923_generator_extract --archive outputs/ng_budget/eia923_2024.zip --output outputs/ng_budget
          python -m grid_resilience.eia860_generator_extract --archive outputs/ng_budget/eia860_2024.zip --output outputs/ng_budget
          python -m grid_resilience.eia860_plant_ba_census \
            --archive outputs/ng_budget/eia860_2024.zip \
            --operable outputs/ng_budget/eia860_2024_operable_generators.csv \
            --page4 outputs/ng_budget/eia923_generator_month_net_mwh.csv \
            --ba SRP --output outputs/ng_budget
          python -m grid_resilience.srp_page1_eia860_fuel_crosswalk \
            --page1 outputs/ng_budget/page1_all_fuels_reported_ba.csv \
            --roster outputs/ng_budget/plant_ba_operable_generator_census.csv \
            --output outputs/ng_budget
          python -m grid_resilience.srp_ng_plant_nameplate_envelope \
            --candidates outputs/ng_budget/page1_eia860_fuel_candidate_rows.csv \
            --roster outputs/ng_budget/plant_ba_operable_generator_census.csv \
            --output outputs/ng_budget --year 2024 --month 1
      - name: Assemble full UTC January observed EIA930 boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path("outputs/ng_budget")
          parts=[]
          for name in ["eia930_2023H2.csv","eia930_2024H1.csv"]:
              x=pd.read_csv(root/name,low_memory=False)
              x=x.loc[x["Balancing Authority"].astype(str).str.strip().eq("SRP")].copy()
              t=pd.to_datetime(x["UTC Time at End of Hour"],utc=True,errors="raise")
              x=x.loc[t.ge(pd.Timestamp("2024-01-01T01:00Z"))&
                      t.le(pd.Timestamp("2024-02-01T00:00Z"))]
              parts.append(x)
          pd.concat(parts,ignore_index=True).to_csv(root/"january_srp_eia930.csv",index=False)
          PY
          python -m grid_resilience.eia930_net_interchange_audit \
            --csv outputs/ng_budget/january_srp_eia930.csv \
            --ba SRP --year 2024 --month 1 --output outputs/ng_budget
      - name: Run standalone 744h NG portfolio with two monthly budget sensitivities
        run: |
          python -m grid_resilience.srp_ng_plant_budget_pypsa \
            --balance outputs/ng_budget/eia930_hourly_balance_audit.csv \
            --plant-envelope outputs/ng_budget/ng_plant_nameplate_energy_envelope.csv \
            --year 2024 --month 1 --scales 1.0 0.75 --output outputs/ng_budget
          python - <<'PY'
          from pathlib import Path
          import pandas as pd,json
          r=Path("outputs/ng_budget")
          x=pd.read_csv(r/"ng_portfolio_budget_comparison.csv").set_index("scenario")
          assert len(x)==3
          assert (x.max_hourly_bus_residual_mw<1e-3).all()
          assert x.loc["unlimited_nameplate","modeled_portfolio_gap_mwh"] <= x.loc["1x_page1","modeled_portfolio_gap_mwh"]+1e-2
          assert x.loc["1x_page1","modeled_portfolio_gap_mwh"] <= x.loc["0.75x_page1","modeled_portfolio_gap_mwh"]+1e-2
          assert not x.historical_calibration_certified.any()
          assert not x.portfolio_gap_is_real_unserved_energy.any()
          print(x[["scenario_gas_dispatch_mwh","modeled_portfolio_gap_mwh","max_hourly_bus_residual_mw"]])
          PY
      - name: Replay observed non-gas fuel and vary plant gas monthly budget
        run: |
          python -m grid_resilience.srp_ng_nongas_hourly_replay \
            --boundary outputs/ng_budget/eia930_hourly_balance_audit.csv \
            --eia930 outputs/ng_budget/january_srp_eia930.csv \
            --plants outputs/ng_budget/ng_plant_nameplate_energy_envelope.csv \
            --output outputs/ng_budget
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          root=Path("outputs/ng_budget")
          x=pd.read_csv(root/"ng_budget_nongas_replay_comparison.csv").set_index("scenario")
          assert set(x.index)=={"unlimited","1x_page1","0.75x_page1","0.5x_page1"}
          assert (x.max_hourly_bus_residual_mw<1e-3).all()
          assert x.loc["unlimited","artificial_portfolio_gap_mwh"]<=x.loc["1x_page1","artificial_portfolio_gap_mwh"]+0.01
          assert x.loc["1x_page1","artificial_portfolio_gap_mwh"]<=x.loc["0.75x_page1","artificial_portfolio_gap_mwh"]+0.01
          assert x.loc["0.75x_page1","artificial_portfolio_gap_mwh"]<=x.loc["0.5x_page1","artificial_portfolio_gap_mwh"]+0.01
          assert not x.historical_calibration_certified.any()
          print(x[["modeled_ng_generation_mwh","fixed_non_gas_replay_mwh","artificial_portfolio_gap_mwh"]])
          PY
      - name: Solve matched 744h multi-technology factorial with source-independent synthetic availability
        run: |
          python -m grid_resilience.srp_assumed_multitech_factorial \
            --boundary outputs/ng_budget/eia930_hourly_balance_audit.csv \
            --roster outputs/ng_budget/plant_ba_operable_generator_census.csv \
            --output outputs/ng_budget/synthetic_multitech
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          folder=Path("outputs/ng_budget/synthetic_multitech")
          x=pd.read_csv(folder/"assumed_multitech_four_case_results.csv").set_index("scenario")
          m=json.loads((folder/"assumed_multitech_manifest.json").read_text())
          assert set(x.index)=={"baseline","thermal_derating","wind_derating","compound"}
          assert x.loc["baseline","modeled_gap_mwh"]<=x.loc["thermal_derating","modeled_gap_mwh"]+0.01
          assert x.loc["baseline","modeled_gap_mwh"]<=x.loc["wind_derating","modeled_gap_mwh"]+0.01
          assert x.loc["thermal_derating","modeled_gap_mwh"]<=x.loc["compound","modeled_gap_mwh"]+0.01
          assert x.loc["wind_derating","modeled_gap_mwh"]<=x.loc["compound","modeled_gap_mwh"]+0.01
          assert m["independent_of_eia930_fuel_generation_replay"]
          assert m["technology_availability_is_synthetic_not_meteorology"]
          assert not m["historical_calibration_certified"]
          print(x)
          PY
      - name: Run 16-case thermal-wind availability threshold grid (synthetic, noncausal)
        run: |
          python -m grid_resilience.srp_assumed_multitech_threshold_grid \
            --boundary outputs/ng_budget/eia930_hourly_balance_audit.csv \
            --roster outputs/ng_budget/plant_ba_operable_generator_census.csv \
            --thermal-factors 0 0.25 0.5 1 \
            --wind-factors 0 0.5 0.75 1 \
            --output outputs/ng_budget/assumed_threshold_grid
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          p=Path("outputs/ng_budget/assumed_threshold_grid")
          x=pd.read_csv(p/"thermal_wind_threshold_grid.csv")
          m=json.loads((p/"threshold_grid_manifest.json").read_text())
          assert len(x)==16 and m["grid_points"]==16
          assert m["uses_observed_generation_as_availability"] is False
          assert m["uses_independent_meteorology_as_availability"] is False
          assert m["climate_attribution_certified"] is False
          assert m["historical_calibration_certified"] is False
          print(x.to_string(index=False))
          PY
      - name: Solve independent fossil versus nuclear 20-case SRP sensitivity grid
        run: |
          python -m grid_resilience.srp_fossil_nuclear_decoupled_grid \
            --boundary outputs/ng_budget/eia930_hourly_balance_audit.csv \
            --roster outputs/ng_budget/plant_ba_operable_generator_census.csv \
            --output outputs/ng_budget/decoupled_grid
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          root=Path("outputs/ng_budget/decoupled_grid")
          x=pd.read_csv(root/"decoupled_factorial_grid.csv")
          b=pd.read_csv(root/"decoupled_threshold_brackets.csv")
          m=json.loads((root/"decoupled_grid_manifest.json").read_text())
          assert len(x)==20 and len(b)==4
          assert m["grid_scenarios"]==20 and m["availability_monotonicity_verified"]
          assert not m["historical_calibration_certified"]
          assert not m["eia930_generation_replayed"]
          print(x.to_string(index=False))
          print(b.to_string(index=False))
          PY
      - name: Run 36 matched gas-coal-nuclear-wind assumed availability cases
        run: |
          python -m grid_resilience.srp_gas_coal_nuclear_grid \
            --boundary outputs/ng_budget/eia930_hourly_balance_audit.csv \
            --roster outputs/ng_budget/plant_ba_operable_generator_census.csv \
            --output outputs/ng_budget/gas_coal_grid
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          root=Path("outputs/ng_budget/gas_coal_grid")
          x=pd.read_csv(root/"gas_coal_nuclear_wind_grid.csv")
          bounds=pd.read_csv(root/"conditional_gas_threshold_brackets.csv")
          m=json.loads((root/"gas_coal_grid_manifest.json").read_text())
          assert len(x)==36 and len(bounds)==12
          assert m["scenario_count"]==36 and m["monotonicity_verified"]
          assert not m["historical_calibration_certified"]
          assert not m["historical_eia930_generation_replayed"]
          print(m)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srp-jan2024-ng-plant-budget-pypsa
          path: |
            outputs/ng_budget/source_provenance.json
            outputs/ng_budget/page1_all_fuels_manifest.json
            outputs/ng_budget/plant_ba_generator_census_manifest.json
            outputs/ng_budget/page1_eia860_fuel_candidate_manifest.json
            outputs/ng_budget/ng_plant_nameplate_energy_envelope.csv
            outputs/ng_budget/ng_plant_nameplate_energy_envelope_manifest.json
            outputs/ng_budget/eia930_balance_metrics.json
            outputs/ng_budget/ng_plant_budget_scenarios.csv
            outputs/ng_budget/ng_portfolio_budget_comparison.csv
            outputs/ng_budget/ng_portfolio_budget_manifest.json
            outputs/ng_budget/ng_budget_nongas_replay_comparison.csv
            outputs/ng_budget/ng_nongas_replay_manifest.json
            outputs/ng_budget/eia930_replayed_fuel_hourly.csv
            outputs/ng_budget/ng_nongas_replay_unlimited_hourly.csv
            outputs/ng_budget/ng_nongas_replay_1x_page1_hourly.csv
            outputs/ng_budget/ng_nongas_replay_0.75x_page1_hourly.csv
            outputs/ng_budget/ng_nongas_replay_0.5x_page1_hourly.csv
            outputs/ng_budget/synthetic_multitech/assumed_multitech_manifest.json
            outputs/ng_budget/synthetic_multitech/assumed_multitech_capacity.csv
            outputs/ng_budget/synthetic_multitech/assumed_multitech_four_case_results.csv
            outputs/ng_budget/synthetic_multitech/baseline/shortfall_hourly_mw.csv
            outputs/ng_budget/synthetic_multitech/thermal_derating/shortfall_hourly_mw.csv
            outputs/ng_budget/synthetic_multitech/wind_derating/shortfall_hourly_mw.csv
            outputs/ng_budget/synthetic_multitech/compound/shortfall_hourly_mw.csv
            outputs/ng_budget/assumed_threshold_grid/threshold_grid_manifest.json
            outputs/ng_budget/assumed_threshold_grid/thermal_wind_threshold_grid.csv
            outputs/ng_budget/assumed_threshold_grid/thermal_no_gap_grid_boundary.csv
            outputs/ng_budget/assumed_threshold_grid/thermal_wind_discrete_interactions.csv
            outputs/ng_budget/assumed_threshold_grid/nonoverlapping_technology_nameplates.csv
            outputs/ng_budget/decoupled_grid/decoupled_factorial_grid.csv
            outputs/ng_budget/decoupled_grid/decoupled_threshold_brackets.csv
            outputs/ng_budget/decoupled_grid/decoupled_grid_manifest.json
            outputs/ng_budget/decoupled_grid/generator_class_nameplates.csv
            outputs/ng_budget/gas_coal_grid/gas_coal_nuclear_wind_grid.csv
            outputs/ng_budget/gas_coal_grid/conditional_gas_threshold_brackets.csv
            outputs/ng_budget/gas_coal_grid/gas_coal_grid_manifest.json
            outputs/ng_budget/gas_coal_grid/technology_nameplates.csv
          if-no-files-found: warn
