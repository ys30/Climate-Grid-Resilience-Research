name: Paper C E1 official EIA860 2024 roster versus partial proxy admissibility
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paperc-e1-annual-inventory-vs-original-proxy.yml'
      - 'src/grid_resilience/paperc_e1_original_proxy_vs_eia860_annual.py'
      - 'tests/test_paperc_e1_original_proxy_vs_eia860_annual.py'
jobs:
  e1-source-audited-capacity-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed original source population tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_paperc_e1_original_proxy_vs_eia860_annual.py
      - name: Restore exact audited official annual roster, monthly matched identity and original 2024 model input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/e1/annual outputs/e1/monthly outputs/e1/original outputs/e1/compare
          gh run download 42441328634 --repo ys30/Climate-Grid-Resilience-Research \
            --name paperc-eia860-official-2023-2024-fourba-nameplate-comparison \
            --dir outputs/e1/annual
          gh run download 42455881405 --repo ys30/Climate-Grid-Resilience-Research \
            --name paperc-eia930a-cited-eia860m-2025-feb-aug-exact-vintage-match \
            --dir outputs/e1/monthly
          gh run download 42104106361 --repo ys30/Climate-Grid-Resilience-Research \
            --name july2024-4-disjoint-real-week-factorial-source-results \
            --dir outputs/e1/original
      - name: Produce source-scoped BA E1 technology and roster reconciliation without firm capacity invention
        run: |
          python -m grid_resilience.paperc_e1_original_proxy_vs_eia860_annual \
            --annual outputs/e1/annual/results/eia860_2024_fourba_nameplate_candidates.csv \
            --annual-scope outputs/e1/annual/results/year_specific_capacity_scope.json \
            --original-proxy outputs/e1/original/inputs/frozen_partial_eia860_capacity.csv \
            --monthly-identity outputs/e1/monthly/results/paper_c_eia930a_2024_annual_vs_august2025_ba_summary.csv \
            --output outputs/e1/compare
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          p=Path("outputs/e1/compare")
          x=pd.read_csv(p/"paper_c_e1_original_proxy_vs_2024_annual_roster_scope.csv")
          scope=json.loads((p/"paper_c_e1_original_proxy_vs_annual_scope.json").read_text())
          assert len(x)==4
          assert x.eia930a_aug2025_unverified_id.sum()==231
          assert x.thermal_proxy_not_same_population_as_eia860_gas_only.all()
          assert not x.source_populations_additively_comparable.any()
          assert scope["ready_for_e2_physical_fleet_substitution"] is False
          print("E1 original-source inventory scope reconciliation passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paperc-e1-eia860-annual-roster-vs-original-proxy-source-identity-reconciliation
          path: outputs/e1/compare/
          if-no-files-found: error
