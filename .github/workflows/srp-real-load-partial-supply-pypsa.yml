name: Real SRP January demand and partial EIA-860 capacity PyPSA
on:
  push:
    paths:
      - '.github/workflows/srp-real-load-partial-supply-pypsa.yml'
      - 'src/grid_resilience/eia860_partial_ba_capacity.py'
      - 'src/grid_resilience/srp_monthly_availability_sensitivity.py'
      - 'src/grid_resilience/fuel_specific_screen_assumptions.py'
      - 'src/grid_resilience/srp_source_scope_gap.py'
      - 'src/grid_resilience/srp_net_exchange_pypsa_screen.py'
      - 'src/grid_resilience/srp_explicit_import_export.py'
      - 'src/grid_resilience/exchange_boundary_preflight.py'
      - 'tests/test_exchange_boundary_preflight.py'
      - 'src/grid_resilience/srp_exchange_synthetic_regression.py'
      - 'src/grid_resilience/exchange_analytical_reference.py'
      - 'src/grid_resilience/srp_hourly_oracle_audit.py'
      - 'tests/test_srp_hourly_oracle_audit.py'
      - 'src/grid_resilience/srp_shortfall_duration_audit.py'
      - 'tests/test_srp_shortfall_duration_audit.py'
      - 'src/grid_resilience/srp_firm_capacity_frontier.py'
      - 'tests/test_srp_firm_capacity_frontier.py'
      - 'src/grid_resilience/exchange_pypsa_solver_smoke.py'
      - 'tests/test_exchange_analytical_reference.py'
      - 'src/grid_resilience/bidirectional_interchange_screen.py'
      - 'src/grid_resilience/exact_generator_scope_audit.py'
      - 'src/grid_resilience/excluded_capacity_upper_bound.py'
      - 'src/grid_resilience/page4_fuel_descriptive_comparison.py'
      - 'src/grid_resilience/hy_ps_pypsa_components.py'
      - 'src/grid_resilience/hy_ps_budget_scenario.py'
      - 'src/grid_resilience/srp_hy_ps_paired_sensitivity.py'
      - 'tests/test_exact_generator_scope_audit.py'
      - 'tests/test_hy_ps_budget_scenario.py'
      - 'tests/test_hy_ps_pypsa_components.py'
      - 'tests/test_hy_ps_physical_invariants.py'
  workflow_dispatch:
jobs:
  real-input-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[model,dev]' openpyxl
      - name: Preflight compile and test HY PS components before EIA downloads
        run: |
          python -m py_compile src/grid_resilience/bidirectional_interchange_screen.py src/grid_resilience/srp_hy_ps_paired_sensitivity.py src/grid_resilience/hy_ps_pypsa_components.py
          python -m pytest -q tests/test_exchange_boundary_preflight.py tests/test_exchange_analytical_reference.py tests/test_srp_hourly_oracle_audit.py tests/test_srp_shortfall_duration_audit.py tests/test_srp_firm_capacity_frontier.py tests/test_exact_generator_scope_audit.py tests/test_hy_ps_budget_scenario.py tests/test_hy_ps_pypsa_components.py tests/test_hy_ps_physical_invariants.py
      - name: Short PyPSA solver and signed spillage smoke before EIA downloads
        run: python -u -m grid_resilience.exchange_pypsa_solver_smoke
      - name: Download actual EIA-930, EIA-860 and EIA-923 source archives
        run: |
          mkdir -p outputs/srp_real_screen
          python - <<'PY'
          import urllib.request,hashlib,json
          from pathlib import Path
          root=Path('outputs/srp_real_screen')
          sources={
             'eia930_2023H2':'https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2023_Jul_Dec.csv',
             'eia930_2024H1':'https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2024_Jan_Jun.csv',
             'eia860_2024':'https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602024.zip',
             'eia923_2024':'https://www.eia.gov/electricity/data/eia923/archive/xls/f923_2024.zip'}
          manifest={}
          for key,url in sources.items():
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=120) as response:
                  data=response.read(150_000_001)
              if not data or len(data)>150_000_000:raise ValueError('Invalid source length')
              suffix='.csv' if key.startswith('eia930') else '.zip'
              (root/(key+suffix)).write_bytes(data)
              manifest[key]={'url':url,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          (root/'input_provenance.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Recover full UTC January from adjacent official EIA-930 source files
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          root=Path('outputs/srp_real_screen')
          series=[]
          for key in ['eia930_2023H2','eia930_2024H1']:
              x=pd.read_csv(root/(key+'.csv'),low_memory=False)
              x=x[x['Balancing Authority'].astype(str).str.strip().eq('SRP')].copy()
              x['_t']=pd.to_datetime(x['UTC Time at End of Hour'],utc=True,errors='raise')
              x=x[(x._t>=pd.Timestamp('2024-01-01T01:00Z')) &
                  (x._t<=pd.Timestamp('2024-02-01T00:00Z'))].drop(columns=['_t'])
              series.append(x)
          pd.concat(series,ignore_index=True).to_csv(root/'source_combined.csv',index=False)
          PY
          python -m grid_resilience.eia930_balance_archive_import --archive outputs/srp_real_screen/source_combined.csv --ba SRP --year 2024 --month 1 --output outputs/srp_real_screen/observed_hourly_demand.csv
      - name: Extract EIA-860 inventory and EIA-923 BA generator identities
        run: |
          python -m grid_resilience.eia860_generator_extract --archive outputs/srp_real_screen/eia860_2024.zip --output outputs/srp_real_screen
          python -m grid_resilience.eia923_generator_extract --archive outputs/srp_real_screen/eia923_2024.zip --output outputs/srp_real_screen
          python -m grid_resilience.eia860_partial_ba_capacity --eia860 outputs/srp_real_screen/eia860_2024_operable_generators.csv --page4 outputs/srp_real_screen/eia923_generator_month_net_mwh.csv --ba SRP --output outputs/srp_real_screen
      - name: Solve real load with partial real nameplate and explicit screening assumptions
        run: |
          python -m grid_resilience.monthly_pypsa_screen --demand outputs/srp_real_screen/observed_hourly_demand.csv --capacity outputs/srp_real_screen/partial_ba_capacity_screen.csv --year 2024 --month 1 --output outputs/srp_real_screen
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          r=Path('outputs/srp_real_screen')
          d=pd.read_csv(r/'observed_hourly_demand.csv')
          c=pd.read_csv(r/'partial_ba_capacity_screen.csv')
          model=pd.read_csv(r/'modeled_monthly_generation.csv')
          s=json.loads((r/'screening_manifest.json').read_text())
          assert len(d)==744 and abs(d.demand_mw.sum()-2455626)<1e-3
          assert len(c)>0 and c.capacity_mw.gt(0).all()
          total=model.modeled_generation_mwh.sum()+s['modeled_unserved_mwh_by_ba']['SRP']
          assert abs(total-d.demand_mw.sum())<1e-3, (total,d.demand_mw.sum())
          print('Observed SRP demand MWh:',d.demand_mw.sum())
          print('Partial source-matched capacity MW:',c.capacity_mw.sum())
          print('Modeled generation MWh:',model.modeled_generation_mwh.sum())
          print('Modeled unserved MWh:',s['modeled_unserved_mwh_by_ba']['SRP'])
          print('Historical calibration certified: NO')
          PY
      - name: Run full-month hypothetical availability sensitivity with actual load
        run: |
          python -m grid_resilience.srp_monthly_availability_sensitivity --demand outputs/srp_real_screen/observed_hourly_demand.csv --capacity outputs/srp_real_screen/partial_ba_capacity_screen.csv --year 2024 --month 1 --output outputs/srp_real_screen
      - name: Solve with illustrative fuel-specific derating and merit order
        run: |
          python -m grid_resilience.fuel_specific_screen_assumptions --capacity outputs/srp_real_screen/partial_ba_capacity_screen.csv --output outputs/srp_real_screen
          python -m grid_resilience.monthly_pypsa_screen --demand outputs/srp_real_screen/observed_hourly_demand.csv --capacity outputs/srp_real_screen/fuel_assumption_capacity_screen.csv --year 2024 --month 1 --output outputs/srp_real_screen/fuel_scenario
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          p=Path('outputs/srp_real_screen/fuel_scenario')
          m=json.loads((p/'screening_manifest.json').read_text())
          d=pd.read_csv('outputs/srp_real_screen/observed_hourly_demand.csv')
          g=pd.read_csv(p/'modeled_monthly_generation.csv')
          u=m['modeled_unserved_mwh_by_ba']['SRP']
          assert abs(g.modeled_generation_mwh.sum()+u-d.demand_mw.sum())<1e-3
          print('Fuel-specific scenario modeled MWh:',g.modeled_generation_mwh.sum(),'unserved MWh:',u)
          PY
      - name: Audit Page4 source and screened fleet overlap, fail closed on source discrepancy
        run: |
          python -m grid_resilience.srp_source_scope_gap --page4 outputs/srp_real_screen/eia923_generator_month_net_mwh.csv --inventory outputs/srp_real_screen/eia860_2024_operable_generators.csv --screen outputs/srp_real_screen/partial_ba_capacity_screen.csv --ba SRP --month 2024-01 --output outputs/srp_real_screen
      - name: Audit EIA-930 interchange and solve with observed export sink
        run: |
          python -m grid_resilience.eia930_net_interchange_audit --csv outputs/srp_real_screen/source_combined.csv --ba SRP --year 2024 --month 1 --output outputs/srp_real_screen
          python -m grid_resilience.srp_net_exchange_pypsa_screen --balance outputs/srp_real_screen/eia930_hourly_balance_audit.csv --capacity outputs/srp_real_screen/fuel_assumption_capacity_screen.csv --ba SRP --year 2024 --month 1 --output outputs/srp_real_screen/interchange_case
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('outputs/srp_real_screen/interchange_case/interchange_screen_manifest.json').read_text())
          assert abs(m['exogenous_supply_requirement_mwh']-5098932.0)<1e-3
          assert abs(m['modeled_supply_mwh']+m['modeled_unserved_mwh']-m['exogenous_supply_requirement_mwh'])<1e-3
          assert m['historical_calibration_certified'] is False
          PY
      - name: Solve actual 744-hour EIA-930 with explicit bidirectional boundary
        run: |
          python -m grid_resilience.bidirectional_interchange_screen --balance outputs/srp_real_screen/eia930_hourly_balance_audit.csv --capacity outputs/srp_real_screen/fuel_assumption_capacity_screen.csv --ba SRP --year 2024 --month 1 --output outputs/srp_real_screen/bidirectional_case
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/srp_real_screen/bidirectional_case/bidirectional_boundary_screen.json').read_text())
          assert abs(x['demand_mwh']-2455626)<1e-3
          assert abs(x['observed_import_injection_mwh']+x['modeled_plant_generation_mwh']+x['modeled_unserved_mwh']-x['demand_mwh']-x['observed_export_sink_mwh']-x['modeled_import_surplus_disposal_mwh'])<1e-3
          assert x['historical_calibration_certified'] is False
          PY
      - name: Verify exact generator eligibility against observed January Page4
        run: |
          python -m grid_resilience.exact_generator_scope_audit --page4 outputs/srp_real_screen/eia923_generator_month_net_mwh.csv --review outputs/srp_real_screen/ba_capacity_identity_review.csv --ba SRP --month 2024-01 --output outputs/srp_real_screen
      - name: Bound omitted generator contribution using nameplate 744-hour ceiling
        run: |
          python -m grid_resilience.excluded_capacity_upper_bound --review outputs/srp_real_screen/ba_capacity_identity_review.csv --baseline-manifest outputs/srp_real_screen/bidirectional_case/bidirectional_boundary_screen.json --year 2024 --month 1 --output outputs/srp_real_screen
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/srp_real_screen/excluded_capacity_maximum_contribution.json').read_text())
          assert x['excluded_generator_count']==3
          assert abs(x['excluded_nameplate_mw']-390.4)<0.001
          assert x['remaining_gap_lower_bound_mwh_given_only_these_additions']>0
          assert x['historical_calibration_certified'] is False
          PY
      - name: Publish matched Page4 and modeled fuel table without calibration claims
        run: |
          python -m grid_resilience.page4_fuel_descriptive_comparison --page4 outputs/srp_real_screen/eia923_generator_month_net_mwh.csv --review outputs/srp_real_screen/ba_capacity_identity_review.csv --model outputs/srp_real_screen/interchange_case/modeled_generation_with_net_exchange.csv --output outputs/srp_real_screen
      - name: Solve observed-boundary baseline and assumed energy-limited HY PS case
        run: |
          python -m grid_resilience.srp_hy_ps_paired_sensitivity --balance outputs/srp_real_screen/eia930_hourly_balance_audit.csv --capacity outputs/srp_real_screen/fuel_assumption_capacity_screen.csv --year 2024 --month 1 --ba SRP --hydro-budget-mwh 1015 --storage-hours 4 --roundtrip-efficiency .81 --output outputs/srp_real_screen/hy_ps_case
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/srp_real_screen/hy_ps_case/hy_ps_paired_sensitivity.json').read_text())
          assert r['baseline']['modeled_unserved_mwh']>=0
          assert r['scenario']['modeled_unserved_mwh']>=0
          assert abs(r['baseline']['demand_mwh']-r['scenario']['demand_mwh'])<1e-6
          assert abs(r['baseline']['observed_export_sink_mwh']-r['scenario']['observed_export_sink_mwh'])<1e-6
          print('BASELINE UNSERVED:',r['baseline']['modeled_unserved_mwh'])
          print('HY PS SCENARIO UNSERVED:',r['scenario']['modeled_unserved_mwh'])
          print('MODELED DELTA:',r['delta_unserved_mwh'])
          assert r['scenario']['hydro_dispatch_mwh']<=1015.00001
          assert r['baseline']['max_hourly_bus_residual_mw']<1e-3
          assert r['scenario']['max_hourly_bus_residual_mw']<1e-3
          assert r['historical_calibration_certified'] is False
          PY
      - name: Independently verify 744-hour PyPSA screening baseline with analytic oracle
        run: |
          python -m grid_resilience.srp_hourly_oracle_audit --hourly outputs/srp_real_screen/hy_ps_case/baseline_hourly_diagnostics.csv --capacity outputs/srp_real_screen/fuel_assumption_capacity_screen.csv --ba SRP --year 2024 --month 1 --output outputs/srp_real_screen/analytical_baseline_audit.json
      - name: Quantify verified hourly modeled shortfall concentration
        run: |
          python -m grid_resilience.srp_shortfall_duration_audit --hourly outputs/srp_real_screen/hy_ps_case/baseline_hourly_diagnostics.csv --year 2024 --month 1 --output outputs/srp_real_screen/shortfall_duration_audit.json
      - name: Bound firm capacity additions against hourly model deficits
        run: |
          python -m grid_resilience.srp_firm_capacity_frontier --hourly outputs/srp_real_screen/hy_ps_case/baseline_hourly_diagnostics.csv --year 2024 --month 1 --output outputs/srp_real_screen/firm_capacity_case
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv('outputs/srp_real_screen/firm_capacity_case/firm_capacity_frontier.csv')
          row=x.loc[x.incremental_firm_capacity_mw.eq(390.4)].iloc[0]
          assert abs(row.remaining_model_gap_mwh-263003.965)<1e-3
          assert row.remaining_positive_gap_hours==463
          PY
      - name: Synthetic import-heavy and export regression
        run: |
          mkdir -p outputs/srp_real_screen/ci_diagnostics
          set -o pipefail
          python -u -m grid_resilience.srp_exchange_synthetic_regression 2>&1 | tee outputs/srp_real_screen/ci_diagnostics/synthetic_exchange_test.log
      - name: Solve PyPSA using explicit scheduled imports, exports and spill
        run: |
          python -m grid_resilience.srp_explicit_import_export --balance outputs/srp_real_screen/eia930_hourly_balance_audit.csv --capacity outputs/srp_real_screen/fuel_assumption_capacity_screen.csv --ba SRP --year 2024 --month 1 --output outputs/srp_real_screen/explicit_exchange
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srp-jan2024-real-load-partial-supply-screen
          path: |
            outputs/srp_real_screen/input_provenance.json
            outputs/srp_real_screen/observed_hourly_demand.csv
            outputs/srp_real_screen/partial_ba_capacity_screen.csv
            outputs/srp_real_screen/ba_capacity_identity_review.csv
            outputs/srp_real_screen/capacity_screen_manifest.json
            outputs/srp_real_screen/modeled_monthly_generation.csv
            outputs/srp_real_screen/screening_manifest.json
            outputs/srp_real_screen/availability_sensitivity_summary.csv
            outputs/srp_real_screen/availability_sensitivity_generation.csv
            outputs/srp_real_screen/availability_sensitivity_manifest.json
            outputs/srp_real_screen/fuel_assumption_capacity_screen.csv
            outputs/srp_real_screen/fuel_assumption_manifest.json
            outputs/srp_real_screen/fuel_scenario/modeled_monthly_generation.csv
            outputs/srp_real_screen/fuel_scenario/screening_manifest.json
            outputs/srp_real_screen/page4_month_scope_rows.csv
            outputs/srp_real_screen/page4_month_scope_summary.csv
            outputs/srp_real_screen/page4_month_scope_manifest.json
            outputs/srp_real_screen/eia930_balance_metrics.json
            outputs/srp_real_screen/interchange_case/interchange_screen_manifest.json
            outputs/srp_real_screen/interchange_case/modeled_generation_with_net_exchange.csv
            outputs/srp_real_screen/explicit_exchange/explicit_import_export_manifest.json
            outputs/srp_real_screen/ci_diagnostics/synthetic_exchange_test.log
            outputs/srp_real_screen/bidirectional_case/bidirectional_boundary_screen.json
            outputs/srp_real_screen/exact_generator_scope_rows.csv
            outputs/srp_real_screen/exact_generator_scope_summary.csv
            outputs/srp_real_screen/exact_generator_scope_manifest.json
            outputs/srp_real_screen/excluded_capacity_maximum_contribution.json
            outputs/srp_real_screen/fuel_descriptive_noncali_comparison.csv
            outputs/srp_real_screen/fuel_descriptive_noncali_manifest.json
            outputs/srp_real_screen/hy_ps_case/hy_ps_paired_sensitivity.json
            outputs/srp_real_screen/hy_ps_case/baseline_hourly_diagnostics.csv
            outputs/srp_real_screen/hy_ps_case/hy_ps_hourly_diagnostics.csv
            outputs/srp_real_screen/analytical_baseline_audit.json
            outputs/srp_real_screen/shortfall_duration_audit.json
            outputs/srp_real_screen/firm_capacity_case/firm_capacity_frontier.csv
            outputs/srp_real_screen/firm_capacity_case/firm_capacity_frontier_manifest.json
