name: Paper C 2024 bilateral reciprocal discrepancy temporal audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paperc-2024-reciprocity-temporal.yml'
      - 'src/grid_resilience/paperc_reciprocity_temporal.py'
      - 'tests/test_paperc_reciprocity_temporal.py'
jobs:
  temporal-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test date split and reciprocal reporting uncertainty handling
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install matplotlib
          python -m pytest -q tests/test_paperc_reciprocity_temporal.py
      - name: Retrieve prior official 41-pair source-audited exchange records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/temporal/source outputs/temporal/results
          gh run download 42447683798 --repo ys30/Climate-Grid-Resilience-Research --name paperc-2024-july-eia930-directed-reciprocity-by-counterparty --dir outputs/temporal/source
      - name: Source-gated six-pair sign, UTC-day and half-year partition diagnostics
        run: |
          python -m grid_resilience.paperc_reciprocity_temporal \
            --source outputs/temporal/source/results/july2024_reciprocal_directed_pair_hourly.csv \
            --manifest outputs/temporal/source/results/july2024_reciprocity_source_scope.json \
            --output outputs/temporal/results
          python - <<'PY'
          from pathlib import Path
          import pandas as pd,json
          p=Path("outputs/temporal/results")
          a=pd.read_csv(p/"paperc_reciprocity_pair_summary.csv")
          d=pd.read_csv(p/"paperc_reciprocity_daily.csv")
          m=json.loads((p/"paperc_reciprocity_temporal_scope.json").read_text())
          assert len(a)==6 and len(d)==42
          assert a.first_partition_hours.eq(7).all() and a.second_partition_hours.eq(161).all()
          assert m["unpaired_values_not_zeroed"] and m["historical_eens_calibrated"] is False
          def selected(a,b):
              return a_rows[(a_rows.ba_a==a)&(a_rows.ba_b==b)].iloc[0]
          a_rows=a
          assert abs(selected("BPAT","GRID").absolute_pair_discrepancy_mwh-129398)<.001
          assert abs(selected("BPAT","SCL").absolute_pair_discrepancy_mwh-90046)<.001
          assert abs(selected("AZPS","CISO").absolute_pair_discrepancy_mwh-49080)<.001
          assert selected("BPAT","CISO").absolute_pair_discrepancy_mwh==0.
          for ext in ("png","pdf"):
              assert (p/f"fig_paperc_2024_bilateral_reciprocity_temporal.{ext}").stat().st_size>10000
          print("TEMPORAL SOURCE DIAGNOSTIC:",a.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paperc-2024-bilateral-reciprocity-hour-day-partition-png-pdf-csv
          path: outputs/temporal/results/
          if-no-files-found: error
