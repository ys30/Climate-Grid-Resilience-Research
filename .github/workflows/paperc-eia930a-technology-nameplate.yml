name: Paper C EIA930A × EIA860M 2023-2024 BA technology nameplate scope
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paperc-eia930a-technology-nameplate.yml'
      - 'src/grid_resilience/paperc_eia930a_technology_nameplate.py'
      - 'tests/test_paperc_eia930a_technology_nameplate.py'
jobs:
  source-vintage-nameplate:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test no double counting and never conflate roster MW with available MW
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install openpyxl
          python -m pytest -q tests/test_paperc_eia930a_technology_nameplate.py
      - name: Restore audited cited-vintage original EIA930A plant-generator matches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/coverage/identity outputs/coverage/raw outputs/coverage/results
          gh run download 42455881405 --repo ys30/Climate-Grid-Resilience-Research \
            --name paperc-eia930a-cited-eia860m-2025-feb-aug-exact-vintage-match \
            --dir outputs/coverage/identity
      - name: Download official monthly source workbooks with immutable SHA256 records
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import hashlib,json
          folder=Path("outputs/coverage/raw")
          entries=[]
          for year,month in ((2023,"february"),(2024,"august")):
              url=f"https://www.eia.gov/electricity/data/eia860m/archive/xls/{month}_generator2025.xlsx"
              with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=180) as response:
                  data=response.read()
                  final=response.geturl()
              assert data[:2]==b"PK" and len(data)>100000
              (folder/f"eia860m_{year}.xlsx").write_bytes(data)
              entries.append({"eia930a_data_year":year,"file":f"eia860m_{year}.xlsx",
                              "source":url,"resolved":final,
                              "sha256":hashlib.sha256(data).hexdigest(),"bytes":len(data)})
          (folder/"eia860m_source_sha256.json").write_text(json.dumps(entries,indent=2)+"\n")
          PY
      - name: Construct BA x technology inventory MW with matched-ID subset and exclusions
        run: |
          python -m grid_resilience.paperc_eia930a_technology_nameplate \
            --monthly2023 outputs/coverage/raw/eia860m_2023.xlsx \
            --monthly2024 outputs/coverage/raw/eia860m_2024.xlsx \
            --identity2023 outputs/coverage/identity/results/paper_c_eia930a_2023_annual_vs_february2025_generator_row_transition.csv \
            --identity2024 outputs/coverage/identity/results/paper_c_eia930a_2024_annual_vs_august2025_generator_row_transition.csv \
            --output outputs/coverage/results
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          out=Path("outputs/coverage/results")
          manifests=json.loads((out/"paperc_year_specific_monthly_nameplate_scope.json").read_text())
          assert {x["year"] for x in manifests}=={2023,2024}
          for year,expected in ((2023,2144),(2024,1960)):
              t=pd.read_csv(out/f"paperc_{year}_ba_technology_nameplate.csv")
              x=pd.read_csv(out/f"paperc_{year}_identity_categories.csv")
              m=next(r for r in manifests if r["year"]==year)
              assert m["annual_reported_930a_source_rows"]==expected
              assert set(t.ba)=={"AZPS","BPAT","CISO","SRP"}
              assert len(t)==4*13
              assert x.eia930a_original_rows.sum()==expected
              assert not t.real_hourly_available_capacity_verified.any()
              assert not m["historical_eens_estimated"]
              assert t.matched_930a_monthly_nameplate_mw.le(
                     t.monthly_operating_nameplate_mw+0.00001).all()
              print("SOURCE TECHNOLOGY NAMEPLATE:",t[t.monthly_operating_nameplate_mw.gt(0)].to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paperc-eia930a-2023-2024-fourba-technology-matched-vs-monthly-nameplate
          path: |
            outputs/coverage/raw/eia860m_source_sha256.json
            outputs/coverage/results/
          if-no-files-found: warn
