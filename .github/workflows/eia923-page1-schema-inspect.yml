name: EIA-923 Page1 hydro PS schema inspect
on:
  push:
    paths:
      - '.github/workflows/eia923-page1-schema-inspect.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl
      - name: Inspect official 2024 Page1 BA HY PS column layout
        run: |
          python - <<'PY'
          import urllib.request,zipfile,io,json
          from openpyxl import load_workbook
          url='https://www.eia.gov/electricity/data/eia923/archive/xls/f923_2024.zip'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=120) as r: raw=r.read()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              names=[n for n in z.namelist() if 'Schedules_2_3_4_5' in n and n.endswith('.xlsx')]
              if len(names)!=1:raise ValueError('Workbook ambiguity')
              w=load_workbook(io.BytesIO(z.read(names[0])),read_only=True,data_only=True)
              print('SHEETS:',w.sheetnames)
              candidates=[s for s in w.sheetnames if 'Page 1' in s or 'Generation and Fuel' in s]
              print('CANDIDATES:',candidates)
              for sheet in candidates:
                  ws=w[sheet]
                  print('SHEET:',sheet)
                  for i,row in enumerate(ws.iter_rows(min_row=1,max_row=12,values_only=True),1):
                      print('HEADER_ROW',i,':',repr(list(enumerate(row)) if i==6 and sheet=='Page 1 Generation and Fuel Data' else list(row[:40])))
              w.close()
          PY
