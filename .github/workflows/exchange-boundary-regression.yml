name: Exchange boundary focused regression
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/exchange-boundary-regression.yml'
      - 'src/grid_resilience/srp_explicit_import_export.py'
      - 'src/grid_resilience/srp_exchange_synthetic_regression.py'
      - 'src/grid_resilience/exchange_analytical_reference.py'
      - 'tests/test_exchange_analytical_reference.py'
      - 'src/grid_resilience/exchange_boundary_preflight.py'
      - 'tests/test_exchange_boundary_preflight.py'
jobs:
  check-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight preflight dependencies
        run: python -m pip install -e '.[dev]' numpy
      - name: Preflight source compile
        run: python -m py_compile src/grid_resilience/srp_explicit_import_export.py src/grid_resilience/srp_exchange_synthetic_regression.py src/grid_resilience/exchange_boundary_preflight.py
      - name: Validate real-month boundary invariants with fast unit tests
        run: python -m pytest -q tests/test_exchange_boundary_preflight.py tests/test_exchange_analytical_reference.py
      - name: Install solver dependencies after preflight tests
        run: |
          python -m pip install 'pypsa>=0.34' 'highspy>=1.7'
          python -m pip check
          python - <<'PY'
          import pypsa, highspy, pandas, numpy
          print('pypsa version:',pypsa.__version__)
          print('pandas version:',pandas.__version__)
          print('numpy version:',numpy.__version__)
          print('HiGHS import:',highspy.__file__)
          PY
      - name: Run synthetic imports, exports and mixed hourly exchange
        run: |
          mkdir -p outputs/exchange_test
          set -o pipefail
          python -u -m grid_resilience.srp_exchange_synthetic_regression 2>&1 | tee outputs/exchange_test/regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exchange-boundary-test-logs
          path: outputs/exchange_test/
          if-no-files-found: warn

  pandas-20-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared minimum pandas series
        run: |
          python -m pip install 'numpy==1.26.4' 'pandas==2.0.3' 'pytest>=8' 'setuptools>=68'
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Compile and run independent source boundary tests
        run: |
          python -m py_compile src/grid_resilience/exchange_boundary_preflight.py src/grid_resilience/srp_explicit_import_export.py
          python - <<'PY'
          import pandas
          print('Pinned pandas:',pandas.__version__)
          assert pandas.__version__.startswith('2.0.')
          PY
          python -m pytest -q tests/test_exchange_boundary_preflight.py
