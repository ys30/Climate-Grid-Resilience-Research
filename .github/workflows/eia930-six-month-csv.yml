name: Official EIA-930 six-month CSV probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia930-six-month-csv.yml'
      - 'src/grid_resilience/eia930_fuel_decomposition.py'
      - 'src/grid_resilience/eia930_fuel_reporting_coverage.py'
      - 'tests/test_eia930_fuel_decomposition.py'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project package
        run: python -m pip install -e .
      - name: Retrieve 2024 January-June official balance CSV and inspect schema
        run: |
          mkdir -p outputs/eia930_six_month
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          from urllib.request import Request,urlopen
          url="https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2024_Jan_Jun.csv"
          request=Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urlopen(request,timeout=150) as r:
              raw=r.read()
              final_url=r.geturl()
          if len(raw)<1000: raise ValueError("Unexpectedly small EIA CSV")
          path=Path("outputs/eia930_six_month")
          (path/"official_2024_h1_balance.csv").write_bytes(raw)
          with (path/"official_2024_h1_balance.csv").open(newline="",encoding="utf-8-sig") as f:
              reader=csv.reader(f)
              first=[next(reader) for _ in range(4)]
          manifest={"requested_url":url,"resolved_url":final_url,
              "sha256":hashlib.sha256(raw).hexdigest(),"bytes":len(raw),
              "first_four_rows":first,"demand_extracted":False,
              "historical_calibration_certified":False}
          (path/"official_csv_probe.json").write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2)[:10000])
          PY
      - name: Extract four BA February 2024 raw demand with hour-ending shift
        run: |
          python -m grid_resilience.eia930_six_month_demand \
            --csv outputs/eia930_six_month/official_2024_h1_balance.csv \
            --output outputs/eia930_six_month
      - name: Aggregate separate official EIA-930 raw BA generation evidence
        run: |
          python -m grid_resilience.eia930_ba_generation \
            --csv outputs/eia930_six_month/official_2024_h1_balance.csv \
            --month 2024-02 --output outputs/eia930_six_month
      - name: Audit raw BA demand, generation and interchange accounting
        run: |
          python -m grid_resilience.eia930_balance_audit \
            --csv outputs/eia930_six_month/official_2024_h1_balance.csv \
            --month 2024-02 --output outputs/eia930_six_month
          cat outputs/eia930_six_month/eia930_raw_balance_diagnostic.csv
      - name: Flag hourly EIA-930 raw accounting residuals
        run: |
          python -m grid_resilience.eia930_hourly_balance_flags \
            --csv outputs/eia930_six_month/official_2024_h1_balance.csv \
            --month 2024-02 --output outputs/eia930_six_month
      - name: Compare raw and adjusted EIA-930 energy accounting
        run: |
          python -m grid_resilience.eia930_adjusted_balance_comparison \
            --csv outputs/eia930_six_month/official_2024_h1_balance.csv \
            --month 2024-02 --output outputs/eia930_six_month
          cat outputs/eia930_six_month/eia930_raw_vs_adjusted_balance.csv
      - name: Reconcile reported and implied EIA-930 BA interchange
        run: |
          python -m grid_resilience.eia930_interchange_reconciliation \
            --csv outputs/eia930_six_month/official_2024_h1_balance.csv \
            --month 2024-02 --output outputs/eia930_six_month
          cat outputs/eia930_six_month/interchange_reconciliation.csv
      - name: Audit net generation against reported fuel-level generation
        run: |
          python -m grid_resilience.eia930_fuel_decomposition \
            --csv outputs/eia930_six_month/official_2024_h1_balance.csv \
            --output outputs/eia930_six_month
      - name: Profile real hourly reporting coverage for each fuel
        run: |
          python -m grid_resilience.eia930_fuel_reporting_coverage \
            --csv outputs/eia930_six_month/official_2024_h1_balance.csv \
            --output outputs/eia930_six_month
          cat outputs/eia930_six_month/eia930_fuel_reporting_coverage_manifest.json
      - name: Solve February 2024 using real EIA demand and explicitly assumed supply
        run: |
          python -m pip install -e '.[model]'
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          from grid_resilience.multi_technology_dispatch import solve
          root=Path("outputs/eia930_six_month")
          demand=pd.read_csv(root/"hourly_ba_demand.csv")
          bas=sorted(demand.ba.unique())
          max_load=demand.groupby("ba").demand_mw.max()
          # Hypothetical gas-only fleet: 1.5x peak demand in each BA.
          # No links, no historical generation availability.
          capacity=pd.DataFrame([{"ba":ba,"technology":"gas",
              "capacity_mw":float(max_load[ba])*1.5,"marginal_cost":50.0} for ba in bas])
          availability=demand[["timestamp","ba"]].copy()
          availability["technology"]="gas"
          availability["availability_pu"]=1.0
          capacity.to_csv(root/"assumed_gas_capacity.csv",index=False)
          availability.to_csv(root/"assumed_gas_availability.csv",index=False)
          result=solve(root/"hourly_ba_demand.csv",root/"assumed_gas_capacity.csv",
              root/"assumed_gas_availability.csv",root/"historical_demand_synthetic_supply_solve")
          print("Actual demand + assumed capacity solve completed, shortfall by BA:")
          print(result.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia930-official-2024-h1-schema-probe
          path: |
            outputs/eia930_six_month/official_csv_probe.json
            outputs/eia930_six_month/hourly_ba_demand_manifest.json
            outputs/eia930_six_month/hourly_ba_demand.csv
            outputs/eia930_six_month/eia930_monthly_ba_generation.csv
            outputs/eia930_six_month/eia930_ba_generation_manifest.json
            outputs/eia930_six_month/eia930_raw_balance_diagnostic.csv
            outputs/eia930_six_month/eia930_raw_balance_manifest.json
            outputs/eia930_six_month/eia930_hourly_balance_flags.json
            outputs/eia930_six_month/eia930_hourly_balance_flags.csv
            outputs/eia930_six_month/eia930_raw_vs_adjusted_balance.csv
            outputs/eia930_six_month/eia930_raw_vs_adjusted_manifest.json
            outputs/eia930_six_month/interchange_reconciliation.csv
            outputs/eia930_six_month/interchange_reconciliation_manifest.json
            outputs/eia930_six_month/eia930_fuel_generation_decomposition.json
            outputs/eia930_six_month/eia930_fuel_reporting_coverage.csv
            outputs/eia930_six_month/eia930_fuel_reporting_coverage_manifest.json
            outputs/eia930_six_month/historical_demand_synthetic_supply_solve/shortfall_by_ba.csv
            outputs/eia930_six_month/assumed_gas_capacity.csv
          if-no-files-found: warn
