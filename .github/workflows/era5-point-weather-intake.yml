name: Independent ERA5 February 2024 point weather intake
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/era5-point-weather-intake.yml'
      - 'src/grid_resilience/era5_point_weather_intake.py'
      - 'src/grid_resilience/independent_weather_gate.py'
      - 'src/grid_resilience/era5_point_wind_curve.py'
      - 'src/grid_resilience/bpat_era5_wind_shape_comparison.py'
      - 'tests/test_bpat_era5_utc_join.py'
      - 'src/grid_resilience/wind_weather_evidence_gate.py'
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data validation dependencies
        run: python -m pip install -e . openpyxl
      - name: Download independent ERA5 hourly point proxies and validate four BA hourly matrices
        run: |
          python -m grid_resilience.era5_point_weather_intake --output outputs/era5_feb2024_point_proxies
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("outputs/era5_feb2024_point_proxies/era5_proxy_point_manifest.json")
          m=json.loads(p.read_text())
          assert m["hourly_rows"]==2784 and len(m["points"])==4
          assert m["regional_weather_calibration_completed"] is False
          assert m["wind_turbine_capacity_factor_model_completed"] is False
          print("Four proxy point ERA5 time series validated; NOT BA-area climate exposure")
          PY
      - name: Transform ERA5 100m point winds using uncalibrated turbine power curve
        run: |
          python -m grid_resilience.era5_point_wind_curve \
            --weather outputs/era5_feb2024_point_proxies/era5_proxy_points_raw.csv \
            --output outputs/era5_feb2024_point_proxies
          cat outputs/era5_feb2024_point_proxies/era5_point_wind_curve_summary.csv
      - name: Test ERA5 and EIA-930 timezone-normalized hourly join
        run: python tests/test_bpat_era5_utc_join.py
      - name: Compare BPAT ERA5 proxy hourly shape with EIA-930 reported wind
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import json
          import pandas as pd
          from grid_resilience.bpat_wind_observation_audit import audit
          from grid_resilience.eia860_plant_ba_capacity import build
          # Use existing official EIA-860 2024 archive and EIA-930 balance data for a standalone comparison.
          root=Path("outputs/era5_feb2024_point_proxies")
          sources={
           "eia8602024.zip":"https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602024.zip",
           "eia930_balance.csv":"https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2024_Jan_Jun.csv"}
          for name,url in sources.items():
              with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=150) as r:
                  (root/name).write_bytes(r.read())
          PY
          python -m grid_resilience.eia860_generator_extract \
            --archive outputs/era5_feb2024_point_proxies/eia8602024.zip \
            --output outputs/era5_feb2024_point_proxies
          python -m grid_resilience.eia860_plant_ba_capacity \
            --archive outputs/era5_feb2024_point_proxies/eia8602024.zip \
            --generators outputs/era5_feb2024_point_proxies/eia860_2024_operable_generators.csv \
            --output outputs/era5_feb2024_point_proxies
          python -m grid_resilience.bpat_wind_observation_audit \
            --balance outputs/era5_feb2024_point_proxies/eia930_balance.csv \
            --capacity outputs/era5_feb2024_point_proxies/eia860_plant_ba_capacity_candidates.csv \
            --output outputs/era5_feb2024_point_proxies
          python -m grid_resilience.bpat_era5_wind_shape_comparison \
            --proxy outputs/era5_feb2024_point_proxies/era5_point_wind_curve_proxy.csv \
            --wind outputs/era5_feb2024_point_proxies/bpat_reported_wind_hourly.csv \
            --capacity outputs/era5_feb2024_point_proxies/eia860_plant_ba_capacity_candidates.csv \
            --output outputs/era5_feb2024_point_proxies
          cat outputs/era5_feb2024_point_proxies/bpat_era5_point_wind_comparison_manifest.json
          python -m grid_resilience.wind_weather_evidence_gate \
            --comparison outputs/era5_feb2024_point_proxies/bpat_era5_point_wind_comparison_manifest.json \
            --output outputs/era5_feb2024_point_proxies/wind_weather_evidence_gate.json
          cat outputs/era5_feb2024_point_proxies/wind_weather_evidence_gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: era5-feb2024-illustrative-point-weather
          path: |
            outputs/era5_feb2024_point_proxies/era5_proxy_points_raw.csv
            outputs/era5_feb2024_point_proxies/era5_point_wind_curve_proxy.csv
            outputs/era5_feb2024_point_proxies/bpat_era5_point_vs_reported_wind_hourly.csv
            outputs/era5_feb2024_point_proxies/bpat_era5_point_wind_comparison_manifest.json
            outputs/era5_feb2024_point_proxies/wind_weather_evidence_gate.json
            outputs/era5_feb2024_point_proxies/era5_point_wind_curve_summary.csv
            outputs/era5_feb2024_point_proxies/era5_point_wind_curve_manifest.json
            outputs/era5_feb2024_point_proxies/era5_proxy_point_manifest.json
            outputs/era5_feb2024_point_proxies/validated/independent_weather_validated.csv
            outputs/era5_feb2024_point_proxies/validated/independent_weather_gate_manifest.json
          if-no-files-found: warn
