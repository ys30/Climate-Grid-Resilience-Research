name: Bidirectional interchange full-month PyPSA quality
on:
  push:
    paths:
      - 'src/grid_resilience/bidirectional_interchange_screen.py'
      - '.github/workflows/bidirectional-interchange-quality.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[model]'
      - name: Mixed signed interchange 744-hour full month
        run: |
          python - <<'PY'
          import pandas as pd
          from grid_resilience.bidirectional_interchange_screen import solve
          hours=pd.date_range('2024-01-01',periods=744,freq='h',tz='UTC')
          net=[-100.0]*100+[50.0]*644
          d=pd.DataFrame({'timestamp':hours,'demand_mw':50.0,'interchange_mw':net})
          c=pd.DataFrame([{'ba':'SRP','technology':'TEST_NG','capacity_mw':110.0,'marginal_cost':50.0}])
          r=solve(d,c,2024,1,'SRP')
          print(r)
          assert r['observed_import_injection_mwh']==10000
          assert r['observed_export_sink_mwh']==32200
          assert r['modeled_unserved_mwh']<1e-5
          assert r['modeled_import_surplus_disposal_mwh']>=4999.99
          assert r['historical_calibration_certified'] is False
          PY
