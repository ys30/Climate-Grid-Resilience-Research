name: 2024 observed-input four-scenario partial-fleet PyPSA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/real-factorial-2024.yml'
      - 'src/grid_resilience/multi_technology_factorial.py'
jobs:
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[model,dev]'
      - uses: actions/download-artifact@v4
        with:
          name: MATCHED-OBSERVED-EIA930-ERA5-2024
          run-id: 41102363806
          github-token: ${{ github.token }}
          path: inputs/observed
      - uses: actions/download-artifact@v4
        with:
          name: EIA860-2024-FOUR-BA-EXPLICIT-PARTIAL-FLEET
          run-id: 41107169962
          github-token: ${{ github.token }}
          path: inputs/inventory
      - name: Normalize downloaded artifact paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('inputs/inventory')
          expected={
            'capacity.csv':root/'outputs/eia860_v2/capacity.csv',
            'eia860_provenance.json':root/'outputs/eia860_source/eia860_provenance.json',
          }
          for filename,destination in expected.items():
              matches=list(root.rglob(filename))
              if len(matches)!=1:
                  raise RuntimeError(f'Expected exactly one {filename}; found {len(matches)}: {matches}')
              source=matches[0]
              destination.parent.mkdir(parents=True,exist_ok=True)
              if source.resolve()!=destination.resolve():
                  shutil.copyfile(source,destination)
              print(f'Normalized {filename} from {source}')
          PY
      - name: Audit matched source and 2024 nameplate provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          d=pd.read_csv('inputs/observed/demand.csv')
          w=pd.read_csv('inputs/observed/weather.csv')
          c=pd.read_csv('inputs/inventory/outputs/eia860_v2/capacity.csv')
          m=json.loads(Path('inputs/inventory/outputs/eia860_source/eia860_provenance.json').read_text())
          assert len(d)==len(w)==672
          assert set(d.ba)==set(w.ba)==set(c.ba)=={'CISO','AZPS','BPAT','SRP'}
          assert m['year']==2024
          assert c.capacity_source.str.contains('GENERIC_THERMAL_PROXY').all()
          print('Observed EIA-930/ERA5 inputs and partial-fleet EIA-860 inventory checked')
          PY
      - name: Define explicitly hypothetical BA-to-BA link constraints
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          d=pd.read_csv('inputs/observed/demand.csv')
          peaks=d.groupby('ba').demand_mw.max()
          # These are selected illustrative network edges, not discovered actual links.
          pairs=[('CISO','AZPS'),('AZPS','SRP'),('CISO','BPAT')]
          out=Path('inputs/hypothetical');out.mkdir(parents=True,exist_ok=True)
          rows=[{'from_ba':a,'to_ba':b,'capacity_mw':float(min(peaks[a],peaks[b])*.1),
                 'rating_source':'HYPOTHETICAL_10pct_smaller_BA_observed_peak_NOT_PHYSICAL'}
                for a,b in pairs]
          pd.DataFrame(rows).to_csv(out/'links.csv',index=False)
          PY
      - name: Four matched scenario PyPSA runs with explicit screening assumptions
        run: |
          python -m grid_resilience.research_run \
            --demand inputs/observed/demand.csv \
            --weather inputs/observed/weather.csv \
            --capacity inputs/inventory/outputs/eia860_v2/capacity.csv \
            --links inputs/hypothetical/links.csv \
            --event-id 2024-07-01_07_REAL_INPUTS_HYPOTHETICAL_NETWORK \
            --network-variant partial_fleet_assumed_links_10pct \
            --link-evidence hypothetical \
            --output outputs/real_input_screening
      - name: Matched isolated-BA factorial counterfactual (no links)
        run: |
          mkdir -p inputs/hypothetical
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          path=Path('inputs/hypothetical/isolated_no_links.csv')
          pd.DataFrame(columns=['from_ba','to_ba','capacity_mw']).to_csv(path,index=False)
          assert set(pd.read_csv(path).columns)=={'from_ba','to_ba','capacity_mw'}
          assert pd.read_csv(path).empty
          PY
          python -m grid_resilience.research_run \
            --demand inputs/observed/demand.csv \
            --weather inputs/observed/weather.csv \
            --capacity inputs/inventory/outputs/eia860_v2/capacity.csv \
            --links inputs/hypothetical/isolated_no_links.csv \
            --event-id 2024-07-01_07_REAL_INPUTS_ISOLATED \
            --network-variant partial_fleet_no_links \
            --link-evidence hypothetical \
            --output outputs/real_input_isolated
      - name: Compare BA interactions across isolated and hypothetical network
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          root=Path('outputs')
          expected={'baseline','heat_only','wind_only','heat_wind'}
          frames=[]
          for variant,folder in [('isolated','real_input_isolated'),('hypothetical_links','real_input_screening')]:
              d=pd.read_csv(root/folder/'solved/factorial_dispatch.csv')
              assert len(d)==16 and set(d.scenario)==expected and d.groupby('ba').scenario.nunique().eq(4).all()
              p=d.pivot(index='ba',columns='scenario',values='unserved_energy_mwh')
              c=p['heat_wind']-p['heat_only']-p['wind_only']+p['baseline']
              for ba,v in c.items():
                  frames.append({'ba':ba,'network_variant':variant,'interaction_mwh':float(v)})
          out=pd.DataFrame(frames).pivot(index='ba',columns='network_variant',values='interaction_mwh')
          out['link_minus_isolated_mwh']=out['hypothetical_links']-out['isolated']
          out.loc['SYSTEM']=out.sum(numeric_only=True)
          assert out.loc['SYSTEM','hypothetical_links']>0
          target=root/'real_input_screening'/'paired_network_interaction_by_ba.csv'
          out.reset_index().to_csv(target,index=False)
          print(out.to_string())
          PY
      - name: Test hypothetical link rating uncertainty at 5 and 20 percent
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import pandas as pd
          base=pd.read_csv('inputs/hypothetical/links.csv')
          output=Path('outputs/network_rating_sensitivity')
          output.mkdir(parents=True,exist_ok=True)
          records=[]
          for scale in (0.5,2.0):
              label=f'links_{int(scale*10)}pct'
              linkpath=output/f'{label}.csv'
              variant=base.copy()
              variant['capacity_mw']=base['capacity_mw']*scale
              variant['rating_source']=f'HYPOTHETICAL_{int(scale*10)}pct_peak_NOT_VERIFIED'
              variant.to_csv(linkpath,index=False)
              path=output/label
              subprocess.run([
                  'python','-m','grid_resilience.research_run',
                  '--demand','inputs/observed/demand.csv',
                  '--weather','inputs/observed/weather.csv',
                  '--capacity','inputs/inventory/outputs/eia860_v2/capacity.csv',
                  '--links',str(linkpath),
                  '--event-id','2024-07-01_07_NETWORK_RATING_SENSITIVITY',
                  '--network-variant',label,
                  '--link-evidence','hypothetical',
                  '--output',str(path)
              ],check=True)
              d=pd.read_csv(path/'solved/factorial_dispatch.csv')
              p=d.pivot(index='ba',columns='scenario',values='unserved_energy_mwh')
              assert p.shape==(4,4) and not p.isna().any().any()
              contrast=p['heat_wind']-p['heat_only']-p['wind_only']+p['baseline']
              records.extend({'ba':ba,'network_variant':label,'interaction_mwh':float(v)}
                             for ba,v in contrast.items())
          existing=pd.read_csv('outputs/real_input_screening/paired_network_interaction_by_ba.csv')
          for ba in ('AZPS','BPAT','CISO','SRP'):
              row=existing.loc[existing.ba==ba].iloc[0]
              records.extend([
                  {'ba':ba,'network_variant':'isolated','interaction_mwh':float(row.isolated)},
                  {'ba':ba,'network_variant':'links_10pct','interaction_mwh':float(row.hypothetical_links)}
              ])
          df=pd.DataFrame(records)
          assert not df.duplicated(['ba','network_variant']).any()
          summary=df.groupby('network_variant',as_index=False).interaction_mwh.sum()
          df.to_csv(output/'rating_sensitivity_by_ba.csv',index=False)
          summary.to_csv(output/'rating_sensitivity_system.csv',index=False)
          print(df.pivot(index='ba',columns='network_variant',values='interaction_mwh').to_string())
          print(summary.to_string(index=False))
          PY
      - name: Verify matching, numerical completeness, and nonadditivity
        run: |
          python - <<'PY'
          import pandas as pd
          import json
          from pathlib import Path
          p=Path('outputs/real_input_screening')
          d=pd.read_csv(p/'solved/factorial_dispatch.csv')
          assert len(d)==16
          assert set(d.scenario)=={'baseline','heat_only','wind_only','heat_wind'}
          assert set(d.ba)=={'CISO','AZPS','BPAT','SRP'}
          assert d.unserved_energy_mwh.ge(-1e-6).all()
          m=json.loads((p/'run_manifest.json').read_text())
          assert m['intertie_evidence_classification']=='hypothetical'
          assert m['input_validation']['hours']==168
          print(d.groupby('scenario').unserved_energy_mwh.sum().to_string())
          PY
      - name: Verify 2024 source-backed real-input run does not assert historical calibration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('outputs/real_input_screening/run_manifest.json').read_text())
          assert m['intertie_evidence_classification']=='hypothetical'
          assert m['input_validation']['hours']==168
          print('2024 observed-input run remains explicitly uncalibrated')
          PY
      - name: Produce auditable modeled factorial summary
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out=Path('outputs/real_input_screening')
          d=pd.read_csv(out/'solved/factorial_dispatch.csv')
          metric=d.groupby('scenario',as_index=False).agg(
              modeled_unserved_energy_mwh=('unserved_energy_mwh','sum'),
              ba_shortage_hours_sum=('shortage_hours','sum'),
              max_ba_shortfall_mw=('peak_shortfall_mw','max'))
          metric.to_csv(out/'scenario_summary.csv',index=False)
          expected={'baseline','heat_only','wind_only','heat_wind'}
          assert set(metric.scenario)==expected and len(metric)==4
          m=metric.set_index('scenario').modeled_unserved_energy_mwh
          interaction=float(m['heat_wind']-m['heat_only']-m['wind_only']+m['baseline'])
          import json
          (out/'factorial_interaction_summary.json').write_text(json.dumps({
              'interaction_mwh':interaction,
              'scenario_shortfall_mwh':{k:float(v) for k,v in m.items()},
              'interpretation':'nonadditive modeled shortage contrast; not calibrated causal effect',
              'historical_calibration_certified':False
          },indent=2)+'\\n')
          print('Four-scenario total modeled interaction MWh:',round(interaction,3))

          # Preserve BA-level contrast rather than claiming system totals
          # characterize every BA; verify exact aggregation identity.
          pivot=d.pivot(index='ba',columns='scenario',values='unserved_energy_mwh')
          assert len(pivot)==4 and not pivot.isna().any().any()
          by_ba=pivot[['baseline','heat_only','wind_only','heat_wind']].copy()
          by_ba['interaction_mwh']=(by_ba['heat_wind']-by_ba['heat_only']
                                    -by_ba['wind_only']+by_ba['baseline'])
          if abs(float(by_ba.interaction_mwh.sum())-interaction)>1e-4:
              raise AssertionError('BA interaction does not match system factorial contrast')
          by_ba.reset_index().to_csv(out/'factorial_interaction_by_ba.csv',index=False)
          print('BA-level modeled interaction MWh:')
          print(by_ba[['interaction_mwh']].to_string())
          lines=[
              '# Historical-input partial-fleet four-scenario screening results',
              '',
              'EIA-930 load and ERA5 point weather are observed; EIA-860 nameplate is historical year-end.',
              'The thermal dispatch proxy, omitted generation technologies, hypothetical interties,',
              'wind availability mapping and heat load response are **uncalibrated assumptions**.',
              'Modeled unserved energy is **NOT observed outage evidence**.',
              '',
              '## Four scenario summary',
              '',
              '| Scenario | Modeled unserved energy (MWh) | Sum of BA shortage hours | Maximum BA shortfall (MW) |',
              '|---|---:|---:|---:|'
          ]
          for row in metric.itertuples():
              lines.append(f'| {row.scenario} | {row.modeled_unserved_energy_mwh:,.3f} | {row.ba_shortage_hours_sum:.0f} | {row.max_ba_shortfall_mw:,.3f} |')
          (out/'SCREENING_RESULTS.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2024-REAL-INPUT-PARTIAL-FLEET-FACTORIAL-NOT-CALIBRATED
          if-no-files-found: warn
          retention-days: 60
          path: |
            outputs/real_input_screening/
            outputs/real_input_isolated/
            outputs/network_rating_sensitivity/
            inputs/hypothetical/links.csv
