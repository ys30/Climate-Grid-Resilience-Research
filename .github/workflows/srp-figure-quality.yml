name: SRP figure data quality and rendering tests
on:
  push:
    paths:
      - 'src/grid_resilience/srp_hourly_figures.py'
      - 'src/grid_resilience/plot_srp_adequacy.py'
      - 'tests/test_srp_hourly_figures.py'
      - 'tests/test_plot_srp_adequacy.py'
      - '.github/workflows/srp-figure-quality.yml'
  pull_request:
    paths:
      - 'src/grid_resilience/srp_hourly_figures.py'
      - 'src/grid_resilience/plot_srp_adequacy.py'
      - 'tests/test_srp_hourly_figures.py'
      - 'tests/test_plot_srp_adequacy.py'
      - '.github/workflows/srp-figure-quality.yml'
  workflow_dispatch:
jobs:
  figure-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install plotting test dependencies
        run: python -m pip install -e '.[dev]' matplotlib
      - name: Check figure data validation and PNG rendering
        run: python -m pytest -q tests/test_srp_hourly_figures.py tests/test_plot_srp_adequacy.py
