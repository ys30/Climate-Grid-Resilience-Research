name: July 2024 four week partial-fleet supply vs official EIA930 generation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/july2024-partial-fleet-official-netgen-audit.yml'
      - 'src/grid_resilience/july2024_partial_fleet_official_generation_audit.py'
      - 'tests/test_july2024_partial_fleet_official_generation_audit.py'
jobs:
  compare-source-model-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source hours, calibration caveats and model nameplate lower bound
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_july2024_partial_fleet_official_generation_audit.py
      - name: Restore official raw EIA930 744 July hours and canonical 4 week PyPSA source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/partial_generation/official outputs/partial_generation/model outputs/partial_generation/source outputs/partial_generation/results
          gh run download 41325415594 --repo ys30/Climate-Grid-Resilience-Research --name JULY2024-EIA930-OFFICIAL-RAW-ADJUSTED-BALANCE --dir outputs/partial_generation/official
          gh run download 42104106361 --repo ys30/Climate-Grid-Resilience-Research --name july2024-4-disjoint-real-week-factorial-source-results --dir outputs/partial_generation/model
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          root=Path("outputs/partial_generation")
          official=pd.read_csv(root/"official/official_2024_july_combined.csv")
          cap=pd.read_csv(root/"model/inputs/frozen_partial_eia860_capacity.csv")
          runs=pd.read_csv(root/"model/results/july_four_week_four_scenario_ba_dispatch.csv")
          assert len(official)==4*744 and len(cap)==4 and len(runs)==128
          print("VERIFIED ORIGINAL EIA930 AND FOUR-WEEK MODEL INPUTS",len(official),len(cap),len(runs))
          PY
      - name: Join all official BA net-generation rows and derive missing partial-supply envelope
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path("outputs/partial_generation")
          frames=[pd.read_csv(root/f"model/inputs/week_{w}/demand.csv")
                  for w in range(1,5)]
          d=pd.concat(frames,ignore_index=True)
          assert len(d)==4*672 and d.timestamp.nunique()==672
          d.to_csv(root/"source/july2024_28day_official_demand_4ba.csv",index=False)
          PY
          python -m grid_resilience.july2024_partial_fleet_official_generation_audit \
            --demand outputs/partial_generation/source/july2024_28day_official_demand_4ba.csv \
            --capacity outputs/partial_generation/model/inputs/frozen_partial_eia860_capacity.csv \
            --official-eia930 outputs/partial_generation/official/official_2024_july_combined.csv \
            --solved outputs/partial_generation/model/results/july_four_week_four_scenario_ba_dispatch.csv \
            --output outputs/partial_generation/results
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          p=Path("outputs/partial_generation/results")
          x=pd.read_csv(p/"july2024_fourweek_ba_partial_supply_vs_official_netgen.csv")
          m=json.loads((p/"july2024_fourweek_partial_fleet_coverage_manifest.json").read_text())
          assert len(x)==16 and x.hours.eq(168).all()
          assert m["eia930_official_and_model_demand_exact_match"]
          assert m["partial_nameplate_deficit_is_lower_bound_on_model_shortage_not_actual_outage"]
          assert not m["historical_real_eens_or_forced_outages_estimated"]
          print("MODEL PARTIAL SUPPLY AND OFFICIAL NETGEN SOURCE COMPARISON")
          print(x.to_string(index=False))
          print("FOUR WEEK BA GROUPED")
          print(x.groupby("ba")[["demand_mwh","official_reported_net_generation_mwh",
            "isolated_partial_nameplate_deficit_lower_bound_mwh",
            "isolated_baseline_modeled_shortage_mwh"]].sum().to_string())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: july2024-fourweek-partial-fleet-vs-official-ba-net-generation
          path: outputs/partial_generation/results/
          if-no-files-found: warn
