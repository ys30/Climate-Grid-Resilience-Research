name: July four-BA EIA930 official source hour convention diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/july-eia930-old-new-hour-lag-audit.yml'
      - 'src/grid_resilience/july2024_eia930_demand_hour_lag_diagnostic.py'
      - 'tests/test_july2024_eia930_demand_hour_lag_diagnostic.py'
jobs:
  compare-hour-convention:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_july2024_eia930_demand_hour_lag_diagnostic.py
      - name: Retrieve archived old and newly source-verified EIA930 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/lag/old outputs/lag/new outputs/lag/result
          gh run download 41102363806 --repo ys30/Climate-Grid-Resilience-Research --name MATCHED-OBSERVED-EIA930-ERA5-2024 --dir outputs/lag/old
          gh run download 42104106361 --repo ys30/Climate-Grid-Resilience-Research --name july2024-4-disjoint-real-week-factorial-source-results --dir outputs/lag/new
      - name: Compute actual original-vs-official lag source demand errors
        run: |
          python -m grid_resilience.july2024_eia930_demand_hour_lag_diagnostic --original outputs/lag/old/demand.csv --refetched outputs/lag/new/inputs/week_1/demand.csv --output outputs/lag/result
          python - <<'PY'
          import pandas as pd
          r=pd.read_csv('outputs/lag/result/original_refetched_eia930_utc_lag_diagnostics.csv')
          assert len(r)==20
          assert set(r.old_source_timestamp_shift_hours)=={-2,-1,0,1,2}
          assert r.overlapping_real_hour_pairs.ge(166).all()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: july2024-eia930-original-versus-refetched-hour-shift-diagnostic
          path: outputs/lag/result/
          if-no-files-found: error
