name: Monthly generation comparison quality
on:
  push:
    paths:
      - 'src/grid_resilience/monthly_generation_comparison.py'
      - 'tests/test_monthly_generation_comparison.py'
      - 'src/grid_resilience/eia923_cross_sheet_coverage.py'
      - 'tests/test_eia923_cross_sheet_coverage.py'
      - 'src/grid_resilience/eia860_unmatched_triage.py'
      - 'tests/test_eia860_unmatched_triage.py tests/test_eia860_full_status_triage.py'
      - 'src/grid_resilience/eia860_full_status_triage.py'
      - 'tests/test_eia860_full_status_triage.py'
      - '.github/workflows/monthly-generation-comparison-quality.yml'
  pull_request:
    paths:
      - 'src/grid_resilience/monthly_generation_comparison.py'
      - 'tests/test_monthly_generation_comparison.py'
      - 'src/grid_resilience/eia923_cross_sheet_coverage.py'
      - 'tests/test_eia923_cross_sheet_coverage.py'
      - 'src/grid_resilience/eia860_unmatched_triage.py'
      - 'tests/test_eia860_unmatched_triage.py'
      - 'src/grid_resilience/eia860_full_status_triage.py'
      - 'tests/test_eia860_full_status_triage.py'
      - '.github/workflows/monthly-generation-comparison-quality.yml'
  workflow_dispatch:
jobs:
  comparison-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' numpy openpyxl
      - run: python -m pytest -q tests/test_monthly_generation_comparison.py tests/test_eia923_cross_sheet_coverage.py tests/test_eia860_unmatched_triage.py
