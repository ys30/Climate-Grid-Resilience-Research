name: Official EIA-930 bilateral interchange CSV schema
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia930-interchange-schema.yml'
      - 'src/grid_resilience/eia930_interchange_outlier_audit.py'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Retrieve and inspect official 2024 first-half interchange file
        run: |
          mkdir -p outputs/eia930_interchange
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          from urllib.request import Request,urlopen
          url="https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_INTERCHANGE_2024_Jan_Jun.csv"
          with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=150) as response:
              data=response.read()
          if len(data)<1000:raise ValueError("Interchange CSV unexpectedly small")
          p=Path("outputs/eia930_interchange/official_interchange.csv")
          p.write_bytes(data)
          with p.open(newline="",encoding="utf-8-sig") as f:
              reader=csv.reader(f)
              first=[next(reader) for _ in range(3)]
          m={"source_url":url,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),
             "first_three_rows":first,"historical_calibration_certified":False}
          Path("outputs/eia930_interchange/schema.json").write_text(json.dumps(m,indent=2))
          print(json.dumps(m,indent=2))
          PY
      - name: Aggregate official February bilateral BA interchange
        run: |
          python -m grid_resilience.eia930_bilateral_aggregation \
            --csv outputs/eia930_interchange/official_interchange.csv \
            --output outputs/eia930_interchange
      - name: Download official EIA-930 Balance for independent reconciliation
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          url="https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2024_Jan_Jun.csv"
          with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=150) as f:
              data=f.read()
          if len(data)<1000:raise RuntimeError("Invalid balance file")
          Path("outputs/eia930_interchange/official_balance.csv").write_bytes(data)
          PY
      - name: Compare bilateral sums with BA reported total interchange
        run: |
          python -m grid_resilience.eia930_bilateral_reconciliation \
            --balance outputs/eia930_interchange/official_balance.csv \
            --bilateral outputs/eia930_interchange/bilateral_hourly_totals.csv \
            --output outputs/eia930_interchange
          cat outputs/eia930_interchange/bilateral_vs_balance_summary.csv
          cat outputs/eia930_interchange/bilateral_vs_balance_manifest.json
          python - <<'PY'
          import pandas as pd
          p=pd.read_csv('outputs/eia930_interchange/bilateral_vs_balance_summary.csv')
          assert len(p)==4 and set(p.ba)=={'AZPS','BPAT','CISO','SRP'}
          assert (p.hours==696).all(), 'Official February bilateral coverage incomplete'
          print('Official interchange reconciliation: all four BAs have 696 hourly comparisons')
          print('Absolute discrepancy MWh by BA:', dict(zip(p.ba,p.absolute_difference_mwh)))
          PY
      - name: Audit BA-hour differences at source
        run: |
          python -m grid_resilience.eia930_interchange_outlier_audit --hourly outputs/eia930_interchange/bilateral_vs_balance_hourly.csv --output outputs/eia930_interchange
          cat outputs/eia930_interchange/interchange_outlier_summary.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia930-bilateral-interchange-schema
          path: |
            outputs/eia930_interchange/schema.json
            outputs/eia930_interchange/bilateral_hourly_totals.csv
            outputs/eia930_interchange/bilateral_manifest.json
            outputs/eia930_interchange/bilateral_vs_balance_summary.csv
            outputs/eia930_interchange/bilateral_vs_balance_manifest.json
            outputs/eia930_interchange/bilateral_vs_balance_hourly.csv
            outputs/eia930_interchange/interchange_outlier_summary.csv
            outputs/eia930_interchange/interchange_outlier_hours.csv
            outputs/eia930_interchange/interchange_outlier_manifest.json
          if-no-files-found: warn
