name: SRP EIA923 Page1 Page4 official source-scope audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia923-srp-page1-page4-scope.yml'
      - 'src/grid_resilience/eia923_page1_all_fuels.py'
      - 'src/grid_resilience/eia923_generator_extract.py'
      - 'src/grid_resilience/eia923_page1_page4_scope_bridge.py'
      - 'tests/test_eia923_page1_page4_scope_bridge.py'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test source-scope code
        run: |
          python -m pip install -e '.[dev]' openpyxl
          python -m pytest -q tests/test_eia923_page1_all_fuels.py tests/test_eia923_page1_page4_scope_bridge.py
      - name: Fetch official EIA-923 2024 source archive and record provenance
        run: |
          mkdir -p outputs/srp_page1_page4
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          url="https://www.eia.gov/electricity/data/eia923/archive/xls/f923_2024.zip"
          request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(request,timeout=120) as response:
              content=response.read(150_000_001)
          if not content or len(content)>150_000_000:
              raise ValueError("Invalid official archive length")
          root=Path("outputs/srp_page1_page4")
          (root/"f923_2024.zip").write_bytes(content)
          (root/"source_provenance.json").write_text(json.dumps({
              "official_archive_url":url,
              "sha256":hashlib.sha256(content).hexdigest(),
              "bytes":len(content),
              "source_year":2024,
              "historical_calibration_certified":False,
          },indent=2)+"\n")
          PY
      - name: Extract January Page1 all-fuels and Page4 matched reporting populations
        run: |
          python -m grid_resilience.eia923_page1_all_fuels \
            --archive outputs/srp_page1_page4/f923_2024.zip \
            --output outputs/srp_page1_page4 --ba SRP --month 1
          python -m grid_resilience.eia923_generator_extract \
            --archive outputs/srp_page1_page4/f923_2024.zip \
            --output outputs/srp_page1_page4
      - name: Reconcile separate Page1 and Page4 plant scope without source addition
        run: |
          python -m grid_resilience.eia923_page1_page4_scope_bridge \
            --page1 outputs/srp_page1_page4/page1_all_fuels_reported_ba.csv \
            --page4 outputs/srp_page1_page4/eia923_generator_month_net_mwh.csv \
            --ba SRP --period 2024-01 --output outputs/srp_page1_page4
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          root=Path("outputs/srp_page1_page4")
          m=json.loads((root/"page1_page4_scope_manifest.json").read_text())
          p1=pd.read_csv(root/"page1_all_fuels_reported_ba.csv",dtype={"plant_id":"string"})
          p4=pd.read_csv(root/"eia923_generator_month_net_mwh.csv",dtype={"plant_id":"string","generator_id":"string"})
          p4=p4.loc[p4.reported_ba.eq("SRP")&p4.period.eq("2024-01")]
          assert m["page1_source_rows"]==len(p1)
          assert m["page4_source_rows"]==len(p4)
          assert abs(m["page1_reported_mwh_source_only"]-p1.net_generation_mwh.sum())<1e-6
          assert abs(m["page4_reported_mwh_source_only"]-p4.generation_mwh.sum())<1e-6
          assert m["page1_page4_sum_permitted"] is False
          assert m["historical_calibration_certified"] is False
          print("Official January source-scope audit:",json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srp-2024-01-page1-page4-official-scope
          path: |
            outputs/srp_page1_page4/source_provenance.json
            outputs/srp_page1_page4/page1_all_fuels_reported_ba.csv
            outputs/srp_page1_page4/page1_prime_mover_fuel_month_summary.csv
            outputs/srp_page1_page4/page1_all_fuels_manifest.json
            outputs/srp_page1_page4/generator_extraction_manifest.json
            outputs/srp_page1_page4/eia923_generator_month_net_mwh.csv
            outputs/srp_page1_page4/page1_page4_source_scope_breakdown.csv
            outputs/srp_page1_page4/page1_page4_shared_plant_ids.csv
            outputs/srp_page1_page4/page1_page4_scope_manifest.json
          if-no-files-found: warn
