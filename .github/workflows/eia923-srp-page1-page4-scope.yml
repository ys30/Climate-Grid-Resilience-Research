name: SRP EIA923 Page1 Page4 official source-scope audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia923-srp-page1-page4-scope.yml'
      - 'src/grid_resilience/eia923_page1_all_fuels.py'
      - 'src/grid_resilience/eia923_generator_extract.py'
      - 'src/grid_resilience/eia923_page1_page4_scope_bridge.py'
      - 'tests/test_eia923_page1_page4_scope_bridge.py'
      - 'src/grid_resilience/eia923_shared_plant_difference.py'
      - 'tests/test_eia923_shared_plant_difference.py'
      - 'src/grid_resilience/srp_eia923_eia930_fuel_scope.py'
      - 'tests/test_srp_eia923_eia930_fuel_scope.py'
      - 'src/grid_resilience/srp_page1_eia860_fuel_crosswalk.py'
      - 'tests/test_srp_page1_eia860_fuel_crosswalk.py'
      - 'src/grid_resilience/srp_fuel_gap_plant_attribution.py'
      - 'tests/test_srp_fuel_gap_plant_attribution.py'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test source-scope code
        run: |
          python -m pip install -e '.[dev]' openpyxl
          python -m pytest -q tests/test_eia923_page1_all_fuels.py tests/test_eia923_page1_page4_scope_bridge.py tests/test_eia923_shared_plant_difference.py tests/test_srp_eia923_eia930_fuel_scope.py tests/test_srp_page1_eia860_fuel_crosswalk.py tests/test_srp_fuel_gap_plant_attribution.py
      - name: Fetch official EIA-923 2024 source archive and record provenance
        run: |
          mkdir -p outputs/srp_page1_page4
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          url="https://www.eia.gov/electricity/data/eia923/archive/xls/f923_2024.zip"
          request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(request,timeout=120) as response:
              content=response.read(150_000_001)
          if not content or len(content)>150_000_000:
              raise ValueError("Invalid official archive length")
          root=Path("outputs/srp_page1_page4")
          (root/"f923_2024.zip").write_bytes(content)
          (root/"source_provenance.json").write_text(json.dumps({
              "official_archive_url":url,
              "sha256":hashlib.sha256(content).hexdigest(),
              "bytes":len(content),
              "source_year":2024,
              "historical_calibration_certified":False,
          },indent=2)+"\n")
          PY
      - name: Extract January Page1 all-fuels and Page4 matched reporting populations
        run: |
          python -m grid_resilience.eia923_page1_all_fuels \
            --archive outputs/srp_page1_page4/f923_2024.zip \
            --output outputs/srp_page1_page4 --ba SRP --month 1
          python -m grid_resilience.eia923_generator_extract \
            --archive outputs/srp_page1_page4/f923_2024.zip \
            --output outputs/srp_page1_page4
      - name: Reconcile separate Page1 and Page4 plant scope without source addition
        run: |
          python -m grid_resilience.eia923_page1_page4_scope_bridge \
            --page1 outputs/srp_page1_page4/page1_all_fuels_reported_ba.csv \
            --page4 outputs/srp_page1_page4/eia923_generator_month_net_mwh.csv \
            --ba SRP --period 2024-01 --output outputs/srp_page1_page4
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          root=Path("outputs/srp_page1_page4")
          m=json.loads((root/"page1_page4_scope_manifest.json").read_text())
          p1=pd.read_csv(root/"page1_all_fuels_reported_ba.csv",dtype={"plant_id":"string"})
          p4=pd.read_csv(root/"eia923_generator_month_net_mwh.csv",dtype={"plant_id":"string","generator_id":"string"})
          p4=p4.loc[p4.reported_ba.eq("SRP")&p4.period.eq("2024-01")]
          assert m["page1_source_rows"]==len(p1)
          assert m["page4_source_rows"]==len(p4)
          assert abs(m["page1_reported_mwh_source_only"]-p1.net_generation_mwh.sum())<1e-6
          assert abs(m["page4_reported_mwh_source_only"]-p4.generation_mwh.sum())<1e-6
          assert m["page1_page4_sum_permitted"] is False
          assert m["historical_calibration_certified"] is False
          print("Official January source-scope audit:",json.dumps(m,indent=2))
          PY
      - name: Audit exact shared-plant signed differences with source fuel evidence
        run: |
          python -m grid_resilience.eia923_shared_plant_difference \
            --page1 outputs/srp_page1_page4/page1_all_fuels_reported_ba.csv \
            --page4 outputs/srp_page1_page4/eia923_generator_month_net_mwh.csv \
            --ba SRP --period 2024-01 --output outputs/srp_page1_page4
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("outputs/srp_page1_page4")
          m=json.loads((root/"shared_plant_difference_manifest.json").read_text())
          assert m["shared_plant_count"]>0
          assert not m["add_source_totals_permitted"]
          assert not m["historical_calibration_certified"]
          print("Page1/Page4 plant source comparison:",m)
          PY
      - name: Retrieve January EIA930 BA hourly fuel observations from official adjacent archives
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          import pandas as pd
          root=Path("outputs/srp_page1_page4")
          urls=[
            "https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2023_Jul_Dec.csv",
            "https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2024_Jan_Jun.csv"
          ]
          frames=[];manifest={}
          for idx,url in enumerate(urls):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=120) as response:
                  data=response.read(150_000_001)
              if not data or len(data)>150_000_000:
                  raise ValueError("Invalid EIA930 archive bytes")
              path=root/("eia930_source_"+str(idx)+".csv")
              path.write_bytes(data)
              manifest[str(idx)]={"url":url,"sha256":hashlib.sha256(data).hexdigest(),"bytes":len(data)}
              x=pd.read_csv(path,low_memory=False)
              x=x.loc[x["Balancing Authority"].astype(str).str.strip().eq("SRP")].copy()
              t=pd.to_datetime(x["UTC Time at End of Hour"],utc=True,errors="raise")
              x=x.loc[t.ge(pd.Timestamp("2024-01-01T01:00Z"))&
                      t.le(pd.Timestamp("2024-02-01T00:00Z"))]
              frames.append(x)
          b=pd.concat(frames,ignore_index=True)
          assert len(b)==744, "Jan2024 SRP UTC hour extraction not complete"
          b.to_csv(root/"eia930_srp_january_source.csv",index=False)
          (root/"eia930_source_provenance.json").write_text(json.dumps(manifest,indent=2)+"\\n")
          PY
      - name: Audit source-grain EIA923 Page1 vs EIA930 fuel reporting and missingness
        run: |
          python -m grid_resilience.srp_eia923_eia930_fuel_scope \
            --page1 outputs/srp_page1_page4/page1_all_fuels_reported_ba.csv \
            --eia930 outputs/srp_page1_page4/eia930_srp_january_source.csv \
            --ba SRP --month 2024-01 --output outputs/srp_page1_page4
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("outputs/srp_page1_page4/eia923_eia930_fuel_scope_manifest.json")
          m=json.loads(p.read_text())
          assert m["hours"]==744
          assert not m["historical_calibration_certified"]
          assert not m["category_crosswalk_certified"]
          print("Source-scope audit without calibration:",m)
          PY
      - name: Retrieve independent official EIA860 2024 annual plant and generator inventory
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          root=Path("outputs/srp_page1_page4")
          url="https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602024.zip"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=120) as response:
              data=response.read(150_000_001)
          if not data or len(data)>150_000_000:
              raise ValueError("Invalid EIA860 archive length")
          (root/"eia860_2024.zip").write_bytes(data)
          (root/"eia860_source_provenance.json").write_text(
              json.dumps({"url":url,"sha256":hashlib.sha256(data).hexdigest(),
                          "bytes":len(data),"historical_calibration_certified":False},
                         indent=2)+"\\n")
          PY
          python -m grid_resilience.eia860_generator_extract \
            --archive outputs/srp_page1_page4/eia860_2024.zip \
            --output outputs/srp_page1_page4
          python -m grid_resilience.eia860_plant_ba_census \
            --archive outputs/srp_page1_page4/eia860_2024.zip \
            --operable outputs/srp_page1_page4/eia860_2024_operable_generators.csv \
            --page4 outputs/srp_page1_page4/eia923_generator_month_net_mwh.csv \
            --ba SRP --output outputs/srp_page1_page4
      - name: Audit real Page1 plant prime mover fuel candidates against EIA860
        run: |
          python -m grid_resilience.srp_page1_eia860_fuel_crosswalk \
            --page1 outputs/srp_page1_page4/page1_all_fuels_reported_ba.csv \
            --roster outputs/srp_page1_page4/plant_ba_operable_generator_census.csv \
            --ba SRP --period 2024-01 --output outputs/srp_page1_page4
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("outputs/srp_page1_page4")
          a=json.loads((root/"page1_eia860_fuel_candidate_manifest.json").read_text())
          b=json.loads((root/"plant_ba_generator_census_manifest.json").read_text())
          assert a["page1_source_rows"]>0
          assert a["eia860_plant_ba_generator_count"]==b["eia860_plant_assigned_operable_generators"]
          assert not a["historical_calibration_certified"]
          assert not a["unique_generator_assignment_certified"]
          print("Real EIA-923/EIA-860 fuel candidate audit:",a)
          PY
      - name: Report official NG and coal Page1 plant contributions and EIA930 numeric gaps
        run: |
          python -m grid_resilience.srp_fuel_gap_plant_attribution \
            --page1 outputs/srp_page1_page4/page1_all_fuels_reported_ba.csv \
            --eia930-fuel-coverage outputs/srp_page1_page4/eia930_monthly_fuel_reporting_coverage.csv \
            --output outputs/srp_page1_page4 --ba SRP --period 2024-01
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("outputs/srp_page1_page4")
          m=json.loads((root/"ng_coal_source_diagnostic_manifest.json").read_text())
          assert m["ng_distinct_plants"]>0
          assert m["sub_distinct_plants"]>0
          assert not m["historical_calibration_certified"]
          print(m)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srp-2024-01-page1-page4-official-scope
          path: |
            outputs/srp_page1_page4/source_provenance.json
            outputs/srp_page1_page4/page1_all_fuels_reported_ba.csv
            outputs/srp_page1_page4/page1_prime_mover_fuel_month_summary.csv
            outputs/srp_page1_page4/page1_all_fuels_manifest.json
            outputs/srp_page1_page4/generator_extraction_manifest.json
            outputs/srp_page1_page4/eia923_generator_month_net_mwh.csv
            outputs/srp_page1_page4/page1_page4_source_scope_breakdown.csv
            outputs/srp_page1_page4/page1_page4_shared_plant_ids.csv
            outputs/srp_page1_page4/page1_page4_scope_manifest.json
            outputs/srp_page1_page4/page1_page4_plant_differences.csv
            outputs/srp_page1_page4/page1_shared_plant_fuel_evidence.csv
            outputs/srp_page1_page4/shared_plant_difference_manifest.json
            outputs/srp_page1_page4/eia930_source_provenance.json
            outputs/srp_page1_page4/eia930_monthly_fuel_reporting_coverage.csv
            outputs/srp_page1_page4/eia923_page1_prime_mover_fuel_comparison.csv
            outputs/srp_page1_page4/eia923_eia930_fuel_scope_manifest.json
            outputs/srp_page1_page4/eia860_source_provenance.json
            outputs/srp_page1_page4/plant_ba_generator_census_manifest.json
            outputs/srp_page1_page4/page1_eia860_fuel_candidate_rows.csv
            outputs/srp_page1_page4/page1_eia860_fuel_candidate_classes.csv
            outputs/srp_page1_page4/page1_eia860_fuel_candidate_manifest.json
            outputs/srp_page1_page4/page1_ng_sub_plant_attribution.csv
            outputs/srp_page1_page4/ng_coal_cross_source_differences.csv
            outputs/srp_page1_page4/ng_coal_source_diagnostic_manifest.json
          if-no-files-found: warn
