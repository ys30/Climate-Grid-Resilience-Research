name: Paper C official EIA860M source-vintage exact-month schema
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paperc-eia860m-2025-vintage-probe.yml'
jobs:
  verify-original-monthly-generator-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl
      - name: Fetch EIA-hosted February and August 2025 month-specific raw files
        run: |
          mkdir -p outputs/monthly/source outputs/monthly/results
          python - <<'PY'
          from pathlib import Path
          import io,hashlib,json
          from urllib.request import Request,urlopen
          from openpyxl import load_workbook
          out=Path("outputs/monthly/results")
          m=[]
          for month in ("february","august"):
              url=f"https://www.eia.gov/electricity/data/eia860m/archive/xls/{month}_generator2025.xlsx"
              with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=180) as r:
                  data=r.read()
                  resolved=r.geturl()
              assert len(data)>100000 and data.startswith(b"PK"),"Official EIA860M workbook unavailable"
              (Path("outputs/monthly/source")/f"{month}_generator2025.xlsx").write_bytes(data)
              wb=load_workbook(io.BytesIO(data),read_only=True,data_only=True)
              tabs=[]
              for sheet in wb:
                  top=[]
                  for k,row in enumerate(sheet.iter_rows(values_only=True)):
                      if k>=9:break
                      top.append([str(x)[:90] if x is not None else None for x in row[:30]])
                  tabs.append({"name":sheet.title,"rows":sheet.max_row,
                               "columns":sheet.max_column,"first_9_rows":top})
              wb.close()
              item={"month":month,"year":2025,"original_url":url,
                    "resolved_url":resolved,"bytes":len(data),
                    "sha256":hashlib.sha256(data).hexdigest(),"tabs":tabs,
                    "monthly_preliminary_capacity_not_firm_available_mw":True}
              print("EIA860M SOURCE PROBE:",json.dumps(item))
              m.append(item)
          (out/"official_eia860m_feb_aug_2025_schema_sha256.json").write_text(
              json.dumps(m,indent=2)+"\n")
          assert len(m)==2 and all(x["tabs"] for x in m)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paperc-eia860m-2025-feb-aug-official-monthly-schema
          path: outputs/monthly/results/
          if-no-files-found: error
