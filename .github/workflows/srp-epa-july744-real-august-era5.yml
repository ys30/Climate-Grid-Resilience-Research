name: SRP EPA local July 744h completion with observed August ERA5
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/srp-epa-july744-real-august-era5.yml'
      - 'src/grid_resilience/srp_epa_era5_august_boundary_completion.py'
      - 'tests/test_srp_epa_era5_august_boundary_completion.py'
jobs:
  observed-august-era5-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test exact seven-hour observed-source gate
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_srp_epa_era5_august_boundary_completion.py tests/test_srp_epa_era5_july_local_standard_alignment.py
      - name: Retrieve previously CI-verified July EPA and ERA5 source artifact, plus EIA860 site coordinates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/srp_epa_july744/july outputs/srp_epa_july744/sites outputs/srp_epa_july744/august
          gh run download 41926491544 --repo ys30/Climate-Grid-Resilience-Research --name srp-2024-epa-era5-july-mst-utc-source-alignment --dir outputs/srp_epa_july744/july
          gh run download 41773763147 --repo ys30/Climate-Grid-Resilience-Research --name srp-july2024-fullfleet-thermal-era5 --dir outputs/srp_epa_july744/sites
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path("outputs/srp_epa_july744")
          e=pd.read_csv(p/"july/epa_source_july_lstd_era5_utc_hourly.csv",dtype={"facility_id":"string","unit_id":"string"})
          s=pd.read_csv(p/"sites/srp_thermal_era5_site_selection.csv",dtype={"plant_id":"string"})
          assert len(e)==7440 and e.groupby(["facility_id","unit_id"]).size().eq(744).all()
          target=s.loc[s.plant_id.isin(["141","55129","147"]) & s.technology.eq("gas")]
          assert len(target)==3 and set(target.plant_id)=={"141","55129","147"}
          assert not target[["plant_id","latitude","longitude","nameplate_mw"]].isna().any().any()
          target.to_csv(p/"august/verified_target_site_selection.csv",index=False)
          PY
      - name: Fetch genuine August 2024 ERA5 plant-hour source with request and response hashes
        run: |
          python -m grid_resilience.srp_thermal_era5_temperature_intake \
            --sites outputs/srp_epa_july744/august/verified_target_site_selection.csv \
            --year 2024 --month 8 --output outputs/srp_epa_july744/august
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          p=Path("outputs/srp_epa_july744/august")
          a=pd.read_csv(p/"srp_thermal_era5_plant_hourly.csv",dtype={"plant_id":"string"})
          m=json.loads((p/"srp_thermal_era5_manifest.json").read_text())
          assert m["period"]=="2024-08" and m["selected_site_count"]==3
          assert len(a)==3*744
          assert len(m["plant_provenance"])==3
          assert all(z["url"] and len(z["sha256"])==64 for z in m["plant_provenance"])
          aug=a.loc[a.timestamp_utc.between("2024-08-01T00:00:00Z","2024-08-01T06:00:00Z")]
          assert len(aug)==21
          assert aug.groupby("plant_id").size().eq(7).all()
          aug[["plant_id","timestamp_utc","temperature_2m_c"]].to_csv(p/"observed_aug1_utc_7h_by_site.csv",index=False)
          PY
      - name: Verify source bytes and join 744 local-July hours without imputation
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path("outputs/srp_epa_july744")
          file=root/"august/observed_aug1_utc_7h_by_site.csv"
          meta=json.loads((root/"august/srp_thermal_era5_manifest.json").read_text())
          assert meta["period"]=="2024-08"
          url=";".join(sorted(z["url"] for z in meta["plant_provenance"]))
          sha=hashlib.sha256(file.read_bytes()).hexdigest()
          subprocess.run([
              "python","-m","grid_resilience.srp_epa_era5_august_boundary_completion",
              "--july-panel",str(root/"july/epa_source_july_lstd_era5_utc_hourly.csv"),
              "--august-weather",str(file),"--august-source-url",url,
              "--august-sha256",sha,"--output",str(root/"completed")],check=True)
          import pandas as pd
          s=pd.read_csv(root/"completed/epa_local_july_744h_observed_summary.csv")
          assert len(s)==10 and s.complete_matched_hours.eq(744).all()
          assert s.jul_utc_source_matched.eq(737).all()
          assert s.aug_utc_observed_boundary_matched.eq(7).all()
          print(s.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srp-epa-local-july744-real-august-era5
          path: |
            outputs/srp_epa_july744/august/verified_target_site_selection.csv
            outputs/srp_epa_july744/august/srp_thermal_era5_manifest.json
            outputs/srp_epa_july744/august/observed_aug1_utc_7h_by_site.csv
            outputs/srp_epa_july744/completed/epa_local_july_744h_observed_era5.csv
            outputs/srp_epa_july744/completed/epa_local_july_744h_observed_summary.csv
            outputs/srp_epa_july744/completed/epa_local_july_744h_source_manifest.json
          if-no-files-found: warn
