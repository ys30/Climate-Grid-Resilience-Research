name: Paper C source-backed July 2024 four-week factorial main figure
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paperc-july2024-four-week-mainfigure.yml'
      - 'src/grid_resilience/paperc_2024_four_week_mainfigure.py'
      - 'tests/test_paperc_2024_four_week_mainfigure.py'
jobs:
  original-four-week-paper-figure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and check all 4-week figure integrity regressions
        run: |
          python -m pip install -e '.[dev]' numpy matplotlib
          python -m pytest -q tests/test_paperc_2024_four_week_mainfigure.py
      - name: Restore exactly verified 4-week original source solver artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/paperc_fourweek_main/source outputs/paperc_fourweek_main/figures
          gh run download 42104106361 --repo ys30/Climate-Grid-Resilience-Research \
            --name july2024-4-disjoint-real-week-factorial-source-results \
            --dir outputs/paperc_fourweek_main/source
      - name: Recalculate all source-derived factorial responses and render paper figures
        run: |
          python -m grid_resilience.paperc_2024_four_week_mainfigure \
            --dispatch outputs/paperc_fourweek_main/source/july_four_week_four_scenario_ba_dispatch.csv \
            --by-ba outputs/paperc_fourweek_main/source/july_four_week_factorial_interaction_by_ba.csv \
            --contrast outputs/paperc_fourweek_main/source/july_four_week_isolated_vs_links_interaction.csv \
            --scope outputs/paperc_fourweek_main/source/july_four_week_replication_scope.json \
            --output outputs/paperc_fourweek_main/figures
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path("outputs/paperc_fourweek_main/source")
          c=pd.read_csv(p/"july_four_week_isolated_vs_links_interaction.csv")
          assert len(c)==4
          assert abs(c.links_10pct.iloc[0]-22515.998)<0.02
          assert abs(c.links_10pct.iloc[1]-16204.695)<0.02
          assert abs(c.links_10pct.iloc[2]-25211.030)<0.02
          assert abs(c.links_10pct.iloc[3]-15177.070)<0.02
          for f in Path("outputs/paperc_fourweek_main/figures").iterdir():
              assert f.stat().st_size>1000
          print("SOURCE-RECOMPUTED MAIN FIGURE ADMITTED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paper-c-2024-four-week-factorial-source-recomputed-mainfigure
          path: |
            outputs/paperc_fourweek_main/figures/
            outputs/paperc_fourweek_main/source/july_four_week_isolated_vs_links_interaction.csv
            outputs/paperc_fourweek_main/source/july_four_week_replication_scope.json
          if-no-files-found: error
