name: Grand Coulee July 2024 actual USACE pumping and reservoir level paper figures
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/grand-coulee-july2024-observed-hydro-figures.yml'
      - 'src/grid_resilience/grand_coulee_2024_july_observed_hydro_figures.py'
jobs:
  plots-source-certified:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact charting dependencies
        run: |
          python -m pip install -e .
          python -m pip install matplotlib
      - name: Restore three-way observed 2024 USACE USBR USGS dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/figures/source outputs/figures/plots
          gh run download 42137443592 --repo ys30/Climate-Grid-Resilience-Research --name grand-coulee-2024-july-real-pumping-28day-and-three-independent-water-source-reconciliation --dir outputs/figures/source
      - name: Render original-observation figures with clear scope and noncalibrated head warnings
        run: |
          python -m grid_resilience.grand_coulee_2024_july_observed_hydro_figures \
            --joined-source outputs/figures/source/grand_coulee_2024_july_31day_usace_usbr_usgs_pumping_lake_observation_reconciliation.csv \
            --output outputs/figures/plots
          python - <<'PY'
          from pathlib import Path
          root=Path("outputs/figures/plots")
          images=list(root.glob("fig_*.png"))
          assert len(images)==2
          assert all(x.stat().st_size>18000 for x in images)
          print("VERIFIED ORIGINAL SOURCE FIGURES",[(p.name,p.stat().st_size) for p in images])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grand-coulee-july2024-observed-usace-pumping-and-dual-reservoir-paper-plots
          path: outputs/figures/plots/
          if-no-files-found: error
