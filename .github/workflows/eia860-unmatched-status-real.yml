name: Official EIA-860 unmatched status investigation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia860-unmatched-status-real.yml'
      - 'src/grid_resilience/eia860_full_status_triage.py'
      - 'src/grid_resilience/retired_generator_observation_ledger.py'
      - 'src/grid_resilience/eia923_full_observation_ledger.py'
      - 'src/grid_resilience/eia923_monthly_technology_coverage.py'
      - 'src/grid_resilience/eia860_generator_extract.py'
      - 'src/grid_resilience/eia923_generator_extract.py'
      - 'src/grid_resilience/eia923_page1_hy_ps.py'
      - 'src/grid_resilience/eia923_page1_all_fuels.py'
      - 'tests/test_eia923_page1_all_fuels.py'
jobs:
  status-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' openpyxl pandas
      - name: Test Page1 provenance and missing-value handling
        run: python -m pytest -q tests/test_eia923_page1_all_fuels.py
      - name: Download official 2024 archives
        run: |
          mkdir -p outputs/status_audit
          python - <<'PY'
          import urllib.request,time
          from pathlib import Path
          sources={
            "eia860":"https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602024.zip",
            "eia923":"https://www.eia.gov/electricity/data/eia923/archive/xls/f923_2024.zip"}
          for key,url in sources.items():
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                      with urllib.request.urlopen(req,timeout=120) as response:
                          data=response.read()
                      if len(data)<10000:raise RuntimeError("Unexpectedly small official ZIP")
                      (Path("outputs/status_audit")/(key+".zip")).write_bytes(data)
                      break
                  except Exception:
                      if attempt==2:raise
                      time.sleep(5*(attempt+1))
          PY
      - name: Extract 2024 reported generator-month rows and EIA-860 operable inventory
        run: |
          python -m grid_resilience.eia923_generator_extract --archive outputs/status_audit/eia923.zip --output outputs/status_audit
          python -m grid_resilience.eia860_generator_extract --archive outputs/status_audit/eia860.zip --output outputs/status_audit
      - name: Generate strict unmatched keys from official sources
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out=Path("outputs/status_audit")
          p=pd.read_csv(out/"eia923_generator_month_net_mwh.csv",dtype="string")
          e=pd.read_csv(out/"eia860_2024_operable_generators.csv",dtype="string")
          for df in (p,e):
              df["plant_id"]=df.plant_id.str.strip().str.replace(r"^0+(?=[0-9])","",regex=True)
              df["generator_id"]=df.generator_id.str.strip()
          matches=e[["plant_id","generator_id"]].drop_duplicates()
          marked=p.merge(matches.assign(exact_operable=True),how="left",on=["plant_id","generator_id"],validate="many_to_one")
          unmatched=marked[marked.exact_operable.isna()].drop(columns=["exact_operable"])
          if unmatched.empty:raise ValueError("No unmatched rows: investigate upstream crosswalk changes")
          unmatched.to_csv(out/"unmatched_generator_months_recomputed.csv",index=False)
          print("Reported Page-4 unmatched generator-month rows:",len(unmatched))
          print("Distinct plant/generator pairs:",len(unmatched[["plant_id","generator_id"]].drop_duplicates()))
          PY
      - name: Compare unmatched identities across all official EIA-860 generator worksheets
        run: |
          python -m grid_resilience.eia860_full_status_triage --archive outputs/status_audit/eia860.zip --unmatched outputs/status_audit/unmatched_generator_months_recomputed.csv --output outputs/status_audit/unmatched_all_status_sheets.csv
          cat outputs/status_audit/unmatched_all_status_sheets.csv
      - name: Preserve measured EIA-923 net MWh separately from status eligibility
        run: |
          python -m grid_resilience.retired_generator_observation_ledger --observed outputs/status_audit/unmatched_generator_months_recomputed.csv --statuses outputs/status_audit/unmatched_all_status_sheets.csv --output outputs/status_audit/unmatched_observation_ledger.csv
      - name: Audit full extracted Page-4 source coverage without discarding unmatched energy
        run: |
          python -m grid_resilience.eia923_full_observation_ledger --page4 outputs/status_audit/eia923_generator_month_net_mwh.csv --operable outputs/status_audit/eia860_2024_operable_generators.csv --output outputs/status_audit
      - name: Audit observed monthly technology coverage and multifuel exclusions
        run: |
          python -m grid_resilience.eia923_monthly_technology_coverage --ledger outputs/status_audit/eia923_page4_full_observation_ledger.csv --operable outputs/status_audit/eia860_2024_operable_generators.csv --output outputs/status_audit
      - name: Extract Page1 observed hydro and pumped storage
        run: |
          python -m grid_resilience.eia923_page1_hy_ps --archive outputs/status_audit/eia923.zip --ba SRP --output outputs/status_audit
      - name: Extract independent Page1 all-fuel SRP January source summary
        run: |
          python -m grid_resilience.eia923_page1_all_fuels --archive outputs/status_audit/eia923.zip --ba SRP --month 1 --output outputs/status_audit
          python - <<'PY'
          import pandas as pd,json
          from pathlib import Path
          d=Path('outputs/status_audit')
          s=pd.read_csv(d/'page1_prime_mover_fuel_month_summary.csv')
          m=json.loads((d/'page1_all_fuels_manifest.json').read_text())
          assert abs(s.observed_net_mwh.sum()-m['observed_reported_ba_page1_net_mwh'])<1e-6
          assert not m['historical_calibration_certified']
          PY
      - name: Cross-reconcile independent Page1 HY/PS with all-fuel rows
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          out=Path('outputs/status_audit')
          all_fuels=pd.read_csv(out/'page1_all_fuels_reported_ba.csv')
          hydro=pd.read_csv(out/'page1_hy_ps_monthly_observations.csv')
          a=all_fuels.loc[all_fuels.prime_mover.isin(['HY','PS'])].groupby(['prime_mover','period']).net_generation_mwh.sum()
          b=hydro.groupby(['prime_mover','period']).net_generation_mwh.sum()
          if not a.index.equals(b.index):
              raise ValueError('Page1 HY/PS month coverage mismatch between independent extractors')
          delta=(a-b).abs()
          if not delta.le(0.000001).all():
              raise ValueError(f'Independent Page1 MWh disagreement: {delta[delta.gt(.000001)]}')
          jan=all_fuels[all_fuels.period.eq('2024-01')]
          h=jan.loc[jan.prime_mover.eq('HY'),'net_generation_mwh'].sum()
          p=jan.loc[jan.prime_mover.eq('PS'),'net_generation_mwh'].sum()
          assert abs(h-1015.0)<1e-6 and abs(p+132.0)<1e-6
          print('HY/PS monthly independent source extraction reconciled for 12 months')
          print('2024-01 HY MWh',h,'PS MWh',p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia860-2024-unmatched-status-real
          path: |
            outputs/status_audit/unmatched_generator_months_recomputed.csv
            outputs/status_audit/unmatched_all_status_sheets.csv
            outputs/status_audit/unmatched_observation_ledger.csv
            outputs/status_audit/eia923_page4_full_observation_ledger.csv
            outputs/status_audit/eia923_page4_coverage_summary.csv
            outputs/status_audit/eia923_technology_classification_audit.csv
            outputs/status_audit/eia923_month_technology_coverage.csv
            outputs/status_audit/eia923_multifuel_exclusions.csv
            outputs/status_audit/generator_extraction_manifest.json
            outputs/status_audit/eia860_extraction_manifest.json
            outputs/status_audit/page1_hy_ps_monthly_observations.csv
            outputs/status_audit/page1_hy_ps_manifest.json
            outputs/status_audit/page1_all_fuels_reported_ba.csv
            outputs/status_audit/page1_prime_mover_fuel_month_summary.csv
            outputs/status_audit/page1_all_fuels_manifest.json
