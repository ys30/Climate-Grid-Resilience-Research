name: June July moving block sensitivity
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/srp-epa-june-july-multiday-difference.yml'
      - 'src/grid_resilience/srp_epa_june_july_multiday_difference_bootstrap.py'
      - 'tests/test_srp_epa_june_july_multiday_difference_bootstrap.py'
jobs:
  test-observed-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_srp_epa_june_july_multiday_difference_bootstrap.py
      - name: Recover source input artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/multiday/source outputs/multiday/baseline outputs/multiday/result
          gh run download 42092282072 --repo ys30/Climate-Grid-Resilience-Research --name srp-2024-epa-june-july-real-source-common-support --dir outputs/multiday/source
          gh run download 42093112865 --repo ys30/Climate-Grid-Resilience-Research --name srp-2024-june-july-joint-cell-source-ols --dir outputs/multiday/baseline
      - name: Compute two three five day source sensitivity
        run: |
          python -m grid_resilience.srp_epa_june_july_multiday_difference_bootstrap --june-panel outputs/multiday/source/results/june_2024_epa_era5_eia930_verified_unit_hours.csv --july-panel outputs/multiday/source/results/july_2024_epa_era5_eia930_verified_unit_hours.csv --baseline outputs/multiday/baseline/epa_june_july_joint_support_controlled_ols.csv --replicates 120 --seed 20261105 --output outputs/multiday/result
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path("outputs/multiday/result")
          d=pd.read_csv(p/"epa_june_july_common_support_multiday_coef_difference.csv")
          s=pd.read_csv(p/"epa_june_july_multiday_width_stability_summary.csv")
          m=json.loads((p/"epa_june_july_multiday_bootstrap_scope_manifest.json").read_text())
          assert len(d)==18 and len(s)==6
          assert set(d.block_width_consecutive_local_dates)=={2,3,5}
          assert not m["causal_thermal_derating_or_eia_net_mw_estimated"]
          assert not m["independent_out_of_month_prediction_test_performed"]
          print("MULTIDAY_SOURCE_RESULTS")
          print(d.to_string(index=False))
          print("MULTIDAY_STABILITY_RESULTS")
          print(s.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srp-2024-june-july-common-cell-multiday-2-3-5-bootstrap
          path: outputs/multiday/result/
          if-no-files-found: warn
