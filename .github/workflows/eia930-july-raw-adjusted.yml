name: July 2024 EIA-930 raw versus adjusted balance audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia930-july-raw-adjusted.yml'
      - 'src/grid_resilience/eia930_adjusted_balance_comparison.py'
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Download official EIA-930 2024 July-December CSV
        run: |
          mkdir -p outputs/eia930_july_adjusted
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from urllib.request import Request,urlopen
          url='https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2024_Jul_Dec.csv'
          with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=150) as r:
              payload=r.read();redirect=r.geturl()
          assert len(payload)>1000
          root=Path('outputs/eia930_july_adjusted')
          (root/'official_2024_h2_balance.csv').write_bytes(payload)
          (root/'official_file_provenance.json').write_text(json.dumps({
              'url':url,'resolved_url':redirect,'sha256':hashlib.sha256(payload).hexdigest(),
              'bytes':len(payload)},indent=2)+'\n')
          PY
      - name: Check first seven July UTC hours across official H1 and H2 CSV
        run: |
          python - <<'PY'
          import csv,json
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          from urllib.request import Request,urlopen
          root=Path('outputs/eia930_july_adjusted')
          h1='https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2024_Jan_Jun.csv'
          with urlopen(Request(h1,headers={'User-Agent':'Mozilla/5.0'}),timeout=150) as r:
              payload=r.read()
          assert len(payload)>1000
          import hashlib
          (root/'official_h1_boundary_provenance.json').write_text(json.dumps({
              'url':h1,'sha256':hashlib.sha256(payload).hexdigest(),'bytes':len(payload)},indent=2)+'\\n')
          h1path=root/'official_h1_temporary.csv'
          h1path.write_bytes(payload)
          bas=('CISO','AZPS','BPAT','SRP')
          target={datetime(2024,7,1,tzinfo=timezone.utc)+timedelta(hours=h) for h in range(7)}
          def extract(path):
              found={ba:set() for ba in bas}
              with path.open(newline='',encoding='utf-8-sig') as file:
                  for row in csv.DictReader(file):
                      ba=row['Balancing Authority'].strip()
                      if ba not in found:continue
                      stamp=datetime.strptime(row['UTC Time at End of Hour'],'%m/%d/%Y %I:%M:%S %p').replace(tzinfo=timezone.utc)-timedelta(hours=1)
                      if stamp in target:found[ba].add(stamp)
              return found
          first=extract(h1path);second=extract(root/'official_2024_h2_balance.csv')
          result={ba:{'h1_found_utc_hours':[t.isoformat() for t in sorted(first[ba])],
                       'h2_found_utc_hours':[t.isoformat() for t in sorted(second[ba])],
                       'combined_missing_utc_hours':[t.isoformat() for t in sorted(target-first[ba]-second[ba])]}
                  for ba in bas}
          (root/'h1_h2_july_boundary_audit.json').write_text(json.dumps(result,indent=2)+'\\n')
          print('OFFICIAL H1/H2 UTC BOUNDARY AUDIT')
          print(json.dumps(result,indent=2))
          # Preserve source row values. Only join across official file boundary;
          # never infer missing hourly interchange values.
          merged=root/'official_2024_july_combined.csv'
          start=datetime(2024,7,1,tzinfo=timezone.utc)
          end=datetime(2024,8,1,tzinfo=timezone.utc)
          counts={ba:0 for ba in bas}
          seen=set()
          with merged.open('w',newline='',encoding='utf-8') as dest:
              writer=None
              for source in (h1path,root/'official_2024_h2_balance.csv'):
                  with source.open(newline='',encoding='utf-8-sig') as stream:
                      reader=csv.DictReader(stream)
                      if writer is None:
                          writer=csv.DictWriter(dest,fieldnames=reader.fieldnames)
                          writer.writeheader()
                      elif set(reader.fieldnames)!=set(writer.fieldnames):
                          raise ValueError('Official H1/H2 schemas differ')
                      for row in reader:
                          ba=row['Balancing Authority'].strip()
                          if ba not in bas:continue
                          t=datetime.strptime(row['UTC Time at End of Hour'],'%m/%d/%Y %I:%M:%S %p').replace(tzinfo=timezone.utc)-timedelta(hours=1)
                          if not start<=t<end:continue
                          key=(ba,t)
                          if key in seen:raise ValueError(f'Duplicate cross-file BA hour: {key}')
                          seen.add(key);counts[ba]+=1;writer.writerow(row)
          if any(count!=744 for count in counts.values()):
              raise ValueError(f'Incomplete merged July source rows: {counts}')
          print('MERGED JULY UTC SOURCE ROW COUNTS:',counts)
          (root/'july_combined_source_manifest.json').write_text(json.dumps({
              'month':'2024-07','source_order':['official H1','official H2'],
              'hour_start_utc':True,'rows_per_ba':counts,
              'values_imputed':False,'historical_calibration_certified':False},indent=2)+'\\n')
          h1path.unlink()
          PY
      - name: Compare raw and adjusted hourly accounting for July 2024
        run: |
          python -m grid_resilience.eia930_adjusted_balance_comparison \
            --csv outputs/eia930_july_adjusted/official_2024_july_combined.csv \
            --month 2024-07 --allow-incomplete --output outputs/eia930_july_adjusted
          cat outputs/eia930_july_adjusted/eia930_hour_coverage.json
          echo "FIRST MISSING ROW/FIELD TIMESTAMPS"
          head -n 32 outputs/eia930_july_adjusted/eia930_missing_hours.csv
          cat outputs/eia930_july_adjusted/eia930_raw_vs_adjusted_balance.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JULY2024-EIA930-OFFICIAL-RAW-ADJUSTED-BALANCE
          path: outputs/eia930_july_adjusted
          if-no-files-found: warn
