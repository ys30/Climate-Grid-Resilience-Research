name: Join verified 2024 EIA-930 and ERA5 event inputs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/join-observed-2024.yml'
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: REAL-EIA930-four-BA-hourly-demand-audit
          run-id: 41098286616
          github-token: ${{ github.token }}
          path: inputs/demand
      - uses: actions/download-artifact@v4
        with:
          name: REAL-ERA5-point-proxy-weather-2024-summer
          run-id: 41099060107
          github-token: ${{ github.token }}
          path: inputs/weather
      - name: Validate exact UTC hour and BA matching
        run: |
          python -m grid_resilience.match_observed_inputs \
            --demand inputs/demand/eia930_demand_2024_summer.csv \
            --weather inputs/weather/era5_weather_2024_summer.csv \
            --output outputs/observed_2024
      - name: Screen historical heat and low-wind event candidates
        run: |
          python -m grid_resilience.events \
            --weather outputs/observed_2024/weather.csv \
            --output outputs/observed_2024/event_candidates.csv \
            --heat-c 35 --low-wind-cf 0.2 --min-bas 2 --min-hours 6
      - name: Verify event candidate schema
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('outputs/observed_2024/event_candidates.csv')
          assert {'event_id','event_type','start_utc','end_utc_inclusive','active_hours'}.issubset(d.columns)
          print('Candidate events (descriptive, uncalibrated):',len(d))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MATCHED-OBSERVED-EIA930-ERA5-2024
          path: outputs/observed_2024/
          retention-days: 60
