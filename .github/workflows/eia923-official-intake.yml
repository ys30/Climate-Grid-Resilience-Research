name: EIA-923 2024 official archive intake
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eia923-official-intake.yml'
      - 'src/grid_resilience/eia923_prime_mover_audit.py'
      - 'src/grid_resilience/eia923_hydro_monthly_evidence.py'
      - 'src/grid_resilience/eia923_hydro_coverage.py'
      - 'tests/test_eia923_hydro_coverage.py'
      - 'src/grid_resilience/eia923_page1_hydro_probe.py'
      - 'src/grid_resilience/eia923_page1_ba_hydro_audit.py'
      - 'src/grid_resilience/eia923_page1_ps_netgen.py'
      - 'src/grid_resilience/eia923_page1_hy_inventory.py'
      - 'src/grid_resilience/eia923_page1_netgen_schema.py'
      - 'src/grid_resilience/eia923_page1_hy_netgen.py'
      - 'tests/test_eia923_page1_hy_netgen.py'
      - 'tests/test_eia923_page1_hy_inventory.py'
      - 'src/grid_resilience/eia923_page1_ps_reconciliation.py'
      - 'tests/test_eia923_page1_ps_reconciliation.py'
      - 'tests/test_eia923_page1_ps_netgen.py'
      - 'src/grid_resilience/eia923_archive.py'
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workbook reader
        run: python -m pip install -e . openpyxl xlrd pytest
      - name: Test original-workbook extraction with Excel reader available
        run: python -m pytest tests/test_eia923_generator_extract.py -q
      - name: Download official 2024 final archive
        run: |
          mkdir -p outputs/eia923_intake
          python - <<'PY'
          from urllib.request import Request, urlopen
          from pathlib import Path
          import time
          url = "https://www.eia.gov/electricity/data/eia923/archive/xls/f923_2024.zip"
          for attempt in range(3):
              try:
                  req=Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; research provenance audit)"})
                  with urlopen(req,timeout=120) as response:
                      if response.status != 200:
                          raise RuntimeError(f"HTTP {response.status}")
                      data=response.read()
                  Path("outputs/eia923_intake/f923_2024.zip").write_bytes(data)
                  print("Downloaded bytes:",len(data))
                  break
              except Exception:
                  if attempt == 2: raise
                  time.sleep(5*(attempt+1))
          PY
      - name: Record ZIP checksum and member inventory
        run: |
          python -m grid_resilience.eia923_archive \
            --archive outputs/eia923_intake/f923_2024.zip \
            --output outputs/eia923_intake/archive_manifest.json \
            --source-url https://www.eia.gov/electricity/data/eia923/archive/xls/f923_2024.zip
      - name: Inspect actual workbook names and sheet headers
        run: |
          python - <<'PY'
          import zipfile,io,json
          from pathlib import Path
          from openpyxl import load_workbook
          import xlrd
          archive=Path("outputs/eia923_intake/f923_2024.zip")
          result=[]
          with zipfile.ZipFile(archive) as z:
              for member in z.namelist():
                  low=member.lower()
                  if not low.endswith((".xlsx",".xls",".xlsm")): continue
                  entry={"file":member,"sheets":[]}
                  raw=z.read(member)
                  if low.endswith((".xlsx",".xlsm")):
                      wb=load_workbook(io.BytesIO(raw),read_only=True,data_only=True)
                      for ws in wb:
                          head=[]
                          for row in ws.iter_rows(min_row=1,max_row=8,values_only=True):
                              head.append([str(v)[:120] if v is not None else None for v in row[:35]])
                          entry["sheets"].append({"name":ws.title,"first_8_rows":head})
                      wb.close()
                  else:
                      wb=xlrd.open_workbook(file_contents=raw,on_demand=True)
                      for ws in wb.sheets():
                          head=[[str(v)[:120] for v in ws.row_values(i,0,min(ws.ncols,35))]
                                for i in range(min(ws.nrows,8))]
                          entry["sheets"].append({"name":ws.name,"first_8_rows":head})
                  result.append(entry)
          path=Path("outputs/eia923_intake/workbook_structure.json")
          path.write_text(json.dumps(result,indent=2))
          print("Workbooks:",len(result))
          for item in result:
              print(item["file"],[sheet["name"] for sheet in item["sheets"]])
          PY
      - name: Probe actual generator and fuel worksheet columns
        run: |
          python -m grid_resilience.eia923_schema_probe \
            --archive outputs/eia923_intake/f923_2024.zip \
            --output outputs/eia923_intake/generation_schema_probe.json
      - name: Extract original 2024 generator-month net generation for target BAs
        run: |
          python -m grid_resilience.eia923_generator_extract \
            --archive outputs/eia923_intake/f923_2024.zip \
            --output outputs/eia923_intake
      - name: Audit actual BA and prime mover monthly totals
        run: |
          python -m grid_resilience.eia923_prime_mover_audit \
            --input outputs/eia923_intake/eia923_generator_month_net_mwh.csv \
            --output outputs/eia923_intake
      - name: Print independently extracted hydropower monthly evidence
        run: |
          python - <<'PY'
          import pandas as pd
          p=pd.read_csv('outputs/eia923_intake/ba_prime_mover_month_audit.csv')
          print('Available columns:',list(p.columns))
          print(p.head(16).to_string(index=False))
          PY
      - name: Probe Page 1 hydro and pumped storage source layout
        run: |
          python -m grid_resilience.eia923_page1_hydro_probe --archive outputs/eia923_intake/f923_2024.zip --output outputs/eia923_intake/page1_hydro_probe.json
      - name: Count original Page 1 hydro/pumped source rows by target BA
        run: |
          python -m grid_resilience.eia923_page1_ba_hydro_audit --archive outputs/eia923_intake/f923_2024.zip --output outputs/eia923_intake/page1_ba_hydro_audit.json
      - name: Probe full Page 1 monthly net-generation columns
        run: |
          python -m grid_resilience.eia923_page1_netgen_schema --archive outputs/eia923_intake/f923_2024.zip --output outputs/eia923_intake/page1_netgen_schema.json
          cat outputs/eia923_intake/page1_netgen_schema.json
      - name: Inventory Page 1 conventional hydro sources without assuming MWh
        run: |
          python -m grid_resilience.eia923_page1_hy_inventory --archive outputs/eia923_intake/f923_2024.zip --output outputs/eia923_intake
          cat outputs/eia923_intake/page1_hy_source_inventory_manifest.json
      - name: Extract official Page 1 conventional hydro monthly net MWh
        run: |
          python -m grid_resilience.eia923_page1_hy_netgen --archive outputs/eia923_intake/f923_2024.zip --output outputs/eia923_intake
          cat outputs/eia923_intake/page1_hy_netgen_manifest.json
      - name: Extract measured Page 1 energy-storage PS net MWh
        run: |
          python -m grid_resilience.eia923_page1_ps_netgen --archive outputs/eia923_intake/f923_2024.zip --output outputs/eia923_intake
          cat outputs/eia923_intake/eia923_page1_ps_manifest.json
      - name: Reconcile observed Page 1 PS BA-month coverage
        run: |
          python -m grid_resilience.eia923_page1_ps_reconciliation --input outputs/eia923_intake/eia923_page1_ps_plant_month_net_mwh.csv --output outputs/eia923_intake
          cat outputs/eia923_intake/page1_ps_ba_month_manifest.json
      - name: Extract distinct real hydro and pumped storage monthly evidence
        run: |
          python -m grid_resilience.eia923_hydro_monthly_evidence --input outputs/eia923_intake/ba_prime_mover_month_audit.csv --output outputs/eia923_intake
          cat outputs/eia923_intake/hydro_pumped_month_evidence_manifest.json
      - name: Audit complete HY/PS BA-month observation coverage
        run: |
          python -m grid_resilience.eia923_hydro_coverage --input outputs/eia923_intake/ba_prime_mover_month_audit.csv --output outputs/eia923_intake
          cat outputs/eia923_intake/hydro_ps_coverage_manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eia923-2024-intake-manifests
          path: |
            outputs/eia923_intake/archive_manifest.json
            outputs/eia923_intake/workbook_structure.json
            outputs/eia923_intake/generation_schema_probe.json
            outputs/eia923_intake/generator_extraction_manifest.json
            outputs/eia923_intake/eia923_generator_month_net_mwh.csv
            outputs/eia923_intake/ba_prime_mover_month_audit.csv
            outputs/eia923_intake/prime_mover_audit_manifest.json
            outputs/eia923_intake/hydro_pumped_month_evidence.csv
            outputs/eia923_intake/hydro_pumped_month_evidence_manifest.json
            outputs/eia923_intake/page1_hydro_probe.json
            outputs/eia923_intake/page1_ba_hydro_audit.json
            outputs/eia923_intake/page1_netgen_schema.json
            outputs/eia923_intake/page1_hy_source_rows_2024.csv
            outputs/eia923_intake/page1_hy_source_inventory_manifest.json
            outputs/eia923_intake/page1_hy_plant_month_net_mwh.csv
            outputs/eia923_intake/page1_hy_netgen_manifest.json
            outputs/eia923_intake/eia923_page1_ps_plant_month_net_mwh.csv
            outputs/eia923_intake/eia923_page1_ps_manifest.json
            outputs/eia923_intake/page1_ps_ba_month_2024.csv
            outputs/eia923_intake/page1_ps_ba_month_manifest.json
            outputs/eia923_intake/hydro_ps_coverage_2024.csv
            outputs/eia923_intake/hydro_ps_coverage_manifest.json
          if-no-files-found: warn
