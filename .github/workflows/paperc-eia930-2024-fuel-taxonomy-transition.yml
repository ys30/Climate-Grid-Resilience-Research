name: Paper C EIA930 wind solar hydro storage 2024 schema-transition reporting audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paperc-eia930-2024-fuel-taxonomy-transition.yml'
      - 'src/grid_resilience/paperc_eia930_fuel_taxonomy_transition.py'
      - 'tests/test_paperc_eia930_fuel_taxonomy_transition.py'
jobs:
  source-schema-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test null and zero, source schema, exact hour partition
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_paperc_eia930_fuel_taxonomy_transition.py
      - name: Restore verified original EIA930 two-cohort source panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/transition/source outputs/transition/results
          gh run download 42462457999 --repo ys30/Climate-Grid-Resilience-Research \
            --name paperc-official-eia930-2023-2024-hourly-fuel-panel-original-schema \
            --dir outputs/transition/source
      - name: Report category-specific 2024 legacy vs modern evidence without fabricated totals
        run: |
          python -m grid_resilience.paperc_eia930_fuel_taxonomy_transition \
            --hourly outputs/transition/source/results/paperc_2023_2024_original_hourly_ba_fuel_labels.csv \
            --manifest outputs/transition/source/results/paperc_2023_2024_original_fuel_reporting_scope.json \
            --output outputs/transition/results
          python - <<'PY'
          from pathlib import Path
          import json,pandas as pd
          p=Path("outputs/transition/results")
          s=pd.read_csv(p/"paper_c_wind_solar_hydro_storage_partition_coverage.csv")
          m=json.loads((p/"paper_c_wind_solar_hydro_storage_scope.json").read_text())
          assert len(s)==52
          assert m["legacy_and_modern_schema_mwh_not_automatically_additive"]
          assert not s.cross_2024_schema_full_168h_fuel_total_certified.any()
          assert s.source_hours.eq(s.reported_hours+s.blank_hours).all()
          assert s.loc[s.blank_hours.gt(0),"partition_complete_mwh_only_if_no_blanks"].isna().all()
          modern=s[s.year.eq(2024)&s.source_half.eq("Jul_Dec")]
          assert modern.source_hours.eq(161).all()
          assert modern.loc[modern.original_category_label.eq("Wind with Integrated Battery Storage"),
                            "reported_hours"].sum()==0
          print("SOURCE-TAXONOMY HEADLINES:",s[[
              "year","ba","source_half","original_category_label","reported_hours","blank_hours",
              "partition_complete_mwh_only_if_no_blanks"]].to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paperc-eia930-2023-2024-original-renewable-storage-taxonomy-evidence
          path: outputs/transition/results/
          if-no-files-found: error
