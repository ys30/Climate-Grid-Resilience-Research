name: Inspect versioned EIA-930 half-year archive
on:
  push:
    paths:
      - '.github/workflows/eia930-zenodo-archive-inspect.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and verify pinned PUDL archived EIA-930 source
        run: |
          python - <<'PY'
          import urllib.request,hashlib,zipfile,io
          url='https://zenodo.org/records/18366739/files/eia930-2024half1.zip?download=1'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=120) as r:raw=r.read()
          digest=hashlib.md5(raw).hexdigest()
          print('source URL:',url)
          print('archive bytes:',len(raw),'md5:',digest)
          assert digest=='b8cc4d16ee54724d94ca3df4f8f1bb3a'
          z=zipfile.ZipFile(io.BytesIO(raw))
          for name in z.namelist()[:30]:
              print('member:',name)
              if name.lower().endswith('.csv'):
                  with z.open(name) as f:
                      print('csv header:',f.readline().decode('utf-8-sig',errors='replace')[:700])
                      print('csv sample:',f.readline().decode('utf-8-sig',errors='replace')[:700])
          PY
