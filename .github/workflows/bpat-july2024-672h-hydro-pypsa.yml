name: BPAT July contiguous 672h hypothetical hydro power energy PyPSA factorial
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bpat-july2024-672h-hydro-pypsa.yml'
      - 'src/grid_resilience/bpat_july2024_intertemporal_hy_pypsa.py'
      - 'tests/test_bpat_july2024_intertemporal_hy_pypsa.py'
jobs:
  four-ba-one-hydro-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      actions: read
      contents: read
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test exact original-source calendar and hydro evidence
        run: |
          python -m pip install -e '.[model,dev]'
          python -m pytest -q tests/test_bpat_july2024_intertemporal_hy_pypsa.py
      - name: Restore four observed weeks, original fleet and July EIA923 HY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/contiguous/model outputs/contiguous/scope outputs/contiguous/input outputs/contiguous/results
          gh run download 42104106361 --repo ys30/Climate-Grid-Resilience-Research --name july2024-4-disjoint-real-week-factorial-source-results --dir outputs/contiguous/model
          gh run download 42117378382 --repo ys30/Climate-Grid-Resilience-Research --name bpat-2024-july-source-eia923-hyps-eia930-hour-group-scope --dir outputs/contiguous/scope
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path("outputs/contiguous")
          ds=[];ws=[]
          for i in range(1,5):
            d=pd.read_csv(root/f"model/inputs/week_{i}/demand.csv")
            w=pd.read_csv(root/f"model/inputs/week_{i}/weather.csv")
            assert len(d)==len(w)==672
            ds.append(d);ws.append(w)
          d=pd.concat(ds,ignore_index=True)
          w=pd.concat(ws,ignore_index=True)
          assert len(d)==len(w)==2688
          assert d.timestamp.nunique()==w.timestamp.nunique()==672
          d.to_csv(root/"input/demand.csv",index=False)
          w.to_csv(root/"input/weather.csv",index=False)
          PY
      - name: Solve 16 source-anchored 672h hydro power/energy scenarios without resetting water each week
        run: |
          python -m grid_resilience.bpat_july2024_intertemporal_hy_pypsa \
            --demand outputs/contiguous/input/demand.csv \
            --weather outputs/contiguous/input/weather.csv \
            --capacity outputs/contiguous/model/inputs/frozen_partial_eia860_capacity.csv \
            --source-scope outputs/contiguous/scope/bpat_july2024_eia923_page1_hy_ps_vs_eia930_mixed_hydro.csv \
            --output outputs/contiguous/results
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root=Path("outputs/contiguous/results")
          f=pd.read_csv(root/"july_2024_672h_bpat_hy_intertemporal_factorial_by_ba_week.csv")
          h=pd.read_csv(root/"july_2024_672h_hypothetical_hy_hourly.csv")
          s=pd.read_csv(root/"july_2024_672h_hy_factorial_system.csv")
          m=json.loads((root/"july_2024_672h_hy_intertemporal_scope.json").read_text())
          assert len(f)==256 and len(h)==16*672 and len(s)==16
          assert m["noncyclic_store_one_28day_budget"]
          assert not m["historically_calibrated_capacity_or_outage_or_eens"]
          print("CI VERIFIED 672H HYPOTHETICAL HY PYPSA")
          print(s.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpat-july2024-672h-intertemporal-hy-pypsa-factorial
          path: |
            outputs/contiguous/results/july_2024_672h_bpat_hy_intertemporal_factorial_by_ba_week.csv
            outputs/contiguous/results/july_2024_672h_hypothetical_hy_by_week.csv
            outputs/contiguous/results/july_2024_672h_hypothetical_hy_hourly.csv
            outputs/contiguous/results/july_2024_672h_hy_factorial_system.csv
            outputs/contiguous/results/july_2024_672h_hy_intertemporal_scope.json
          if-no-files-found: warn
