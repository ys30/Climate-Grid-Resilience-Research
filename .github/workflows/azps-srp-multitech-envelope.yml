name: AZPS SRP official multi-technology capacity envelope
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/azps-srp-multitech-envelope.yml'
jobs:
  envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[model,dev]'
      - uses: actions/download-artifact@v4
        with:
          name: July2024-observed-input-official-storage-screening
          run-id: 41285853425
          github-token: ${{ github.token }}
          path: inputs/screening
      - uses: actions/download-artifact@v4
        with:
          name: official-eia860-2024-schema
          run-id: 41341668303
          github-token: ${{ github.token }}
          path: inputs/eia860
      - name: Run independently labeled optimistic and conservative multi-fuel availability envelope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from math import sin,pi
          import pandas as pd
          from grid_resilience.multi_technology_dispatch import solve
          source=Path('inputs/screening')
          out=Path('outputs/multitech_envelope');out.mkdir(parents=True,exist_ok=True)
          files=list(Path('inputs/eia860').rglob('eia860_plant_ba_capacity_candidates.csv'))
          assert len(files)==1,files
          fleet=pd.read_csv(files[0])
          fleet=fleet.loc[fleet.ba.isin(['AZPS','SRP'])].copy()
          assert not fleet.duplicated(['ba','technology']).any()
          assert {'AZPS','SRP'}==set(fleet.ba)
          assert {'gas','wind'}.issubset(set(fleet.technology))
          assert fleet.nameplate_capacity_mw.gt(0).all()
          # Only single-fuel included rows; all rejected multi-fuel/storage remain excluded.
          costs={'gas':70.,'wind':0.,'solar':0.,'nuclear':10.,'coal':45.,'hydro':15.,'oil':110.}
          if not set(fleet.technology).issubset(costs):raise ValueError('Unknown fuel requires explicit modeling')
          cap=fleet[['ba','technology','nameplate_capacity_mw']].rename(columns={'nameplate_capacity_mw':'capacity_mw'})
          cap['marginal_cost']=cap.technology.map(costs)
          cap.to_csv(out/'official_multitech_capacity.csv',index=False)
          # SRP hydro energy cap is an illustrative 48 full-load-hour budget
          # per 168h window, NOT inferred actual reservoir inflows.
          cap_budget=cap.copy()
          cap_budget['energy_budget_mwh']=float('nan')
          cap_budget.loc[cap_budget.technology.eq('hydro'),'energy_budget_mwh']=cap_budget.loc[cap_budget.technology.eq('hydro'),'capacity_mw']*48.0
          cap_budget.to_csv(out/'official_multitech_hydro_budget_capacity.csv',index=False)
          rows=[]
          for scenario in ('baseline','heat_wind'):
              src=source/'no_storage'/'scenario_inputs'/scenario
              demand=pd.read_csv(src/'demand.csv')
              demand=demand[demand.ba.isin(['AZPS','SRP'])].copy()
              demand.to_csv(out/f'{scenario}_demand.csv',index=False)
              original=pd.read_csv(src/'availability.csv')
              original=original[original.ba.isin(['AZPS','SRP'])].copy()
              original.timestamp=pd.to_datetime(original.timestamp,utc=True)
              originals=original.set_index(['timestamp','ba','technology']).availability_pu
              times=sorted(pd.to_datetime(demand.timestamp,utc=True).unique())
              assert len(times)==168
              for bound in ('conservative_nonwind_zero','solar_daylight_proxy_other_fuels_full','solar_daylight_hydro_budget_48h','optimistic_other_fuels_full'):
                  profiles=[]
                  for record in cap.itertuples(index=False):
                      for t in times:
                          if record.technology=='wind':
                              pu=float(originals.loc[(t,record.ba,'wind')])
                          elif record.technology=='gas':
                              pu=1.0  # original gas assumption preserved
                          elif record.technology=='solar' and bound in ('solar_daylight_proxy_other_fuels_full','solar_daylight_hydro_budget_48h'):
                              # Transparent July Arizona local-time illustrative shape;
                              # not observed ERA5 irradiance or historical plant output.
                              hour=(t.hour-7)%24
                              pu=max(0.0,sin(pi*(hour-6)/13)) if 6<=hour<=19 else 0.0
                          else:
                              pu=0.0 if bound=='conservative_nonwind_zero' else 1.0
                          profiles.append({'timestamp':t.isoformat(),'ba':record.ba,
                                           'technology':record.technology,'availability_pu':pu})
                  av=out/f'{scenario}_{bound}_availability.csv'
                  pd.DataFrame(profiles).to_csv(av,index=False)
                  dest=out/bound/scenario
                  capacity_file=(out/'official_multitech_hydro_budget_capacity.csv' if bound=='solar_daylight_hydro_budget_48h' else out/'official_multitech_capacity.csv')
                  solve(out/f'{scenario}_demand.csv',capacity_file,av,dest)
                  gen=pd.read_csv(dest/'generation_hourly.csv')
                  short=pd.read_csv(dest/'shortfall_by_ba.csv')
                  for ba in ('AZPS','SRP'):
                      rows.append({'availability_case':bound,'scenario':scenario,'ba':ba,
                                   'generation_mwh':float(gen.loc[gen.ba.eq(ba),'generation_mwh'].sum()),
                                   'shortfall_mwh':float(short.loc[short.ba.eq(ba),'unserved_energy_mwh'].iloc[0])})
          # Audit actual hydro dispatch in the solved cases, not just shortages.
          hydro_rows=[]
          for scenario in ('baseline','heat_wind'):
              for bound in ('solar_daylight_proxy_other_fuels_full','solar_daylight_hydro_budget_48h'):
                  gen=pd.read_csv(out/bound/scenario/'generation_hourly.csv')
                  for ba in ('AZPS','SRP'):
                      x=gen[(gen.ba==ba)&(gen.technology=='hydro')]
                      produced=float(x.generation_mwh.sum())
                      capacity=float(cap.loc[(cap.ba==ba)&(cap.technology=='hydro'),'capacity_mw'].sum())
                      budget=capacity*48.0
                      if bound=='solar_daylight_hydro_budget_48h' and produced>budget+1e-4:
                          raise AssertionError('Hydro budget exceeded')
                      hydro_rows.append({'scenario':scenario,'availability_case':bound,'ba':ba,
                          'hydro_generation_mwh':produced,'hydro_nameplate_mw':capacity,
                          'assumed_48h_budget_mwh':budget,
                          'budget_utilization_fraction':produced/budget if budget>0 else None,
                          'budget_near_binding':abs(produced-budget)<1e-3 if capacity>0 and bound=='solar_daylight_hydro_budget_48h' else False})
          hydro=pd.DataFrame(hydro_rows)
          hydro.to_csv(out/'hydro_budget_dispatch_diagnostic.csv',index=False)
          print('HYDRO ENERGY BUDGET UTILIZATION (MODEL OUTPUT, NOT OBSERVED)')
          print(hydro.to_string(index=False))
          # Explain which technologies replace the constrained hydro generation.
          substitutions=[]
          for scenario in ('baseline','heat_wind'):
              cases={}
              for label in ('solar_daylight_proxy_other_fuels_full','solar_daylight_hydro_budget_48h'):
                  gen=pd.read_csv(out/label/scenario/'generation_hourly.csv')
                  cases[label]=gen.groupby(['ba','technology']).generation_mwh.sum()
              before=cases['solar_daylight_proxy_other_fuels_full']
              after=cases['solar_daylight_hydro_budget_48h']
              for ba,tech in sorted(set(before.index)|set(after.index)):
                  base=float(before.get((ba,tech),0))
                  constrained=float(after.get((ba,tech),0))
                  substitutions.append({'scenario':scenario,'ba':ba,'technology':tech,
                     'unconstrained_hydro_case_mwh':base,
                     'constrained_hydro_case_mwh':constrained,
                     'generation_change_mwh':constrained-base})
          replacements=pd.DataFrame(substitutions)
          replacements.to_csv(out/'hydro_budget_technology_redispatch.csv',index=False)
          for scenario in ('baseline','heat_wind'):
              x=replacements[(replacements.scenario==scenario)&(replacements.ba=='SRP')]
              # No storage or links; same demand; both cases have zero shortage.
              assert abs(x.generation_change_mwh.sum())<1e-3, x.to_string(index=False)
              hydro_delta=float(x.loc[x.technology.eq('hydro'),'generation_change_mwh'].iloc[0])
              assert hydro_delta < -1e-3
              assert abs(x.loc[~x.technology.eq('hydro'),'generation_change_mwh'].sum()+hydro_delta)<1e-3
          print('HYDRO BUDGET TECHNOLOGY REDISPATCH (MWh; MODEL ONLY)')
          print(replacements.to_string(index=False))
          # Independent SRP adequacy stress: reduce assumed coal/nuclear
          # availability while keeping all other assumptions unchanged.
          stress=[]
          for scenario in ('baseline','heat_wind'):
              base=out/f'{scenario}_demand.csv'
              original=out/f'{scenario}_solar_daylight_hydro_budget_48h_availability.csv'
              availability=pd.read_csv(original)
              for coal_pu,nuclear_pu in ((1.0,1.0),(0.5,1.0),(1.0,0.75),(0.5,0.75)):
                  a=availability.copy()
                  a.loc[a.technology.eq('coal'),'availability_pu']=coal_pu
                  a.loc[a.technology.eq('nuclear'),'availability_pu']=nuclear_pu
                  label=f'coal_{int(coal_pu*100)}_nuclear_{int(nuclear_pu*100)}'
                  path=out/f'{scenario}_{label}_availability.csv'
                  a.to_csv(path,index=False)
                  destination=out/'coal_nuclear_stress'/scenario/label
                  solve(base,out/'official_multitech_hydro_budget_capacity.csv',path,destination)
                  shortage=pd.read_csv(destination/'shortfall_by_ba.csv')
                  gen=pd.read_csv(destination/'generation_hourly.csv')
                  for ba in ('AZPS','SRP'):
                      part=gen[gen.ba.eq(ba)]
                      stress.append({'scenario':scenario,'ba':ba,'coal_availability_pu':coal_pu,
                          'nuclear_availability_pu':nuclear_pu,
                          'shortfall_mwh':float(shortage.loc[shortage.ba.eq(ba),'unserved_energy_mwh'].iloc[0]),
                          'hydro_generation_mwh':float(part.loc[part.technology.eq('hydro'),'generation_mwh'].sum()),
                          'coal_generation_mwh':float(part.loc[part.technology.eq('coal'),'generation_mwh'].sum()),
                          'gas_generation_mwh':float(part.loc[part.technology.eq('gas'),'generation_mwh'].sum())})
          sensitivity=pd.DataFrame(stress)
          assert len(sensitivity)==16
          sensitivity.to_csv(out/'coal_nuclear_assumed_availability_sensitivity.csv',index=False)
          print('SRP COAL AND NUCLEAR ASSUMED AVAILABILITY STRESS')
          print(sensitivity[sensitivity.ba.eq('SRP')].to_string(index=False))
          # Gas derating threshold under independently labeled coal/nuclear stress.
          gas_rows=[]
          for scenario in ('baseline','heat_wind'):
              base=out/f'{scenario}_demand.csv'
              source_av=pd.read_csv(out/f'{scenario}_solar_daylight_hydro_budget_48h_availability.csv')
              for coal_pu,nuclear_pu in ((1.0,1.0),(0.5,0.75)):
                  for gas_pu in (1.0,0.75,0.5,0.25,0.0):
                      av=source_av.copy()
                      av.loc[av.technology.eq('coal'),'availability_pu']=coal_pu
                      av.loc[av.technology.eq('nuclear'),'availability_pu']=nuclear_pu
                      av.loc[av.technology.eq('gas'),'availability_pu']=gas_pu
                      label=f'coal_{int(coal_pu*100)}_nuclear_{int(nuclear_pu*100)}_gas_{int(gas_pu*100)}'
                      path=out/f'{scenario}_{label}_availability.csv'
                      av.to_csv(path,index=False)
                      dest=out/'gas_derating_stress'/scenario/label
                      solve(base,out/'official_multitech_hydro_budget_capacity.csv',path,dest)
                      shortage=pd.read_csv(dest/'shortfall_by_ba.csv')
                      for ba in ('AZPS','SRP'):
                          gas_rows.append({'scenario':scenario,'ba':ba,'coal_availability_pu':coal_pu,
                            'nuclear_availability_pu':nuclear_pu,'gas_availability_pu':gas_pu,
                            'shortfall_mwh':float(shortage.loc[shortage.ba.eq(ba),'unserved_energy_mwh'].iloc[0])})
          gas_sensitivity=pd.DataFrame(gas_rows)
          assert len(gas_sensitivity)==40
          gas_sensitivity.to_csv(out/'gas_derating_threshold_sensitivity.csv',index=False)
          for (_,_,_),group in gas_sensitivity.groupby(['scenario','ba','coal_availability_pu']):
              ordered=group.sort_values('gas_availability_pu')
              assert (ordered.shortfall_mwh.diff().dropna()<=1e-3).all()
          print('SRP GAS DERATING THRESHOLD SENSITIVITY (MODEL ONLY)')
          print(gas_sensitivity[gas_sensitivity.ba.eq('SRP')].to_string(index=False))
          result=pd.DataFrame(rows)
          assert len(result)==16
          result.to_csv(out/'official_multitech_availability_envelope.csv',index=False)
          pivot=result.pivot(index=['scenario','ba'],columns='availability_case',values='shortfall_mwh')
          assert (pivot['optimistic_other_fuels_full']<=pivot['conservative_nonwind_zero']+1e-4).all()
          assert (pivot['optimistic_other_fuels_full']<=pivot['solar_daylight_proxy_other_fuels_full']+1e-4).all()
          assert (pivot['solar_daylight_proxy_other_fuels_full']<=pivot['conservative_nonwind_zero']+1e-4).all()
          assert (pivot['solar_daylight_hydro_budget_48h']+1e-4>=pivot['solar_daylight_proxy_other_fuels_full']).all()
          (out/'manifest.json').write_text(json.dumps({
             'study_type':'extreme_assumption_envelope_not_historical_replay',
             'fleet':'EIA-860 Plant BA 2024 Operable single-fuel technology candidates',
             'conservative_other_technologies':'all omitted non-gas/non-wind unavailable (0%)',
             'optimistic_other_technologies':'all omitted non-gas/non-wind fully available (100%)',
             'intermediate_case':'other non-gas/non-wind fuels fully available; solar 0 at illustrative local night, daylight sin(pi*(hour-6)/13)',
             'solar_proxy_is_observed':False,
             'hydro_budget_case':'solar-daylight case plus hydro generation limited to 48 full-load hours over 168h',
             'hydro_energy_budget_is_observed':False,
             'gas':'100% assumed hourly available in BOTH envelopes',
             'wind':'existing matched scenario profile, fixed in BOTH envelopes',
             'costs':'assumed marginal_cost by technology',
             'transmission':'none','storage':'none',
             'excluded_generator_capacity':'never added',
             'historical_calibration_certified':False},indent=2)+'\\n')
          print('OFFICIAL MULTI-TECHNOLOGY EXTREME AVAILABILITY ENVELOPE')
          print(result.to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AZPS-SRP-2024-OFFICIAL-MULTITECH-ENVELOPE
          path: outputs/multitech_envelope
          if-no-files-found: warn
