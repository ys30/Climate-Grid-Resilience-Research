name: EIA-930 archived data to monthly PyPSA (manual provenance gate)
on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: 'Public immutable HTTPS URL of official EIA-930 Balance CSV/ZIP (not assumed to be accessible)'
        required: true
        type: string
      archive_sha256:
        description: 'Expected lowercase SHA256 of original download'
        required: true
        type: string
      ba:
        description: 'Balancing authority'
        required: true
        default: 'SRP'
        type: string
      year:
        description: 'UTC calendar year'
        required: true
        default: '2024'
        type: string
      month:
        description: 'UTC calendar month'
        required: true
        default: '1'
        type: string
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[model]'
      - name: Verify exact source bytes and enforce HTTPS
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          mkdir -p outputs/source_verified
          python - <<'PY'
          import os,hashlib,re,urllib.request
          from pathlib import Path
          u=os.environ['ARCHIVE_URL'];expected=os.environ['ARCHIVE_SHA256']
          if not u.startswith('https://'):raise ValueError('HTTPS required')
          if not re.fullmatch(r'[a-f0-9]{64}',expected):raise ValueError('SHA256 must be lowercase 64 hex chars')
          req=urllib.request.Request(u,headers={'User-Agent':'ClimateGridResearch/1.0'})
          with urllib.request.urlopen(req,timeout=120) as response:
              if response.url.split(':',1)[0]!='https':raise ValueError('Non-HTTPS redirect')
              payload=response.read(100_000_001)
          if len(payload)>100_000_000:raise ValueError('Archive too large')
          actual=hashlib.sha256(payload).hexdigest()
          if actual!=expected:raise ValueError('Checksum mismatch')
          Path('outputs/source_verified/original_archive').write_bytes(payload)
          Path('outputs/source_verified/archive_sha256.txt').write_text(actual+'\n')
          print('Verified immutable input hash:',actual)
          PY
      - name: Validate complete observed UTC month
        env:
          BA: ${{ inputs.ba }}
          YEAR: ${{ inputs.year }}
          MONTH: ${{ inputs.month }}
        run: |
          python -m grid_resilience.eia930_balance_archive_import --archive outputs/source_verified/original_archive --ba "$BA" --year "$YEAR" --month "$MONTH" --output outputs/source_verified/observed_demand.csv
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv('outputs/source_verified/observed_demand.csv')
          print('Validated source rows:',len(x))
          print('Observed demand sum (MWh):',x.demand_mw.sum())
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: eia930-authentic-source-hourly-month
          path: |
            outputs/source_verified/observed_demand.csv
            outputs/source_verified/archive_sha256.txt
