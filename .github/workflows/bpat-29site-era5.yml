name: BPAT 29-site ERA5 wind weather comparison
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bpat-29site-era5.yml'
      - 'src/grid_resilience/bpat_era5_plant_weighted.py'
      - 'src/grid_resilience/bpat_29site_weather_comparison.py'
      - 'src/grid_resilience/bpat_29site_time_block_diagnostics.py'
      - 'src/grid_resilience/bpat_29site_error_diagnostics.py'
      - 'src/grid_resilience/bpat_29site_reference_benchmarks.py'
      - 'src/grid_resilience/bpat_era5_pypsa_availability.py'
      - 'src/grid_resilience/bpat_era5_pypsa_conditional_solve.py'
      - 'src/grid_resilience/bpat_era5_replay_dispatch_audit.py'
      - 'src/grid_resilience/bpat_era5_dispatch_balance.py'
      - 'src/grid_resilience/bpat_era5_matched_hydro_sensitivity.py'
      - 'src/grid_resilience/bpat_hydro_wind_interaction_interpretation.py'
      - 'src/grid_resilience/bpat_hydro_wind_heatmaps.py'
      - 'src/grid_resilience/bpat_hydro_constraint_regimes.py'
      - 'src/grid_resilience/bpat_wind_temporal_holdout.py'
      - 'tests/test_bpat_era5_pypsa_availability.py'
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and Excel reader
        run: python -m pip install -e '.[model]' openpyxl matplotlib
      - name: Verify independent ERA5 wind availability can enter PyPSA input
        run: python tests/test_bpat_era5_pypsa_availability.py
      - name: Fetch 2024 EIA-860 and EIA-930 official historical inputs
        run: |
          mkdir -p outputs/bpat_29site_weather
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          sources={
            "eia8602024.zip":"https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602024.zip",
            "eia930_balance.csv":"https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2024_Jan_Jun.csv"}
          for name,url in sources.items():
              with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=150) as r:
                  Path("outputs/bpat_29site_weather",name).write_bytes(r.read())
          PY
      - name: Link all BPAT wind plants to EIA-860 location and nameplate
        run: |
          python -m grid_resilience.eia860_generator_extract --archive outputs/bpat_29site_weather/eia8602024.zip --output outputs/bpat_29site_weather
          python -m grid_resilience.eia860_wind_plant_locations --archive outputs/bpat_29site_weather/eia8602024.zip --generators outputs/bpat_29site_weather/eia860_2024_operable_generators.csv --output outputs/bpat_29site_weather
          python -m grid_resilience.bpat_wind_plant_weather_sampling_plan --locations outputs/bpat_29site_weather/eia860_2024_wind_plant_locations.csv --output outputs/bpat_29site_weather --max-points 30
      - name: Fetch 29 ERA5 wind plant hourly weather series and weight by nameplate
        run: |
          python -m grid_resilience.bpat_era5_plant_weighted --plants outputs/bpat_29site_weather/bpat_era5_sampling_plan.csv --output outputs/bpat_29site_weather
      - name: Compare 29-site wind proxy with BPAT observed wind hourly output
        run: |
          python -m grid_resilience.eia860_plant_ba_capacity --archive outputs/bpat_29site_weather/eia8602024.zip --generators outputs/bpat_29site_weather/eia860_2024_operable_generators.csv --output outputs/bpat_29site_weather
          python -m grid_resilience.bpat_wind_observation_audit --balance outputs/bpat_29site_weather/eia930_balance.csv --capacity outputs/bpat_29site_weather/eia860_plant_ba_capacity_candidates.csv --output outputs/bpat_29site_weather
          python -m grid_resilience.bpat_29site_weather_comparison --weighted outputs/bpat_29site_weather/bpat_era5_capacity_weighted_hourly.csv --observed outputs/bpat_29site_weather/bpat_reported_wind_hourly.csv --capacity-mw 3617.1 --output outputs/bpat_29site_weather
          cat outputs/bpat_29site_weather/bpat_29site_comparison_manifest.json
          python -m grid_resilience.bpat_29site_time_block_diagnostics --hourly outputs/bpat_29site_weather/bpat_29site_proxy_vs_reported.csv --output outputs/bpat_29site_weather
          cat outputs/bpat_29site_weather/bpat_29site_time_block_correlation.csv
          python -m grid_resilience.bpat_29site_error_diagnostics --hourly outputs/bpat_29site_weather/bpat_29site_proxy_vs_reported.csv --output outputs/bpat_29site_weather
          cat outputs/bpat_29site_weather/bpat_29site_proxy_error_diagnostics.csv
          python -m grid_resilience.bpat_29site_reference_benchmarks --hourly outputs/bpat_29site_weather/bpat_29site_proxy_vs_reported.csv --output outputs/bpat_29site_weather
          cat outputs/bpat_29site_weather/bpat_29site_reference_benchmark.csv
          python -m grid_resilience.bpat_wind_temporal_holdout \
            --input outputs/bpat_29site_weather/bpat_29site_proxy_vs_reported.csv \
            --output outputs/bpat_29site_weather
          cat outputs/bpat_29site_weather/bpat_wind_temporal_holdout.csv
      - name: Run conditional four-BA PyPSA with real ERA5 BPAT wind proxy
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          from grid_resilience.eia930_six_month_demand import extract
          root=Path("outputs/bpat_29site_weather")
          extract(root/"eia930_balance.csv",root/"model_inputs")
          c=pd.read_csv(root/"eia860_plant_ba_capacity_candidates.csv")
          prices={"solar":0,"wind":0,"nuclear":10,"coal":35,"gas":55,"oil":110}
          c=c[c.technology.isin(prices)].copy()
          c=c.rename(columns={"nameplate_capacity_mw":"capacity_mw"})
          c=c[["ba","technology","capacity_mw"]].copy()
          c["marginal_cost"]=c.technology.map(prices)
          assert set(c.ba)=={"AZPS","BPAT","CISO","SRP"}
          demand=pd.read_csv(root/"model_inputs"/"hourly_ba_demand.csv")
          ts=demand[["timestamp"]].drop_duplicates().assign(key=1)
          plants=c[["ba","technology"]].assign(key=1)
          a=ts.merge(plants,on="key").drop(columns="key")
          a["availability_pu"]=1.0
          c.to_csv(root/"model_inputs"/"capacity.csv",index=False)
          a.to_csv(root/"model_inputs"/"availability.csv",index=False)
          PY
          python -m grid_resilience.bpat_era5_pypsa_conditional_solve \
            --demand outputs/bpat_29site_weather/model_inputs/hourly_ba_demand.csv \
            --capacity outputs/bpat_29site_weather/model_inputs/capacity.csv \
            --availability outputs/bpat_29site_weather/model_inputs/availability.csv \
            --weather outputs/bpat_29site_weather/bpat_era5_capacity_weighted_hourly.csv \
            --observed-wind outputs/bpat_29site_weather/bpat_reported_wind_hourly.csv \
            --output outputs/bpat_29site_weather/conditional_pypsa
          cat outputs/bpat_29site_weather/conditional_pypsa/bpat_era5_pypsa_conditional_shortfall.csv
          python -m grid_resilience.bpat_era5_replay_dispatch_audit --root outputs/bpat_29site_weather/conditional_pypsa
          python -m grid_resilience.bpat_era5_dispatch_balance --root outputs/bpat_29site_weather/conditional_pypsa --output outputs/bpat_29site_weather/conditional_pypsa
          python -m grid_resilience.bpat_eia930_hydro_observation \
            --balance outputs/bpat_29site_weather/eia930_balance.csv \
            --capacity outputs/bpat_29site_weather/eia860_plant_ba_capacity_candidates.csv \
            --output outputs/bpat_29site_weather/hydro_context
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path("outputs/bpat_29site_weather/hydro_context")
          m=json.loads((r/"bpat_eia930_hydro_observation_manifest.json").read_text())
          (r/"hydro_energy_reference.json").write_text(json.dumps({
            "reported_mixed_hydro_pumped_net_mwh":m["eia930_mixed_hydro_and_pumped_reported_monthly_net_mwh"],
            "not_physical_hydro_budget":True},indent=2))
          PY
          python -m grid_resilience.bpat_era5_matched_hydro_sensitivity \
            --root outputs/bpat_29site_weather/conditional_pypsa \
            --hydro-capacity outputs/bpat_29site_weather/eia860_plant_ba_capacity_candidates.csv \
            --hydro-context outputs/bpat_29site_weather/hydro_context/hydro_energy_reference.json \
            --output outputs/bpat_29site_weather/matched_hydro_comparison
          cat outputs/bpat_29site_weather/matched_hydro_comparison/bpat_matched_hydro_weather_comparison.csv
          python -m grid_resilience.bpat_hydro_wind_interaction_interpretation \
            --input outputs/bpat_29site_weather/matched_hydro_comparison/bpat_matched_hydro_weather_comparison.csv \
            --output outputs/bpat_29site_weather/matched_hydro_comparison
          cat outputs/bpat_29site_weather/matched_hydro_comparison/hydro_wind_interaction_interpretation.json
          python -m grid_resilience.bpat_hydro_wind_heatmaps \
            --input outputs/bpat_29site_weather/matched_hydro_comparison/bpat_matched_hydro_weather_comparison.csv \
            --output outputs/bpat_29site_weather/matched_hydro_comparison/figures
          cat outputs/bpat_29site_weather/matched_hydro_comparison/figures/crossed_hydro_wind_plot_manifest.json
          python -m grid_resilience.bpat_hydro_constraint_regimes \
            --input outputs/bpat_29site_weather/matched_hydro_comparison/bpat_matched_hydro_weather_comparison.csv \
            --output outputs/bpat_29site_weather/matched_hydro_comparison
          cat outputs/bpat_29site_weather/matched_hydro_comparison/hydro_constraint_regimes_manifest.json
          cat outputs/bpat_29site_weather/conditional_pypsa/bpat_era5_minus_replay_technology_totals.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpat-era5-29-plant-capacity-weighted
          if-no-files-found: warn
          path: |
            outputs/bpat_29site_weather/bpat_era5_sampling_plan.csv
            outputs/bpat_29site_weather/bpat_era5_plant_hourly.csv
            outputs/bpat_29site_weather/bpat_era5_capacity_weighted_hourly.csv
            outputs/bpat_29site_weather/bpat_era5_plant_weighted_manifest.json
            outputs/bpat_29site_weather/bpat_29site_proxy_vs_reported.csv
            outputs/bpat_29site_weather/bpat_29site_comparison_manifest.json
            outputs/bpat_29site_weather/conditional_pypsa/bpat_era5_pypsa_conditional_shortfall.csv
            outputs/bpat_29site_weather/conditional_pypsa/bpat_era5_pypsa_conditional_manifest.json
            outputs/bpat_29site_weather/conditional_pypsa/bpat_era5_vs_replay_dispatch_audit.json
            outputs/bpat_29site_weather/conditional_pypsa/bpat_era5_minus_replay_technology_totals.csv
            outputs/bpat_29site_weather/conditional_pypsa/bpat_era5_replay_generation_balance_manifest.json
            outputs/bpat_29site_weather/matched_hydro_comparison/bpat_matched_hydro_weather_comparison.csv
            outputs/bpat_29site_weather/matched_hydro_comparison/bpat_matched_hydro_weather_manifest.json
            outputs/bpat_29site_weather/matched_hydro_comparison/fixed_hydro_power_energy_budget_comparison.csv
            outputs/bpat_29site_weather/matched_hydro_comparison/hydro_wind_interaction_interpretation.json
            outputs/bpat_29site_weather/matched_hydro_comparison/figures/
            outputs/bpat_29site_weather/matched_hydro_comparison/hydro_constraint_finite_differences.csv
            outputs/bpat_29site_weather/matched_hydro_comparison/hydro_constraint_regimes_manifest.json
            outputs/bpat_29site_weather/bpat_29site_time_block_correlation.csv
            outputs/bpat_29site_weather/bpat_29site_time_block_manifest.json
            outputs/bpat_29site_weather/bpat_29site_proxy_error_diagnostics.csv
            outputs/bpat_29site_weather/bpat_29site_proxy_error_manifest.json
            outputs/bpat_29site_weather/bpat_29site_reference_benchmark.csv
            outputs/bpat_29site_weather/bpat_29site_reference_benchmark_manifest.json
            outputs/bpat_29site_weather/bpat_wind_temporal_holdout.csv
            outputs/bpat_29site_weather/bpat_wind_temporal_holdout_manifest.json
