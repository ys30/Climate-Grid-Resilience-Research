name: BPAT 29-site ERA5 wind weather comparison
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bpat-29site-era5.yml'
      - 'src/grid_resilience/bpat_era5_plant_weighted.py'
      - 'src/grid_resilience/bpat_29site_weather_comparison.py'
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and Excel reader
        run: python -m pip install -e . openpyxl
      - name: Fetch 2024 EIA-860 and EIA-930 official historical inputs
        run: |
          mkdir -p outputs/bpat_29site_weather
          python - <<'PY'
          from urllib.request import Request,urlopen
          from pathlib import Path
          sources={
            "eia8602024.zip":"https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602024.zip",
            "eia930_balance.csv":"https://www.eia.gov/electricity/gridmonitor/sixMonthFiles/EIA930_BALANCE_2024_Jan_Jun.csv"}
          for name,url in sources.items():
              with urlopen(Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=150) as r:
                  Path("outputs/bpat_29site_weather",name).write_bytes(r.read())
          PY
      - name: Link all BPAT wind plants to EIA-860 location and nameplate
        run: |
          python -m grid_resilience.eia860_generator_extract --archive outputs/bpat_29site_weather/eia8602024.zip --output outputs/bpat_29site_weather
          python -m grid_resilience.eia860_wind_plant_locations --archive outputs/bpat_29site_weather/eia8602024.zip --generators outputs/bpat_29site_weather/eia860_2024_operable_generators.csv --output outputs/bpat_29site_weather
          python -m grid_resilience.bpat_wind_plant_weather_sampling_plan --locations outputs/bpat_29site_weather/eia860_2024_wind_plant_locations.csv --output outputs/bpat_29site_weather --max-points 30
      - name: Fetch 29 ERA5 wind plant hourly weather series and weight by nameplate
        run: |
          python -m grid_resilience.bpat_era5_plant_weighted --plants outputs/bpat_29site_weather/bpat_era5_sampling_plan.csv --output outputs/bpat_29site_weather
      - name: Compare 29-site wind proxy with BPAT observed wind hourly output
        run: |
          python -m grid_resilience.eia860_plant_ba_capacity --archive outputs/bpat_29site_weather/eia8602024.zip --generators outputs/bpat_29site_weather/eia860_2024_operable_generators.csv --output outputs/bpat_29site_weather
          python -m grid_resilience.bpat_wind_observation_audit --balance outputs/bpat_29site_weather/eia930_balance.csv --capacity outputs/bpat_29site_weather/eia860_plant_ba_capacity_candidates.csv --output outputs/bpat_29site_weather
          python -m grid_resilience.bpat_29site_weather_comparison --weighted outputs/bpat_29site_weather/bpat_era5_capacity_weighted_hourly.csv --observed outputs/bpat_29site_weather/bpat_reported_wind_hourly.csv --capacity-mw 3617.1 --output outputs/bpat_29site_weather
          cat outputs/bpat_29site_weather/bpat_29site_comparison_manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpat-era5-29-plant-capacity-weighted
          if-no-files-found: warn
          path: |
            outputs/bpat_29site_weather/bpat_era5_sampling_plan.csv
            outputs/bpat_29site_weather/bpat_era5_plant_hourly.csv
            outputs/bpat_29site_weather/bpat_era5_capacity_weighted_hourly.csv
            outputs/bpat_29site_weather/bpat_era5_plant_weighted_manifest.json
            outputs/bpat_29site_weather/bpat_29site_proxy_vs_reported.csv
            outputs/bpat_29site_weather/bpat_29site_comparison_manifest.json
